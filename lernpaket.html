const UQ=new URLSearchParams(location.search).get('u')||window.CM_EMBED_U||'l16a',P=(window.LP||{})[UQ];
const KEY='cm-lp-'+UQ;let ST={};try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}

let CURK=null;function goStep(k){const x=STEPS.find(y=>y[0]===k);if(!x)return home();CURK=k;x[4]();scrollTo(0,0)}
function frame(inner){const i=CURK?STEPS.findIndex(x=>x[0]===CURK):-1,x=STEPS[i],nx=i>=0?STEPS[i+1]:null,done=CURK&&ST[CURK];

 app.querySelector('[data-home]').onclick=home;for(const s of ['[data-home2]','[data-home3]']){const h=app.querySelector(s);if(h)h.onclick=home}const n=app.querySelector('[data-nextst]');if(n)n.onclick=()=>goStep(nx[0]);const tb=app.querySelector('[data-txt]');if(tb)tb.onclick=textSheet}

/* ---------- Lernpaket aus lp-data.js ---------- */
/* ---------- Schulbuch-Material: private Datei (.cmeinheit), nur lokal im Gerät ---------- */
let BOOK=null;const UID=UQ,BOOKID=P?P.bookId:'';

const bookOk=u=>!!(u&&u.type==='classroom-lerneinheit'&&u.id===BOOKID);
async function bookInit(){try{const u=window.CM_EMBED_BOOK||await IDB('readonly',st=>st.get(BOOKID));if(bookOk(u)){BOOK=u;if(!CURK&&!app.querySelector('.names'))home()}}catch{}}
function bookPick(){const i=document.createElement('input');i.type='file';i.style.display='none';document.body.append(i);

async function bookDrop(){if(!confirm('Übungen aus dem Buch von diesem Gerät entfernen? (Deine Ergebnisse bleiben.)'))return;BOOK=null;try{await IDB('readwrite',st=>st.delete(BOOKID))}catch{}home()}
function shuffleOnce(k,a){ST.ord??={};if(!ST.ord[k]||ST.ord[k].length!==a.length){ST.ord[k]=shuffle(a);save()}return ST.ord[k]}
/* Welche Fassung (Buch oder eigene Beispiele) eine Station nutzt, bleibt ab dem ersten Öffnen gleich */
function DATA(st){ST.vb??={};const hasB=!!(BOOK&&BOOK.ex&&st.book&&BOOK.ex[st.book]);if(ST.vb[st.k]==null){ST.vb[st.k]=hasB?1:0;save()}return ST.vb[st.k]&&hasB?BOOK.ex[st.book]:st.own}

/* ---------- Ziehen (Finger oder Maus) – Tippen geht immer auch ---------- */
function dragify(onDrop){app.querySelectorAll('[data-dg]').forEach(el=>el.addEventListener('pointerdown',e=>{if(e.button)return;const sx=e.clientX,sy=e.clientY;let g=null,ox=0,oy=0,hov=null;
 const mv=ev=>{if(!g){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;const r=el.getBoundingClientRect();g=el.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-dg');g.style.width=r.width+'px';ox=sx-r.left;oy=sy-r.top;document.body.append(g);el.style.opacity='.3'}
  ev.preventDefault();g.style.left=(ev.clientX-ox)+'px';g.style.top=(ev.clientY-oy)+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop]');if(t!==hov){hov?.classList.remove('hov');hov=t;hov?.classList.add('hov')}};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(!g)return;g.remove();el.style.opacity='';hov?.classList.remove('hov');el.dataset.moved='1';setTimeout(()=>delete el.dataset.moved,60);
  const t=ev.type==='pointerup'?document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop]'):null;if(t)onDrop(el.dataset.dg,t.dataset.drop)};
 addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up)}))}
const tries=(N,ok)=>fb(0,'⚠︎ '+ok+' von '+N+' richtig – diese Punkte zählen. Die falschen liegen wieder bereit: <b>ein</b> zweiter Versuch (ohne Punkte).');
const head=(o)=>'<h2>'+md(o.h||'')+'</h2>'+(o.task?'<p style="margin:0">'+md(o.task)+'</p>':'');

/* ===== Zuordnen (auch Raster und mehrere richtige Felder) ===== */
function wSorter(st,o){const k=st.k;let pick=null;const pl=ST[k+'P']??={},N=o.items.length,R=()=>ST[k+'R']||0,sol=ST[k+'S']??=[];const ord=shuffleOnce(k,o.items.map((_,i)=>i));
 const acc=i=>[].concat(o.items[i][1]),good=i=>acc(i).includes(pl[i]),fixed=i=>R()>0&&pl[i]!=null&&good(i);
 const draw=()=>keep(k,()=>{const n=Object.keys(pl).length,r=R();
  frame('<div class="card">'+head(o)+'<p class="muted" style="margin:6px 0 0">'+n+' von '+N+' zugeordnet</p><div class="pool" style="margin-top:12px">'+ord.map(i=>pl[i]==null?'<button class="chip'+(pick===i?' on':'')+'" data-c="'+i+'" data-dg="'+i+'">'+esc(o.items[i][0])+'</button>':'').join('')+'</div>'
   +'<div class="cols '+(o.grid?'grid2':'c'+o.cats.length)+'">'+o.cats.map((c,e)=>'<div class="col'+(pick!=null?' tgt':'')+'" data-col="'+e+'" data-drop="'+e+'"><h3>'+esc(c)+'</h3>'+ord.map(i=>pl[i]!==e?'':sol.includes(i)?'<span class="chip sol">'+esc(o.items[i][0])+'</span>':fixed(i)?'<span class="chip ok">'+esc(o.items[i][0])+'</span>':'<button class="chip" data-back="'+i+'" data-dg="'+i+'">'+esc(o.items[i][0])+'</button>').join('')+'</div>').join('')+'</div>'
   +(r<2?'<div class="row"><div class="sp"></div><button class="pri" data-chk '+(n<N?'disabled':'')+'>'+(r?'Zweiter Versuch: prüfen':'Prüfen')+'</button></div>':'')
   +(r===1?tries(N,ST[k].p):r===2?(ST[k].p===N?fb(1,'⭐ Alles auf Anhieb richtig! '+md(o.done||'')):fb(0,ST[k].p+' von '+N+' beim ersten Versuch richtig. '+(sol.length?'Gelb umrandet: die richtige Lösung. ':'')+md(o.done||''))):'')+'</div>');
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(b.dataset.moved)return;pick=pick===+b.dataset.c?null:+b.dataset.c;draw()});
  app.querySelectorAll('[data-col]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-back]')||pick==null)return;pl[pick]=+c.dataset.col;pick=null;save();draw()});
  app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(b.dataset.moved)return;delete pl[+b.dataset.back];save();draw()});
  dragify((i,e)=>{if(fixed(+i)||R()>=2)return;pl[+i]=+e;pick=null;save();draw()});
  const chk=app.querySelector('[data-chk]');if(chk)chk.onclick=()=>{const wrong=o.items.map((_,i)=>good(i)?-1:i).filter(i=>i>=0);
   if(R()===0){fin(k,N-wrong.length,N,wrong);if(wrong.length){wrong.forEach(i=>delete pl[i]);ST[k+'R']=1}else ST[k+'R']=2}else{wrong.forEach(i=>{pl[i]=acc(i)[0];sol.push(i)});ST[k+'R']=2}save();draw()}});draw()}

/* ===== Wischen ===== */
function wSwiper(st,o){const k=st.k,A=ST[k+'A']??=[];const ord=shuffleOnce(k,o.cards.map((_,i)=>i));let show=null;

  frame('<div class="card">'+head(o)+'<div class="prog"><span class="sp" style="flex:1"></span><span>'+Math.min(n+(show==null&&n<N?1:0),N)+' von '+N+'</span></div>'+deck+'</div>');
  const ans=v=>{A.push(!!v);show=cur;if(A.length===N)fin(k,ord.filter((i,j)=>A[j]===o.cards[i][1]).length,N,ord.filter((i,j)=>A[j]!==o.cards[i][1]));else save();draw()};
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>ans(b.dataset.a==='1'));const nx=app.querySelector('[data-nx]');if(nx)nx.onclick=()=>{show=null;draw()};

   sc.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;sc.style.transform='translateX('+dx+'px) rotate('+dx/18+'deg)';tl.style.opacity=Math.max(0,-dx/90);tr.style.opacity=Math.max(0,dx/90)};

/* ===== Antippen (Fragen mit Auswahl) ===== */
function wQuiz(st,o){const k=st.k,A=ST[k+'A']??=[];let qi=SOLV?0:Math.min(A.length,o.qs.length-1);const opts=q=>Array.isArray(q[1])?q[1]:o.opts,ans=q=>Array.isArray(q[1])?q[2]:q[1],ex=q=>Array.isArray(q[1])?q[3]:q[2];
 const draw=()=>keep(k,()=>{const q=o.qs[qi],a=A[qi],N=o.qs.length;

/* ===== Pantomime: iPad als Spielkarte ===== */
function wPant(st,o){const k=st.k;let w=null,t=0,tm=null;
 const draw=()=>{frame('<div class="card pant">'+(w?'<div class="muted">Stelle dieses Verb pantomimisch dar – die anderen raten:</div><div class="pword">'+esc(w)+'</div><div class="ptime">'+(t>0?t+' s':'⏰ Zeit!')+'</div>':'<h2>Pantomime</h2><p>Ziehe eine Karte. Nur du siehst das Wort: Stelle es pantomimisch dar. Die anderen raten auf Latein. Du hast 60 Sekunden.</p>')
  +'<div class="row" style="justify-content:center"><button class="pri" data-new>'+(w?'Neue Karte':'Karte ziehen')+'</button>'+(w?'<button class="sec" data-hide>Verdecken</button>':'')+'</div></div>');
  app.querySelector('[data-new]').onclick=()=>{const L=o.words;w=L[Math.random()*L.length|0];t=60;clearInterval(tm);tm=setInterval(()=>{t--;if(t<=0)clearInterval(tm);if(CURK===k)draw()},1000);if(!ST[k]){ST[k]={};save()}draw()};
  const h=app.querySelector('[data-hide]');if(h)h.onclick=()=>{w=null;clearInterval(tm);draw()}};draw()}

/* ===== 11.40: Text lesen – zu jeder Frage den passenden Satz antippen (2 Versuche, nur der erste zählt) ===== */
function wRead(st,o){const k=st.k,A=ST[k+'A']??=[],N=o.qs.length,T=o.paras.flat();let qi=0;while(!SOLV&&qi<N-1&&A[qi]&&A[qi].e)qi++;
 const draw=()=>keep(k,()=>{const q=o.qs[qi],a=A[qi]||{w:[]},ok=a.r===q[1],end=!!a.e;let n=0;
  const txt=o.paras.map(pa=>'<p>'+pa.map(()=>{const i=n++;const c=end&&i===q[1]?(ok?' ok':' sol'):a.w.includes(i)?' no':'';return '<span class="rs'+c+'" data-si="'+i+'">'+md(T[i])+'</span>'}).join(' ')+'</p>').join('');
  frame('<div class="card">'+head(o)+'</div><div class="card rdq"><div class="prog"><span>Frage '+(qi+1)+' von '+N+'</span><div class="bar"><i style="width:'+(A.filter(x=>x&&x.e).length/N*100)+'%"></i></div></div><p class="qlat" style="margin:4px 0 0">'+md(q[0])+'</p>'
   +(end?fb(ok&&!a.w.length,ok?(a.w.length?'✓ Jetzt stimmt es – Punkte gibt es nur beim ersten Versuch.':'✓ Richtig!'):'✗ Gemeint ist der grün umrandete Satz.')+'<div class="row"><button class="sec" data-pq '+(qi?'':'disabled')+'>‹</button><div class="sp"></div>'+(qi<N-1?'<button class="pri" data-nq>Nächste Frage ›</button>':'')+'</div>'
    :a.w.length?fb(0,'✗ Das steht in diesem Satz nicht. <b>Ein</b> zweiter Versuch (ohne Punkte).'):'<p class="muted" style="margin:8px 0 0">Tippe im Text unten auf den passenden Satz.</p>')+'</div>'
   +'<div class="card rdt'+(end?' lock':'')+'"><div class="muted" style="font-size:.8rem;margin-bottom:6px">'+esc(o.src||'')+'</div>'+txt+'</div>'
   +(A.filter(x=>x&&x.e).length===N&&ST[k]?fb(ST[k].p===N,(ST[k].p===N?'⭐ Alles richtig! ':ST[k].p+' von '+N+' beim ersten Versuch richtig. ')+md(o.done||'')):''));
  if(!end)app.querySelectorAll('[data-si]').forEach(b=>b.onclick=()=>{const i=+b.dataset.si,r=A[qi]??={w:[]};if(r.w.includes(i))return;if(i===q[1]){r.r=i;r.e=1}else{r.w.push(i);if(r.w.length>=2)r.e=1}
   if(A.filter(x=>x&&x.e).length===N)fin(k,o.qs.filter((q,j)=>A[j].r===q[1]&&!A[j].w.length).length,N,o.qs.map((q,j)=>A[j].r===q[1]&&!A[j].w.length?-1:j).filter(j=>j>=0));else save();draw()});
  const nq=app.querySelector('[data-nq]');if(nq)nq.onclick=()=>{qi++;draw()};const pq=app.querySelector('[data-pq]');if(pq)pq.onclick=()=>{qi--;draw()}});draw()}
/* 📖 Text: der Lesetext des Pakets bleibt an jeder Station mit einem Tipp erreichbar */
function textSheet(){const st=P.steps.find(x=>x.k===P.text);if(!st)return;const o=DATA(st);const d=document.createElement('div');d.className='txsheet';
 d.innerHTML='<div class="txin"><div class="row" style="margin:0 0 8px"><b style="flex:1;font-size:1.1rem">📖 '+esc(o.h||st.t)+'</b><button class="sec" data-x>Schließen</button></div><div class="muted" style="font-size:.8rem;margin-bottom:6px">'+esc(o.src||'')+'</div>'+o.paras.map(pa=>'<p>'+pa.map(md).join(' ')+'</p>').join('')+'</div>';
 d.onclick=e=>{if(e.target===d||e.target.closest('[data-x]'))d.remove()};document.body.append(d)}
const WID={read:wRead,sorter:wSorter,swiper:wSwiper,quiz:wQuiz,pairs:wPairs,order:wOrder,tarn:wTarn,memory:wMemory,wheels:wWheels,build:wBuild,arrow:wArrow,pant:wPant};
/* 11.47: Lehrkraft-Vorschau – „Lösungen“ zeigt jede Station schon richtig gelöst (in der Seite), „Lösungsblatt“ alles auf einer Seite */
let SOLV=false,SNAP=null;
function solveW(st,o){const k=st.k,T=n=>{ST[k]={p:n,t:n}};switch(st.type){
 case 'sorter':{const pl={};o.items.forEach((it,i)=>pl[i]=[].concat(it[1])[0]);ST[k+'P']=pl;ST[k+'R']=2;ST[k+'S']=[];T(o.items.length);break}
 case 'swiper':{const ord=shuffleOnce(k,o.cards.map((_,i)=>i));ST[k+'A']=ord.map(i=>!!o.cards[i][1]);T(o.cards.length);break}
 case 'quiz':ST[k+'A']=o.qs.map(q=>Array.isArray(q[1])?q[2]:q[1]);T(o.qs.length);break;
 case 'pairs':ST[k+'P']={ok:o.pairs.map((_,i)=>i),err:[],sol:[],n:{}};T(o.pairs.length);break;
 case 'order':ST[k+'S']=o.items.map((_,i)=>i);ST[k+'R']=2;T(o.items.length);break;
 case 'tarn':ST[k+'T']={hit:o.words.map((w,i)=>w[1]?i:-1).filter(i=>i>=0),miss:[]};T(o.words.filter(w=>w[1]).length);break;
 case 'memory':ST[k+'M']={found:o.pairs.map((_,i)=>i),seen:[],err:[]};T(o.pairs.length);break;
 case 'wheels':ST[k+'A']=o.forms.map(f=>[f[1]-1,f[2],f[3]]);T(o.forms.length);break;
 case 'build':ST[k+'A']=o.items.map(it=>[it[3],it[5]]);T(o.items.length);break;
 case 'arrow':ST[k+'A']=o.items.map(it=>({p:it.ans,r:[].concat(it.ref)[0]}));T(o.items.length*2);break;
 case 'read':ST[k+'A']=o.qs.map(q=>({w:[],r:q[1],e:1}));T(o.qs.length);break}}
const STEPS=P?P.steps.map(st=>[st.k,st.t,st.d,st.min,()=>{const o=DATA(st);if(SOLV&&!ST[st.k])try{solveW(st,o)}catch(e){console.warn(e)}WID[st.type](st,o)}]):[];
const TOTMIN=Math.round(STEPS.reduce((a,s)=>a+s[3],0));

/* ---------- Unterlagen (PDF) ---------- */
function pdfBlocks(){const nm=ST.name||ST.me||'',sc=P.steps.filter(s=>s.type!=='pant'),tot=sc.reduce((a,s)=>a+(ST[s.k]?.p||0),0),max=sc.reduce((a,s)=>a+(ST[s.k]?.t||0),0);
 const out=[{t:'h1',s:P.title},{t:'sub',s:P.sub+(ST.cls?' · '+ST.cls:'')+' · '+(nm?nm+' · ':'')+new Date().toLocaleDateString('de-DE')},
  {t:'box',s:'**Meine Ergebnisse:** '+tot+' von '+max+' Punkten · '+STEPS.filter(s=>ST[s[0]]).length+' von '+STEPS.length+' Stationen'},
  {t:'table',w:[.7,.3],head:['Station','Punkte (erster Versuch)'],rows:sc.map(s=>[s.t,ST[s.k]?.p!=null?ST[s.k].p+' von '+ST[s.k].t:'–'])}];
 {const ts=P.text&&P.steps.find(x=>x.k===P.text);if(ts){const o=DATA(ts);out.push({t:'h2',s:'Material: '+(o.h||ts.t)});for(const pa of o.paras)out.push({t:'p',s:pa.join(' ')});if(o.src)out.push({t:'p',s:o.src,sz:8,col:'#5c6b80'})}}
 for(const s of sc){const L=lpLabels(s,DATA(s));if(!L.length)continue;out.push({t:'h2',s:s.t+' ('+cmMatTxt(s.d).split(' · ')[0]+')'},{t:'table',w:[.55,.45],head:['Aufgabe','Lösung'],rows:L.map(([q,a])=>[q,a])})}
 if(BOOK)out.push({t:'p',s:BOOK.source||'',sz:8,col:'#5c6b80'});return out}
let pdfBusy=false;
async function savePdf(btn){if(pdfBusy)return;pdfBusy=true;const t=btn.textContent;btn.textContent='PDF wird erstellt …';
 try{const blob=cmPdf.build(pdfBlocks(),{title:P.title,foot:P.title+' · '+(ST.name||ST.me||'')});const how=await cmPdf.save(blob,P.title.replace(/[·]/g,'-').replace(/[\\/:*?"<>|]/g,'')+((ST.name||ST.me)?' - '+String(ST.name||ST.me).replace(/[\\/:*?"<>|]/g,''):'')+'.pdf');btn.textContent=how==='download'?'✓ PDF geladen':how==='share'?'✓ Geteilt':t}
 catch(e){alert('Die PDF konnte nicht erstellt werden: '+(e&&e.message||e));btn.textContent=t}finally{pdfBusy=false;setTimeout(()=>{if(btn.isConnected)btn.textContent=t},2500)}}

/* ---------- Startseite ---------- */
function home(){CURK=null;if(!P){app.innerHTML='<div class="card"><h2>Lernpaket nicht gefunden</h2><p>Bitte den QR-Code deiner Lehrkraft noch einmal scannen.</p></div>';return}
 const st=k=>ST[k]?'<span class="st done">'+(ST[k].p!=null?ST[k].p+'/'+ST[k].t:'✓')+'</span>':'<span class="st">offen</span>';const startK=(STEPS.find(s=>!ST[s[0]])||[])[0];
 const all=STEPS.every(s=>ST[s[0]]),sc=P.steps.filter(s=>s.type!=='pant'),tot=sc.reduce((a,s)=>a+(ST[s.k]?.p||0),0),max=sc.reduce((a,s)=>a+(ST[s.k]?.t||0),0);
 app.innerHTML='<div class="card hero1"><div class="muted">'+esc(P.sub)+'</div><h1>'+esc(P.title.replace(/^L\d+ · /,''))+'</h1><span class="badge">⭐ '+STEPS.filter(x=>ST[x[0]]).length+' von '+STEPS.length+' Stationen</span><span class="time">⏱ ca. '+TOTMIN+' Minuten</span></div>'
  +'<div class="steps">'+STEPS.map(([k,t,d,m],i)=>'<button class="step'+(k===startK?' start':'')+'" data-s="'+k+'"><span class="n">'+(i+1)+'</span><span><b>'+esc(t)+'</b>'+(k===startK?'<span class="go">'+(i?'Weiter hier':'Starte hier')+'</span>':'')+'<small>'+cmMat(esc(d))+'<span class="min">· '+String(m).replace('.',',')+' min</span></small></span>'+st(k)+'</button>').join('')+'</div>'
  +'<div class="card" style="margin-top:14px"><div class="row" style="margin-top:0"><b style="flex:1">'+(all?'Geschafft: '+tot+' von '+max+' Punkten':'Am Ende:')+'</b><input id="nm" placeholder="Dein Name" value="'+esc(ST.name||ST.me||'')+'" style="min-height:46px;padding:0 12px;border:1px solid #cfd8e6;border-radius:12px;font:inherit;min-width:180px"><button class="pri" data-pdf>Für meine Unterlagen sichern</button>'+(ST.me?'<button class="sec" data-qr>Abgabe-QR zeigen</button>':'')+'</div><p class="muted" style="font-size:.88rem;margin:6px 0 0">Die PDF enthält alle Aufgaben mit Lösungen – für GoodNotes. Am iPad öffnet sich das Teilen-Menü.</p></div>'
  +(BOOK?'<div class="bksrc">📘 Übungen aus dem Buch geladen · <button class="lnk" data-drop>Vom Gerät entfernen</button></div>':'<div class="bkload"><span>📘 Mit den Übungen aus dem Buch arbeiten? Lade die Datei von deiner Lehrkraft (z. B. per AirDrop). Ohne Datei übst du mit eigenen Beispielen.</span><button class="sec" data-load>Datei laden …</button></div>');
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>goStep(b.dataset.s));const L=app.querySelector('[data-load]');if(L)L.onclick=bookPick;const D=app.querySelector('[data-drop]');if(D)D.onclick=bookDrop;
 $('#nm').oninput=e=>{ST.name=e.target.value;save()};const pd=app.querySelector('[data-pdf]');pd.onclick=()=>savePdf(pd);const q=app.querySelector('[data-qr]');if(q)q.onclick=showQr;scrollTo(0,0)}

/* ---------- Abgabe-QR (wie „Städte im Wandel“) ---------- */
ST.dv??=Math.random().toString(36).slice(2,10);
(()=>{const h=location.hash;if(!/^#k1\./.test(h))return;try{let x=h.slice(4).replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';const b=atob(x),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const j=JSON.parse(new TextDecoder().decode(u));
 if(Array.isArray(j.n)&&j.n.length){if(ST.cls!==j.c||!j.n.includes(ST.me))ST.me=null;ST.cls=String(j.c||'');ST.roster=j.n.map(String)}}catch{}try{history.replaceState(null,'',location.pathname+location.search)}catch{}})();
const doneCount=()=>STEPS.filter(x=>ST[x[0]]).length;
/* 11.33: nur Punkte je Station und die Nummern der Fehler – passt immer in einen QR-Code */
function payload(){const sv={},x={};for(const [k] of STEPS){const v=ST[k];if(v){sv[k]=v.p!=null?[v.p,v.t]:1;if(v.x&&v.x.length)x[k]=v.x.join('.')}}
 return 'CMLE1:'+JSON.stringify({u:UID,v:2,c:ST.cls||'',n:ST.me,dv:ST.dv,ts:Date.now(),b:BOOK?1:0,s:sv,x,vb:Object.keys(ST.vb||{}).filter(k=>ST.vb[k]).join('.')})}
const qrSvg=(t,o)=>{try{return classroomQrSvg(t,Object.assign({ecc:'L',boost:false,dark:'#243247',border:2},o||{}))}catch{return ''}};
let whoT=0;function updWho(){clearTimeout(whoT);whoT=setTimeout(()=>{const w=$('#who');if(!w)return;document.body.classList.add('has-who');w.hidden=false;
 if(!ST.me){w.className='noname';w.innerHTML='<span><b>Abgabe-QR</b><small>Name wählen</small></span>';return}
 w.className='';w.innerHTML='<span><b>'+esc(ST.me)+'</b><small>'+doneCount()+' von '+STEPS.length+' ✓</small></span><svg viewBox="0 0 24 24" fill="#243247" aria-hidden="true"><path d="M3 3h8v8H3zM5 5v4h4V5zM13 3h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zM13 13h3v3h-3zM18 13h3v3h-3zM13 18h3v3h-3zM18 18h3v3h-3zM16 16h2v2h-2z"/></svg>'},30)}
async function packQr(){return [payload()]}
async function showQr(){if(!ST.me){runWho();return}const codes=await packQr();let k=0;const o=document.createElement('div');o.className='qrfull';
 const draw=()=>{o.innerHTML='<div class="muted">Abgabe · '+esc(P?P.short:'')+(ST.cls?' · '+esc(ST.cls):'')+'</div><div class="nm">'+esc(ST.me)+'</div>'+(codes.length>1?'<div class="qn">Code '+(k+1)+' von '+codes.length+'</div>':'')+qrSvg(codes[k],{border:3})
  +(codes.length>1?'<div class="qprog">'+codes.map((_,i)=>'<i class="'+(i<=k?'on':'')+'"></i>').join('')+'</div>':'')+'<div class="muted" style="font-size:.9rem">Stand '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' · '+doneCount()+' von '+STEPS.length+' Stationen'+(codes.length>1?' · nach dem Scannen „Nächster Code“':'')+'</div>'
  +'<div class="row" style="justify-content:center;margin-top:4px">'+(codes.length>1?'<button class="sec" data-pv '+(k?'':'disabled')+'>‹ Zurück</button>'+(k<codes.length-1?'<button class="pri" data-nx>Nächster Code ›</button>':'<button class="pri" data-c>Fertig</button>'):'<button class="pri" data-c>Schließen</button>')+'</div>'+(codes.length>1&&k<codes.length-1?'<button class="lnk" data-c style="font-size:.85rem">Schließen</button>':'')+'<button class="lnk" data-ch style="font-size:.85rem">Nicht dein Name? Ändern</button>';
  o.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>o.remove());const nx=o.querySelector('[data-nx]'),pv=o.querySelector('[data-pv]');if(nx)nx.onclick=()=>{k++;draw()};if(pv)pv.onclick=()=>{if(k){k--;draw()}};
  o.querySelector('[data-ch]').onclick=()=>{if(confirm('Deinen Namen wirklich ändern? Deine Lehrkraft sieht den neuen Namen.')){o.remove();runWho(true)}}};
 draw();document.body.append(o)}
function runWho(force){const R=ST.roster||[];let pick=ST.me&&!force?ST.me:null;
 const draw=()=>{frame('Dein Name',R.length?'<div class="card"><h2>'+esc(P?P.short:'')+(ST.cls?' · '+esc(ST.cls):'')+'</h2><p style="margin:4px 0 0">Tippe auf deinen Namen. Er steht später groß über deinem Abgabe-QR.</p><div class="names">'+R.map(n=>'<button class="'+(n===pick?'on':'')+'" data-n="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div><div class="row"><div class="sp"></div><button class="pri" data-ok '+(pick?'':'disabled')+'>'+(pick?'Das bin ich: '+esc(pick):'Namen antippen')+'</button></div></div>'
  :'<div class="card"><h2>Dein Name</h2><p style="margin:4px 0 10px">Scanne den Start-QR deiner Lehrkraft – dann kannst du deinen Namen aus der Liste wählen. Oder trage ihn hier ein (Vor- und Nachname):</p><input id="nmIn" value="'+esc(pick||'')+'" placeholder="Vorname Nachname" style="width:100%;min-height:50px;padding:0 12px;border:1px solid #cfd8e6;border-radius:12px;font:inherit"><div class="row"><div class="sp"></div><button class="pri" data-ok>Speichern</button></div></div>');
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{pick=b.dataset.n;draw()});const inp=$('#nmIn');if(inp)inp.oninput=()=>{pick=inp.value.trim()};
  app.querySelector('[data-ok]').onclick=()=>{if(!pick||pick.length<2)return;ST.me=pick;if(!ST.name)ST.name=pick;save();home()}};draw()}
$('#who').onclick=showQr;
save();if(P)document.title=P.title;if(ST.roster&&!ST.me)runWho();else home();updWho();bookInit();

/* 11.42: Lehrkraft-Vorschau – Knopf „Lösungen“ */
window.cmPreviewSolutions=on=>{if(on&&!SOLV){SNAP=JSON.stringify(ST);SOLV=true}else if(!on&&SOLV){SOLV=false;try{ST=JSON.parse(SNAP)}catch{}}if(CURK)goStep(CURK);else home()};
window.cmSolutionSheet=on=>cmPdf.solutions(on,pdfBlocks);
</script></body></html>
