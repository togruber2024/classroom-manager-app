<title>Lernordner</title>
<script>/* 11.94: Fach-Ordner (?fach=latein …): eigener Name, eigenes Symbol, eigenes Manifest – noch vor „Zum Home-Bildschirm“ gesetzt */
(()=>{const F={latein:'Latein',erdkunde:'Erdkunde',geschichte:'Geschichte',deutsch:'Deutsch',mathematik:'Mathematik',englisch:'Englisch',franzoesisch:'Französisch',musik:'Musik',kunst:'Kunst',religion:'Religion',biologie:'Biologie',physik:'Physik',politik:'Politik'},f=(new URLSearchParams(location.search).get('fach')||'').toLowerCase();if(!F[f])return;window.CM_FACH=f;
 const q=s=>document.head.querySelector(s);q('link[rel="manifest"]').href='fach-'+f+'.webmanifest';q('link[rel="apple-touch-icon"]').href='fach-'+f+'-180.png';q('link[rel="icon"]').href='fach-'+f+'-192.png';
 q('meta[name="apple-mobile-web-app-title"]').content=F[f];document.title=F[f]})();</script>
<!-- 11.91: Lernordner – Schüler-Startseite als Web-App (Home-Bildschirm). Alles bleibt auf dem Gerät.
     Aufgaben kommen in die Liste, sobald eine Schülerseite (Lerneinheit, Übersetzungs-Trainer, Übungen …) einmal geöffnet wurde.
     „QR scannen“ öffnet die Codes der Lehrkraft direkt hier, damit alles im selben Speicher bleibt. -->
<style>
:root{--ink:#243247;--mut:#66758a;--line:#dce3ef;--bg:#f6f8fc;--blue:#2f5f9b;--or:#e8790c;--ok:#1f8a4c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,Inter,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid var(--line)}
.ic{width:42px;height:42px;border-radius:11px;flex:none}
.top b{display:block;font-size:1.15rem}.top small{color:var(--mut);font-size:.85rem}
.fopen{margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border:1px solid #b9c6da;border-radius:12px;background:#fff;color:var(--blue);font:inherit;font-weight:700;cursor:pointer}.fopen+.scan{margin-left:10px}.nw{display:inline-block;font-size:.72rem;font-weight:700;color:#1d6b3a;background:#e6f6ec;border:1px solid #9fd7b2;border-radius:999px;padding:0 7px;margin-left:8px;vertical-align:2px}.okmsg{background:#e5f5ea;color:#1f8a4c;border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:12px}@media (max-width:560px){.fopen,.scan{padding:0 12px}}@media (max-width:480px){.fopen .fl{display:none}.fopen+.scan{margin-left:6px}.top>div{min-width:0}}
.scan{margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--or);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:16px max(18px,env(safe-area-inset-left)) 90px}
h3{margin:18px 0 8px;font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.it{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:inherit;text-decoration:none;font:inherit;text-align:left}
.k{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none}
.t{flex:1;min-width:0}.t b{display:block;font-size:1rem;overflow:hidden;text-overflow:ellipsis}.t small{color:var(--mut);font-size:.82rem}

.go{color:var(--blue);font-weight:600;white-space:nowrap;font-size:.92rem}
.grip{flex:none;width:42px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#66758a;display:grid;place-items:center;touch-action:none;cursor:grab}.lrow.drag .it{box-shadow:0 10px 24px #1c2b4630;border-color:#e8790c}.lrow.drag .grip{color:#e8790c;border-color:#e8790c}.srt{display:flex;justify-content:flex-end;margin:0 0 10px}.srt span{display:inline-flex;background:#e8eef6;border-radius:10px;padding:3px}.srt button{border:0;background:none;border-radius:8px;padding:6px 12px;font:inherit;font-size:.85rem;color:var(--blue);min-height:34px}.srt button.on{background:#e8790c;color:#fff;font-weight:700}.ehint{color:var(--mut);font-size:.85rem;margin:0 0 10px}

.ov button{min-height:46px;padding:0 20px;border-radius:12px;border:1px solid #ffffff66;background:none;color:#fff;font:inherit}
</style></head><body>
<header class="top"><img class="ic" id="ic" src="lernordner-192.png" alt=""><div><b id="ttl">Meine Aufgaben</b><small id="who"></small></div>
<button type="button" class="fopen" id="fopen" aria-label="Datei öffnen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5 12 11l2.5 2.5"/></svg><span class="fl">Datei öffnen</span></button><button type="button" class="scan" id="scan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>QR scannen</button></header>
<main class="wrap" id="app"></main>
<script>
(()=>{
const K='cm-lernordner-v1',$=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rd=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')||{}}catch{return {}}},wr=a=>{try{localStorage.setItem(K,JSON.stringify(a))}catch{}};
const sa=(()=>{try{return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches}catch{return false}})();
const PAGES=['einheit.html','texttrainer.html','ueben.html','uebungen.html','vokabeltest.html','lernpaket.html','lernordner.html'];
const subjOf=e=>e.subject||(['Übersetzungs-Trainer','Vokabeln üben','Übungen','Vokabeltest','Lernpaket'].includes(e.kind)?'latein':'');
const SN={latein:'Latein',erdkunde:'Erdkunde',geschichte:'Geschichte',deutsch:'Deutsch',mathematik:'Mathematik',englisch:'Englisch',franzoesisch:'Französisch',musik:'Musik',kunst:'Kunst',religion:'Religion',biologie:'Biologie',physik:'Physik',politik:'Politik'},FA=window.CM_FACH||'';
 if(FA){$('#ttl').textContent=SN[FA];$('#ic').src='fach-'+FA+'-192.png'}try{sessionStorage.setItem('cm-lo-in','1')}catch{}
const KS={'Lerneinheit':['L','#fff4e8','#b45309'],'Übersetzungs-Trainer':['Ü','#fdeee6','#c2410c'],'Vokabeln üben':['V','#e5f5ea','#1f8a4c'],'Vokabeltest':['V','#e5f5ea','#1f8a4c'],'Übungen':['Ü','#eef3fa','#2f5f9b'],'Lernpaket':['P','#f3edff','#6d28d9']};
let edit=false;
const when=t=>{if(!t)return '';const d=new Date(t),n=new Date();const same=d.toDateString()===n.toDateString();return same?'heute '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})};
/* 12.04: eigene Reihenfolge (am Griff ziehen) oder „Zuletzt benutzt“ – neue Aufgaben ohne Platz kommen oben dazu */
const SK='cm-lernordner-sort-v1',smode=()=>{try{return localStorage.getItem(SK)||'recent'}catch{return 'recent'}};
function draw(){const a=rd(),own0=smode()==='own',L=Object.values(a).sort(own0?((x,y)=>(y.ord==null)-(x.ord==null)||(x.ord==null?(y.added||y.at||0)-(x.added||x.at||0):x.ord-y.ord)):((x,y)=>(y.at||0)-(x.at||0)));
 const me=L.find(e=>e.me);$('#who').textContent=me?me.me+(me.cls?' · '+me.cls:''):'Alles bleibt auf diesem iPad';
 const G={};for(const e of L){const s=SN[subjOf(e)]||'Weitere';(G[s]??=[]).push(e)}
 /* Fach-Ordner: zuerst das eigene Fach (ohne Überschrift), andere Fächer darunter */const own=FA?SN[FA]:null;
 const order=Object.keys(G).sort((x,y)=>(y===own)-(x===own)||(x==='Weitere')-(y==='Weitere')||x.localeCompare(y,'de'));
 const item=e=>{const k=KS[e.kind]||['•','#eef1f6','#66758a'];const m=/^(\d+)\/(\d+)$/.exec(e.p||'');const pc=m&&+m[2]?Math.min(100,Math.round(+m[1]/+m[2]*100)):null;
  return '<div class="lrow" data-id="'+esc(e.id)+'" style="display:flex;gap:8px;align-items:center">'+(edit?'<button type="button" class="grip" data-grip aria-label="Verschieben"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>':'')+(edit?'':'<a class="it" href="'+esc(local(e.url)||e.url)+'">')+(edit?'<div class="it">':'')+'<span class="k" style="background:'+k[1]+';color:'+k[2]+'">'+k[0]+'</span><span class="t"><b>'+esc(String(e.title||e.kind).replace(/^Lektion (\S+) ·/,'L$1 ·'))+(e.neu?'<span class="nw">neu</span>':'')+'</b><small>'+esc(e.kind)+(e.at?' · zuletzt '+when(e.at):'')+(m?' · '+m[1]+' von '+m[2]:'')+'</small>'+(pc!=null?'<span class="bar"><i style="width:'+pc+'%;'+(pc>=100?'background:var(--ok)':'')+'"></i></span>':'')+'</span>'+(edit?'</div><button type="button" class="del" data-del="'+esc(e.id)+'" aria-label="Aus der Liste entfernen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>':'<span class="go">Öffnen ›</span></a>')+'</div>'};
 $('#app').innerHTML=(okMsg?'<div class="okmsg">✓ '+esc(okMsg)+'</div>':'')+(sa?'':'<div class="hint"><b>Tipp:</b> Tippe in Safari auf <b>Teilen</b> und dann auf <b>„Zum Home-Bildschirm“</b>. Dann hast du '+(FA?'den Ordner „'+SN[FA]+'“':'den Lernordner')+' als App – und deine Aufgaben sind sicher, auch wenn jemand den Safari-Verlauf löscht.</div>')
  +(L.length>1&&!edit?'<div class="srt"><span><button type="button" data-sm="own" class="'+(own0?'on':'')+'">Eigene Reihenfolge</button><button type="button" data-sm="recent" class="'+(own0?'':'on')+'">Zuletzt benutzt</button></span></div>':'')+(edit?'<p class="ehint">Am Griff ziehen = verschieben · Papierkorb = aus der Liste entfernen</p>':'')+(L.length?(own&&!G[own]?'<div class="empty"><b>Noch keine '+esc(own)+'-Aufgaben.</b><br>Tippe oben auf <b>„QR scannen“</b> und scanne den Code an der Tafel – oder öffne mit <b>„Datei öffnen“</b> eine Lerneinheit von deiner Lehrkraft.</div>':'')+order.map(s=>(own?(s===own?'':'<h3>'+(s===order.find(x=>x!==own)?'Andere Fächer auf diesem iPad · ':'')+esc(s)+'</h3>'):'<h3>'+esc(s)+'</h3>')+'<div class="grp">'+G[s].map(item).join('')+'</div>').join(''):'<div class="empty"><b>Noch keine Aufgaben.</b><br>Tippe oben auf <b>„QR scannen“</b> und scanne den Code an der Tafel – oder öffne mit <b>„Datei öffnen“</b> eine Lerneinheit von deiner Lehrkraft.</div>')
  +(L.length?'<div class="foot"><span>Alles bleibt auf diesem iPad. Lösche das App-Symbol nicht – sonst sind deine Stände weg.</span><button type="button" id="ed">'+(edit?'Fertig':'Liste bearbeiten')+'</button></div>':'');
 const ed=$('#ed');if(ed)ed.onclick=()=>{if(!edit&&smode()!=='own'){/* beim Bearbeiten gilt die sichtbare Reihenfolge */saveOrder()}edit=!edit;draw()};
 document.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{if(b.dataset.sm==='own'&&!Object.values(rd()).some(e=>e.ord!=null))saveOrder();try{localStorage.setItem(SK,b.dataset.sm)}catch{};draw()});
 document.querySelectorAll('[data-grip]').forEach(g=>g.onpointerdown=ev=>{ev.preventDefault();const row=g.closest('.lrow'),list=row.parentNode;row.classList.add('drag');
  const mv=m=>{m.preventDefault();let before=null;for(const o of list.querySelectorAll(':scope>.lrow')){if(o===row)continue;const bx=o.getBoundingClientRect();if(m.clientY<bx.top+bx.height/2){before=o;break}}if(before){if(row.nextSibling!==before)list.insertBefore(row,before)}else if(list.lastElementChild!==row)list.append(row)};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);row.classList.remove('drag');saveOrder();draw()};
  addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up)});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const x=rd();const e=x[b.dataset.del];if(!e||!confirm('„'+(e.title||e.kind)+'“ aus der Liste entfernen? Dein Arbeitsstand bleibt erhalten.'))return;delete x[b.dataset.del];wr(x);draw()})}
/* Links der Lehrkraft zeigen auf die App im Internet – hier öffnen wir dieselbe Seite im eigenen Ordner (gleicher Speicher) */
function local(u){try{const x=new URL(u,location.href),pg=x.pathname.split('/').pop();if(!PAGES.includes(pg))return null;return pg+x.search+x.hash}catch{return null}}
let stream=null,timer=0,lib=null;
const loadQr=()=>lib?Promise.resolve(lib):new Promise((res,rej)=>{if(window.jsQR)return res(lib=window.jsQR);const s=document.createElement('script');s.src='vendor/jsqr.js';s.onload=()=>window.jsQR?res(lib=window.jsQR):rej(new Error('QR-Leser fehlt.'));s.onerror=()=>rej(new Error('Der QR-Leser konnte nicht geladen werden. Bitte einmal mit Internet öffnen.'));document.head.append(s)});
function stop(){clearTimeout(timer);try{stream?.getTracks().forEach(t=>t.stop())}catch{}stream=null;$('.ov')?.remove()}
async function scan(){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="msg" style="font-weight:700;font-size:1.1rem">Halte das iPad auf den QR-Code an der Tafel</div><div class="cam"><video playsinline muted autoplay></video><div class="fr"></div></div><div class="msg" data-m></div><button type="button" data-x>Abbrechen</button>';document.body.append(o);
 o.querySelector('[data-x]').onclick=stop;const v=o.querySelector('video'),m=o.querySelector('[data-m]');const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 try{const q=await loadQr();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});v.srcObject=stream;await v.play().catch(()=>{})
  const tick=()=>{if(!stream)return;try{if(v.readyState>=2&&v.videoWidth){const sc=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight));cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);cx.drawImage(v,0,0,cv.width,cv.height);const c=q(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});if(c&&c.data){found(c.data,m);return}}}catch{}timer=setTimeout(tick,150)};tick()}
 catch(e){m.innerHTML='<div class="toast">'+esc(e&&e.name==='NotAllowedError'?'Die Kamera ist nicht erlaubt. Erlaube sie in den Einstellungen.':(e.message||'Die Kamera konnte nicht gestartet werden.'))+'</div>'}}
function found(txt,m){const to=local(txt);
 if(!to){m.innerHTML='<div class="toast">Das ist kein Code für den Lernordner'+(/^CMLE/.test(txt)?' – das ist ein Abgabe-Code für deine Lehrkraft.':'.')+'</div>';timer=setTimeout(()=>{m.innerHTML='';scan2()},2500);return}
 m.innerHTML='<div class="toast"><b style="color:var(--ok)">✓ Erkannt</b> – wird geöffnet …</div>';setTimeout(()=>{stop();location.href=to},500)}
function scan2(){const v=$('.ov video');if(!v||!stream)return;stop();scan()}
/* 12.02: „Datei öffnen“ – die Lerneinheit von der Lehrkraft (AirDrop) direkt in den Lernordner holen, ohne QR-Code */
let okMsg='';
const IDB=(mode,fn)=>new Promise((res,rej)=>{try{const r=indexedDB.open('cm-lerneinheiten',1);r.onupgradeneeded=()=>r.result.createObjectStore('u');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('u',mode),x=fn(tx.objectStore('u'));tx.oncomplete=()=>{res(x&&x.result);db.close()};tx.onerror=()=>rej(tx.error)}}catch(e){rej(e)}});
const unitOk=u=>!!(u&&u.type==='classroom-lerneinheit'&&u.id&&/^[a-z0-9_-]+$/i.test(u.id)&&u.def&&Array.isArray(u.def.steps));
async function addUnit(u){await IDB('readwrite',st=>st.put(u,u.id));const M=u.def.meta||{},subj=M.subject||'',id='einheit.html?u='+u.id,a=rd(),n=u.def.steps.filter(x=>x&&x.k).length;
 let kl=null;try{kl=JSON.parse(localStorage.getItem('cm-klasse-v1')||'null')}catch{}const me0=Object.values(a).find(e=>e.me)||{};
 const e=a[id]??={id,kind:'Lerneinheit',added:Date.now(),p:'0/'+n};Object.assign(e,{url:'einheit.html?u='+u.id+(subj?'&fach='+subj:''),title:M.title||u.title||'Lerneinheit',subject:subj,neu:1,at:Date.now(),me:e.me||(kl&&kl.me)||me0.me||'',cls:e.cls||(kl&&kl.c)||me0.cls||''});wr(a);return e}
function fileOpen(){const i=document.createElement('input');i.type='file';i.style.display='none';document.body.append(i);
 i.onchange=async()=>{const f=i.files[0];i.remove();if(!f)return;let d=null;try{d=JSON.parse(await f.text())}catch{}
  const L=unitOk(d)?[d]:d&&d.type==='classroom-reihe'&&d.units?Object.values(d.units).filter(unitOk):[];
  if(!L.length){alert('Diese Datei ist keine Lerneinheit. Öffne die Datei, die du von deiner Lehrkraft bekommen hast (z. B. per AirDrop).');return}
  try{const E=[];for(const u of L)E.push(await addUnit(u));okMsg=E.length===1?'„'+E[0].title+'“ ist jetzt auf diesem iPad. Tippe auf „Öffnen ›“.':E.length+' Lerneinheiten sind jetzt auf diesem iPad.';edit=false;draw();scrollTo(0,0)}
  catch(e){alert('Speichern nicht möglich: '+(e&&e.name==='QuotaExceededError'?'Der Speicher ist voll.':(e&&e.message)||e))}};i.click()}
function saveOrder(){const x=rd();let i=0;document.querySelectorAll('#app .lrow').forEach(r=>{const e=x[r.dataset.id];if(e)e.ord=i++});wr(x);try{localStorage.setItem(SK,'own')}catch{}}
$('#fopen').onclick=fileOpen;
$('#scan').onclick=scan;addEventListener('storage',draw);addEventListener('pageshow',draw);draw();
window.cmLernordner={local,draw};
})();
</script>
</body></html>
