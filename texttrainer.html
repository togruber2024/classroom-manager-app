 renderEV=function(b){ev(b);if(SOL)b.insertAdjacentHTML('beforeend',box('<ol style="margin:4px 0 0;padding-left:20px">'+T.ev.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ol>'))};
 showPR=function(b,k){pr(b,k);if(SOL)b.querySelector('.card')?.insertAdjacentHTML('beforeend',box(esc(T.pron[k][2])))};
 showSent=function(b,si){ss(b,si);const S=T.s[si];if(SOL&&S?.de)b.insertAdjacentHTML('beforeend',box(esc(S.de)))};}
window.cmPreviewSolutions=on=>{SOL=!!on;if(T)render()};
/* 11.47: Lösungsblatt – Text mit Musterübersetzung Satz für Satz */window.cmSolutionSheet=on=>{if(!T)return;cmPdf.solutions(on,()=>[{t:'h2',s:T.title},{t:'table',w:[.5,.5],head:['Latein','Musterübersetzung'],rows:T.s.map(x=>[x.t,x.de||''])}])};
init();
