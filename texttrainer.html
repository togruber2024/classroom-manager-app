function ppIdx(si,i){return T.pp.findIndex(([s,ws])=>s===si&&ws.includes(i))}
function renderPP(b){const found=new Set(ST.pp),max=T.pp.length*2;if(ST.ppTaps==null){ST.ppDone=false;ST.ppTaps=found.size+ST.ppMiss}/* alter Stand mit „Fehlende zeigen“ wieder freigeben */

 const left=()=>Math.max(0,max-ST.ppTaps),over=()=>ST.ppDone||left()<=0&&found.size<T.pp.length;
 const cls=(si,i)=>{const k=ppIdx(si,i);if(k>=0&&found.has(k))return 'f';if(k>=0&&over())return 'miss';return ''};

 b.querySelector('#tx').onclick=e=>{const w=e.target.closest('.w');if(!w||over()||found.size===T.pp.length)return;const si=+w.dataset.s,i=+w.dataset.i,k=ppIdx(si,i);if(k>=0&&found.has(k))return;
  ST.ppTaps++;

  else{ST.ppMiss++;beep(false);w.classList.add('x');setTimeout(()=>w.classList.remove('x'),700)}
  if(left()<=0&&found.size<T.pp.length)ST.ppDone=true;save();
  $('#ppc').textContent=found.size+' von '+T.pp.length;$('#ppl').textContent=left()+' von '+max;refreshTabs();

/* ---------- 12.24: Ablativ-Detektiv – Funktion des markierten Ablativs wählen (bis zu 5 Möglichkeiten).

const ABI=()=>(T&&T.abl&&Array.isArray(T.abl.it)?T.abl.it:[]),ABF=()=>(T&&T.abl&&T.abl.f)||[];
const abDone=()=>ABI().filter((_,k)=>ST.ab?.[k]?.e).length;
function abOpts(k){const [si,ws,c]=ABI()[k],F=ABF(),n=Math.min(5,F.length);let h=(si*131+(ws[0]||0)*17+k*7)>>>0;const rnd=()=>{h=(Math.imul(h^h>>>15,2246822507)+0x9e3779b9)>>>0;return h/4294967296};
 const rest=F.map((_,i)=>i).filter(i=>i!==c);for(let i=rest.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}
 return [c,...rest.slice(0,n-1)].sort((a,b)=>a-b)}
function renderAB(b){ST.ab=ST.ab||{};const I=ABI(),F=ABF();let k=ST.abCur!=null&&ST.abCur<I.length?ST.abCur:I.findIndex((_,j)=>!ST.ab[j]?.e);if(k<0)k=I.length-1;
 const prog='<div class="abprog">'+I.map((_,j)=>{const a=ST.ab[j];return '<span class="'+(a?.e?(a.p?'g':a.ok?'c':'r'):j===k?'cur':'')+'"></span>'}).join('')+'</div>';
 const [si,ws,c]=I[k],a=ST.ab[k]||{t:[]},opts=abOpts(k);
 const sent=words(si).map((w,i)=>ws.includes(i)?'<span class="abl">'+esc(w)+'</span>':esc(w)).join(' ').replace(/<\/span> <span class="abl">/g,' ');
 const fb=a.e?(a.p?'<div class="fb ok">✓ Richtig – im ersten Versuch.</div>':a.ok?'<div class="fb ok">✓ Richtig – im zweiten Versuch (ohne Punkt).</div>':'<div class="fb no">Lösung: '+esc(F[c][0])+'.</div>'):a.t.length?'<div class="fb no">Noch nicht. Zweiter Versuch – zählt nicht mehr für die Punkte.</div>':'';
 const all=abDone()===I.length;
 b.innerHTML='<div class="card"><div class="row" style="margin-top:0"><p class="task" style="margin:0"><b>Welche Funktion hat der Ablativ?</b></p><div class="sp"></div><span class="muted">Ablativ '+(k+1)+' von '+I.length+'</span></div>'+prog
  +'<div class="absent">'+sent+'</div><div class="abopts">'+opts.map(i=>'<button data-abo="'+i+'" class="'+(a.t.includes(i)?(i===c?'ok':'no'):a.e&&i===c?'ok':'')+'"'+(a.e||a.t.includes(i)?' disabled':'')+'>'+esc(F[i][0])+(F[i][1]?'<small>'+esc(F[i][1])+'</small>':'')+'</button>').join('')+'</div>'+fb
  +'<div class="row"><button class="lnk" data-abp'+(k>0?'':' hidden')+'>‹ zurück</button><div class="sp"></div>'+(a.e?(k<I.length-1?'<button class="pri" data-abn>Nächster Ablativ ›</button>':all?'<button class="pri" data-abx>Weiter ›</button>':''):'')+'</div></div>'
  +(all?'<div class="fb ok">✓ Alle '+I.length+' Ablative bestimmt – '+I.filter((_,j)=>ST.ab[j].p).length+' im ersten Versuch.</div>':'');
 b.querySelectorAll('[data-abo]').forEach(x=>x.onclick=()=>{const i=+x.dataset.abo;if(a.e||a.t.includes(i))return;a.t.push(i);if(i===c){a.ok=true;a.e=true;a.p=a.t.length===1}else if(a.t.length>=2)a.e=true;ST.ab[k]=a;ST.abCur=k;save();if(abDone()===I.length)render();else{refreshTabs();renderAB(b)}});
 b.querySelector('[data-abp]')?.addEventListener('click',()=>{ST.abCur=k-1;save();renderAB(b)});

/* 12.61: Lexikon-Daten – Fachbegriffe [Name, Erklärung, Beispiel] und Tabellen (Endungen nach „|“) */const LEXT={"partizip": ["Partizip", "Verbform, die wie ein Adjektiv dekliniert wird („Mittelwort“): *timēns* – „fürchtend“, *compulsus* – „getrieben“.", "*sitī compulsī* – „vom Durst getrieben“"], "ppp": ["PPP (Partizip Perfekt Passiv)", "Wird aus dem Supinstamm mit *-us, -a, -um* gebildet und nach der a/o-Deklination dekliniert. Meist **vorzeitig** und **passiv**.", "*incitātus* – „angetrieben (worden)“"], "ppa": ["PPA (Partizip Präsens Aktiv)", "Präsensstamm + *-ns*, Genitiv *-ntis*; wird nach der 3. Deklination dekliniert. **Gleichzeitig** und **aktiv**.", "*bibentī* – „(mir,) während ich trinke“"], "kng": ["KNG", "**K**asus, **N**umerus, **G**enus. Zwei Wörter stimmen in KNG überein, wenn sie im gleichen Fall, in der gleichen Zahl und im gleichen Geschlecht stehen.", "*Mūlī gravātī* – beide Nom. Pl. m."], "bezugswort": ["Bezugswort", "Das Nomen (oder Pronomen), zu dem ein Attribut oder Partizip gehört.", "*latrō incitātus* – Bezugswort: *latrō*"], "pc": ["Participium coniunctum (PC)", "„Verbundenes Partizip“: ein Partizip, das mit seinem Bezugswort in KNG übereinstimmt. Übersetzbar wörtlich, als Relativsatz, als Adverbialsatz oder beigeordnet.", "*Lāniger timēns* – „das Lamm, voller Angst“"], "vorzeitig": ["vorzeitig", "Die Handlung geschieht **vor** der Handlung des Prädikats (z. B. beim PPP, beim Plusquamperfekt, beim Futur II).", "*repulsus … ait* – erst zurückgeschlagen, dann sagt er"], "gleichzeitig": ["gleichzeitig", "Die Handlung geschieht **zur selben Zeit** wie die Handlung des Prädikats (z. B. beim PPA).", "*Lāniger timēns* (respondit) – während es antwortet, hat es Angst"], "zeitverhaeltnis": ["Zeitverhältnis", "Gibt an, ob eine Handlung **vor**, **gleichzeitig mit** oder **nach** der Handlung des Prädikats geschieht.", ""], "beiordnung": ["Beiordnung", "Ein Partizip wird als eigener Hauptsatz übersetzt und mit „und“ angeschlossen.", "*correptum lacerat* – „er packt es und zerfleischt es“"], "subst_partizip": ["substantiviertes Partizip", "Ein Partizip ohne Bezugswort, das wie ein Nomen gebraucht wird.", "*Spoliātus* – „der Beraubte“"], "deponens": ["Deponens", "Verb mit passiven Formen, aber **aktiver** Bedeutung. Sein Partizip Perfekt ist ebenfalls aktiv zu übersetzen.", "*querī* – „klagen“; *nīxa* – „gestützt“, *expertus* – „erfahren habend“"], "abl_abs": ["Ablativus absolutus", "Nomen und Partizip im Ablativ, die grammatisch „losgelöst“ vom übrigen Satz stehen. Meist als Adverbialsatz übersetzt.", "*partibus factīs* – „nachdem die Teile gemacht waren“"], "komparativ": ["Komparativ", "1. Steigerungsstufe („größer“). Adjektiv: *-ior* (m./f.), *-ius* (n.), 3. Deklination. Adverb: *-ius*.", "*lātior* – „breiter“, *validius* – „stärker“"], "superlativ": ["Superlativ", "2. Steigerungsstufe („am größten“, „sehr groß“): *-issimus, -a, -um*; Adverb *-issimē*.", "*novissimē* – „zuletzt“"], "abl_comp": ["Ablativ des Vergleichs", "Ablativ nach einem Komparativ; übersetzt mit „als“ (Ablativus comparationis).", "*bove lātior* – „breiter als das Rind“"], "abl_instr": ["Ablativ des Mittels", "Ablativus instrumentalis: Womit? Wodurch?", "*ferrō* – „mit dem Schwert“"], "abl_loci": ["Ablativ des Ortes", "Ablativus loci: Wo? (oft mit *in*)", "*in quā* – „in dem (Wald)“"], "abl_modi": ["Ablativ der Art und Weise", "Ablativus modi: Wie? Auf welche Weise?", "*cursū levī* – „mit leichtem Lauf“"], "abl_causae": ["Ablativ des Grundes", "Ablativus causae: Warum? Weswegen?", "*invidiā* (tācta) – „aus Neid“"], "ind_frage": ["indirekter Fragesatz", "Abhängige Frage (nach „fragen“, „wissen“ …); steht im **Konjunktiv**. Eingeleitet z. B. mit *an/num* („ob“), *quis* („wer“), *quam* („wie“).", "*interrogāvit, an … esset* – „er fragte, ob … sei“"], "konjunktiv": ["Konjunktiv", "Modus der Möglichkeit, des Wunsches oder der Abhängigkeit. Im Nebensatz oft durch die Subjunktion bedingt (cum, ut, nē, indirekte Frage).", "*cum fleret* – „als er weinte“"], "cum_satz": ["cum-Satz", "*cum* mit Konjunktiv heißt „als“, „nachdem“, „weil“ oder „obwohl“. Konj. Impf. = gleichzeitig, Konj. Plqpf. = vorzeitig.", "*cum dēcidisset* – „als er hineingefallen war“"], "konsekutiv": ["Folgesatz (Konsekutivsatz)", "*ut* + Konjunktiv nach *tantus, tam, ita, sīc* …: „sodass“, „dass“. Verneinung *ut nōn*.", "*Tanta … ut nōn possit* – „so groß …, dass … nicht kann“"], "finalsatz": ["Finalsatz", "*ut* bzw. *nē* + Konjunktiv: „damit“ bzw. „damit nicht“.", "*Nē glōriārī libeat* – „damit es nicht gefalle, sich zu rühmen“"], "irrealis": ["Irrealis", "Bedingung, die **nicht** erfüllt ist („wenn … wäre/hätte“). Steht im Konjunktiv.", ""], "irr_ggw": ["Irrealis der Gegenwart", "Konjunktiv **Imperfekt** in Neben- und Hauptsatz: „wenn … wäre, würde …“.", "*Sī vōcem habērēs, … foret* – „wenn du eine Stimme hättest, wäre …“"], "irr_verg": ["Irrealis der Vergangenheit", "Konjunktiv **Plusquamperfekt**: „wenn … gewesen wäre, hätte …“.", "*sī contentus fuissēs* – „wenn du zufrieden gewesen wärst“"], "rel_anschluss": ["relativer Satzanschluss", "Relativpronomen am Satzanfang, das auf den vorigen Satz zurückgreift; übersetzt mit einem Demonstrativpronomen.", "*Quem … rapuit* – „Diesen schnappte …“"], "relativsatz": ["Relativsatz", "Nebensatz, der mit einem Relativpronomen (*quī, quae, quod*) eingeleitet wird. Das Pronomen richtet sich in Numerus und Genus nach dem Bezugswort, der Kasus nach seiner Rolle im Relativsatz. Fehlt das Bezugswort, ergänzt man *is* („derjenige“).", "*quī aliēnum appetit* – „wer nach Fremdem greift“"], "aci": ["AcI", "*Accusativus cum Infinitivo*: Akkusativ + Infinitiv nach Verben des Sagens, Meinens, Wahrnehmens, Fühlens. Meist als „dass“-Satz übersetzt.", "*ferum laedī (vīdit)* – „(er sah,) dass das Tier verletzt wurde“"], "nci": ["NcI", "*Nominativus cum Infinitivo*: Nominativ + Infinitiv bei passiven Verben wie *dīcitur* („er soll …“, „man sagt, dass er …“).", "*ēdidisse dīcitur* – „er soll ausgestoßen haben“"], "inf_pass": ["Infinitiv Passiv", "Präsens: *-rī* (a-, e-, i-Konj.), *-ī* (kons. Konj.): *laudārī, dūcī, ferrī*. Perfekt: PPP + *esse* (*laudātum esse*).", "*ferrī* – „getragen werden“"], "futur1": ["Futur I", "Zukunft. a-/e-Konjugation: *-bō, -bis, -bit*; kons./i-Konjugation: *-am, -ēs, -et*.", "*tribuētis* – „ihr werdet zuteilen“"], "futur2": ["Futur II", "Vorzeitigkeit in der Zukunft: Perfektstamm + *-erō, -eris, -erit …*. Im Deutschen meist Präsens oder Perfekt.", "*sī quis tetigerit* – „wenn jemand berührt (hat)“"], "perf_pass": ["Perfekt und Plusquamperfekt Passiv", "PPP + Präsens von *esse* (Perfekt: *vocātus est* – „er wurde gerufen / ist gerufen worden“) bzw. + Imperfekt von *esse* (Plusquamperfekt: *vocātus erat* – „er war gerufen worden“). Das PPP richtet sich nach dem Subjekt.", "*reddita est* – „sie wurde zurückgegeben“"], "inf_perf_pass": ["Infinitiv Perfekt Passiv", "PPP + *esse*: *positum esse* – „aufgestellt worden (zu) sein“. Im AcI vorzeitig.", "*statuam positam esse* – „dass eine Statue aufgestellt worden ist“"], "adj_i": ["Adjektive der i-Deklination", "Adjektive der 3. Deklination: dreiendig (*ācer, ācris, ācre*), zweiendig (*gravis, grave*), einendig (*audāx*). Abl. Sg. *-ī*, Gen. Pl. *-ium*.", "*ācrī vōce* – „mit scharfer Stimme“"], "adverb": ["Adverb", "Bestimmt ein Verb näher („wie?“). Von Adjektiven der o/a-Dekl. mit *-ē* (*certē*), von Adjektiven der 3. Dekl. mit *-iter* (*graviter, audāciter*).", "*audāciter ēgit* – „er handelte kühn“"], "gen_poss": ["Genitivus possessivus", "Genitiv des Besitzers: Wem gehört etwas?", "*Catilīnae cōnsilia* – „die Pläne Catilinas“"], "gen_subi": ["Genitivus subiectivus", "Der Genitiv ist das „Subjekt“ der Handlung im Nomen: *timor hostium* – „die Furcht der Feinde“ (die Feinde fürchten).", ""], "gen_obi": ["Genitivus obiectivus", "Der Genitiv ist das „Objekt“ der Handlung im Nomen; oft mit „vor, zu, nach“ übersetzt.", "*amor patriae* – „die Liebe zum Vaterland“; *timor mortis* – „die Angst vor dem Tod“"], "gen_part": ["Genitivus partitivus", "Genitiv des geteilten Ganzen: Ein Teil wovon?", "*Quis nostrum?* – „Wer von uns?“"], "iste": ["iste, ista, istud", "Demonstrativpronomen „dieser (da)“, oft abwertend („dieser Kerl“). Dekliniert wie *ille*.", "*iste homō* – „dieser Mensch da“"], "akk_ausd": ["Akkusativ der Ausdehnung", "Akkusativ ohne Präposition bei Zeit- und Raumangaben: Wie lange? Wie weit?", "*multōs diēs* – „viele Tage lang“; *paucōs pedēs* – „wenige Fuß weit“"], "e_dekl": ["e-Deklination", "Kleine Deklination mit Stamm auf *-ē-*: *rēs, reī* f.; *diēs, diēī* m. (meist). Erkennbar an *-ē-* in fast allen Endungen.", "*Ob eam rem* – „aus diesem Grund“"], "refl_aci": ["Reflexivpronomen im AcI", "*sē / sibi / suus* im AcI beziehen sich auf das Subjekt des **übergeordneten** Satzes; übersetzt mit „er/sie/ihm“.", "*cōnfirmāvērunt sē fidem praestāre* – „sie versicherten, dass sie (selbst) treu seien“"], "aci_subjekt": ["AcI und Infinitiv als Subjekt", "Bei unpersönlichen Ausdrücken (*turpe est, patet, necesse est*) ist der AcI bzw. Infinitiv das Subjekt des Satzes.", "*Rēgem venīre turpe nōn est* – „Dass der König kommt, ist nicht schändlich.“"], "velle": ["velle", "Unregelmäßiges Verb: *volō, vīs, vult* – „wollen“. Ebenso *nōlle* („nicht wollen“), *mālle* („lieber wollen“).", "*Quid habēre vīs?* – „Was willst du haben?“"], "demonstrativ": ["Demonstrativpronomen", "Hinweisendes Pronomen: *is, hic, ille, iste, ipse* – „dieser, jener …“.", ""], "ut_final": ["ut-Satz (final)", "*ut* / *nē* + Konjunktiv: Absicht, Zweck – „damit“, „um zu“ bzw. „damit nicht“.", "*ut eum ad Mārcellum dūceret* – „um ihn zu Marcellus zu führen“"], "ut_wunsch": ["abhängiger Begehrsatz", "*ut* / *nē* + Konjunktiv nach Verben des Bittens, Befehlens, Bewirkens: „dass“ bzw. „dass nicht“.", "*imperāvit, ut convenīrent* – „er befahl, dass sie zusammenkämen“"], "cum_temp": ["cum temporale / historicum", "*cum* + Konj. Impf./Plqpf. in der Erzählung: „als“, „nachdem“.", "*Cum clādēs nūntiāta esset* – „als die Niederlage gemeldet worden war“"], "cum_kaus": ["cum causale", "*cum* + Konjunktiv: „weil, da“.", "*cum Arminium amīcum putāret* – „weil er Arminius für einen Freund hielt“"], "cum_konz": ["cum concessivum", "*cum* + Konjunktiv: „obwohl“; oft mit *tamen* im Hauptsatz.", "*Cum … sē dēfendissent, tamen …* – „obwohl sie sich verteidigt hatten, …“"], "abl_abs_nom": ["nominaler Ablativus absolutus", "Ablativus absolutus ohne Partizip: zwei Nomina (oder Nomen + Adjektiv) im Ablativ. Ergänze im Deutschen „sein“.", "*Octāviānō comite* – „als Octavian Begleiter war“; *mē auctōre* – „auf meine Veranlassung“"], "praedikativum2": ["Prädikativum", "Nomen oder Adjektiv, das sich auf ein Satzglied bezieht und zugleich etwas über die Handlung aussagt; oft mit „als“ übersetzt.", "*Octāviānus adulēscēns* – „Octavian als junger Mann“"], "konj_praes": ["Konjunktiv Präsens", "a-Konj. mit *-e-* (*vocet*), sonst mit *-a-* (*dēfendant, audiātis*); *esse*: *sim, sīs, sit*.", "*ut … dēfendant* – „dass sie verteidigen“"], "konj_perf": ["Konjunktiv Perfekt", "Perfektstamm + *-erim, -eris, -erit …*; im Passiv PPP + *sim, sīs, sit*.", "*quotiēns victor fuerim* – „wie oft ich Sieger gewesen bin“"], "zeitenfolge": ["Zeitenfolge (consecutio temporum)", "Im konjunktivischen Nebensatz hängt das Tempus vom Hauptsatz ab: Haupttempus (Präsens) → Konj. Präsens (gleichzeitig) / Konj. Perfekt (vorzeitig); Nebentempus (Vergangenheit) → Konj. Imperfekt / Konj. Plusquamperfekt.", "*rogō, cūr timeam* – *rogāvī, cūr timērem*"], "optativ": ["Optativ (Wunsch)", "Konjunktiv im Hauptsatz als Wunsch, oft mit *utinam*: erfüllbar (Konj. Präs.), unerfüllbar (Konj. Impf./Plqpf.).", "*Utinam nē fīliō crēdidissem!* – „Hätte ich doch meinem Sohn nicht geglaubt!“"], "jussiv": ["Jussiv (Aufforderung)", "Konjunktiv Präsens in der 3. Person als Befehl: „er soll …“.", "*Pereat māter!* – „Die Mutter soll sterben!“"], "adhortativ": ["Adhortativ (Selbstaufforderung)", "Konjunktiv Präsens in der 1. Person Plural: „lasst uns …!“", "*inimīcitiās dēpōnāmus!* – „Lasst uns die Feindschaft beenden!“"], "prohibitiv": ["Prohibitiv (Verbot)", "*nē* + Konjunktiv Perfekt (2. Person): „… nicht!“", "*Nē dubitāverīs!* – „Zögere nicht!“"], "ort_ohne_praep": ["Ortsangaben ohne Präposition", "Bei Städten, kleinen Inseln und *domus/rūs* steht keine Präposition: Wo? Lokativ (*Rōmae, Bāiīs, domī*), Woher? Ablativ (*Rōmā, domō*), Wohin? Akkusativ (*Bāiās, domum*).", "*Rōmā exīret* – „aus Rom wegging“"], "ferre": ["ferre", "Unregelmäßiges Verb: *ferō, tulī, lātum* – „tragen, bringen; ertragen“. Viele Komposita: *afferre, cōnferre, offerre, tollere (sustulī, sublātum)*.", "*litterās ferre* – „einen Brief überbringen“"], "deponens_part": ["Partizip der Deponentien", "Das Partizip Perfekt eines Deponens ist **aktiv** und vorzeitig: *ingressus* – „nachdem er hineingegangen war“.", "*domum ingressī* – „nachdem wir das Haus betreten hatten“"], "fieri": ["fierī", "„werden, geschehen“; dient als Passiv zu *facere*: *fit* – „es geschieht / wird gemacht“; *factum est* – „es ist geschehen“.", "*quid fierī dēbēret* – „was geschehen sollte“"], "subjekt": ["Subjekt", "Satzglied im Nominativ: Wer oder was tut etwas? Im Lateinischen steckt es oft im Prädikat („verstecktes Subjekt“).", "*Servus clāmat* – Wer ruft? der Sklave"], "praedikat": ["Prädikat", "Satzaussage, meist ein Verb: Was tut jemand? Die Personalendung verrät, wer handelt.", "*Labōrat.* – „Sie arbeitet.“"], "akk_obj": ["Akkusativobjekt", "Satzglied im Akkusativ: Wen oder was? Endungen im Singular oft *-m* (*servum, catellam, patrem*).", "*Catellam nōn videt.* – „Sie sieht das Hündchen nicht.“"], "genus": ["Genus", "Grammatisches Geschlecht: maskulin, feminin, neutrum. Es stimmt im Lateinischen und Deutschen nicht immer überein.", "*catella* (f.) – „das Hündchen“ (n.)"], "kongruenz": ["Kongruenz", "Übereinstimmung: Das Prädikat richtet sich im Numerus nach dem Subjekt; Adjektive richten sich in KNG nach ihrem Bezugswort.", "*Līberī rīdent* – Plural und Plural"], "infinitiv": ["Infinitiv", "Grundform des Verbs auf *-re*: *lūdere, pūrgāre*. Steht oft bei *dēbēre, cupere, posse*.", "*Lūdere amant.* – „Sie spielen gern.“"], "vokativ": ["Vokativ", "Fall der Anrede. Bei Wörtern auf *-us* endet er auf *-e*, bei *-ius* auf *-ī*; sonst wie der Nominativ.", "*Aule! Lyce! Decī!*"], "pers_end": ["Personalendungen", "Endungen am Verb, die die Person zeigen: *-ō/-m, -s, -t, -mus, -tis, -nt*.", "*amō, amās, amat, amāmus, amātis, amant*"], "praep_akk": ["Präpositionen mit Akkusativ", "*ad, in* (wohin?), *per, ante, prope …* stehen mit Akkusativ. *in* + Akk. = „in … hinein“, *in* + Abl. = „in“.", "*in hortum properāre* – „in den Garten eilen“"], "imperativ": ["Imperativ", "Befehlsform. Singular: Präsensstamm (*properā! venī! lege!*), Plural: *-te* (*properāte! venīte!*). Verbot: *nōlī / nōlīte* + Infinitiv.", "*Nōlīte rīdēre!* – „Lacht nicht!“"], "posse": ["posse", "„können“: *possum, potes, potest, possumus, potestis, possunt*. Zusammengesetzt aus *pot-* und *esse*.", "*Num bene scrībere potes?*"], "fragepartikel": ["Fragepartikel", "*-ne* fragt offen, *nōnne* erwartet „ja“, *num* erwartet „nein“.", "*Nōnne mē audīre potestis?* – „Könnt ihr mich etwa nicht hören?“"], "attribut": ["Attribut", "Beifügung zu einem Nomen, z. B. ein Adjektiv oder ein Genitiv. Es stimmt in KNG mit dem Bezugswort überein.", "*magnum clāmōrem* – „einen großen Lärm“"], "adjektiv": ["Adjektiv", "Eigenschaftswort: *bonus, -a, -um* (a/o-Deklination). Es richtet sich in KNG nach seinem Bezugswort.", "*servus bonus, statua pulchra, dōnum magnum*"], "gen_attr": ["Genitivattribut", "Genitiv als Beifügung zu einem Nomen: Wessen?", "*statua Caesaris* – „die Statue Caesars“"], "possessiv": ["Possessivpronomen", "*meus, tuus, noster, vester*; reflexiv *suus* („sein/ihr eigener“, bezieht sich auf das Subjekt); nicht reflexiv *eius, eōrum* („sein/ihr“ – eines anderen).", "*amīcus meus* – „mein Freund“"], "dat_obj": ["Dativobjekt", "Satzglied im Dativ: Wem?", "*servō dat* – „er gibt dem Sklaven“"], "perfekt": ["Perfekt", "Erzähltempus für einmalige, abgeschlossene Handlungen. Bildung mit eigenem Perfektstamm: *-v-, -u-, -s-*, Dehnung oder Reduplikation; Endungen *-ī, -istī, -it, -imus, -istis, -ērunt*.", "*vocāvit, monuit, dīxit, vēnit, dedit*"], "imperfekt": ["Imperfekt", "Tempus für Hintergrund, Dauer und Wiederholung: Präsensstamm + *-ba-*. Das Perfekt erzählt die Ereignisse, das Imperfekt beschreibt die Lage.", "*Troia ārdēbat* – „Troja brannte“"], "plusqpf": ["Plusquamperfekt", "Vorzeitigkeit in der Vergangenheit: Perfektstamm + *-eram, -erās, -erat …* – „hatte … gemacht“.", "*Remus mūrōs trānsiluerat* – „Remus war über die Mauern gesprungen“"], "adverbialsatz": ["Adverbialsatz", "Nebensatz, der wie eine adverbiale Bestimmung Zeit, Grund, Bedingung oder Gegensatz angibt; eingeleitet mit *ubī, postquam, quod, quia, sī, quamquam, dum …*", "*Postquam … vēnērunt* – „Nachdem … gekommen waren“"], "ipse": ["ipse, ipsa, ipsum", "„selbst“ – hebt eine Person hervor.", "*Vidē et lege ipse!* – „Sieh und lies selbst!“"], "subst_adj": ["substantiviertes Adjektiv", "Adjektiv ohne Bezugswort, als Nomen gebraucht: Maskulinum = Personen, Neutrum Plural = Dinge.", "*multa* – „viele Dinge, vieles“; *bonī* – „die Guten“"], "passiv": ["Passiv", "Leideform: Das Subjekt erleidet die Handlung. Präsens: *-or, -ris, -tur, -mur, -minī, -ntur*. Wer handelt, steht mit *ā/ab* (Ablativ).", "*ā Rōmānīs laudātur* – „er wird von den Römern gelobt“"], "praedikativum": ["Prädikatsnomen", "Nomen oder Adjektiv, das mit *esse* zusammen das Prädikat bildet.", "*fidēlis est* – „ist zuverlässig“"]},LEXB=[{"id": "dekl_a", "g": "Deklinationen", "t": "a-Deklination", "d": "Fast nur Feminina: *puella, -ae f.*", "m": "", "base": true, "tabs": [{"head": ["", "Sg.", "Pl."], "rows": [["Nom.", "puell|a", "puell|ae"], ["Gen.", "puell|ae", "puell|ārum"], ["Dat.", "puell|ae", "puell|īs"], ["Akk.", "puell|am", "puell|ās"], ["Abl.", "puell|ā", "puell|īs"]]}]}, {"id": "dekl_o", "g": "Deklinationen", "t": "o-Deklination", "d": "Maskulina auf *-us* (auch *-er*: *puer, aper*), Neutra auf *-um*.", "m": "Beim Neutrum sind Nominativ und Akkusativ immer gleich, im Plural enden sie auf *-a*.", "base": true, "tabs": [{"head": ["", "dominus Sg.", "Pl.", "templum (n.) Sg.", "Pl."], "rows": [["Nom.", "domin|us", "domin|ī", "templ|um", "templ|a"], ["Gen.", "domin|ī", "domin|ōrum", "templ|ī", "templ|ōrum"], ["Dat.", "domin|ō", "domin|īs", "templ|ō", "templ|īs"], ["Akk.", "domin|um", "domin|ōs", "templ|um", "templ|a"], ["Abl.", "domin|ō", "domin|īs", "templ|ō", "templ|īs"]]}]}, {"id": "dekl_3", "g": "Deklinationen", "t": "3. Deklination", "d": "Den Stamm erkennst du am Genitiv: *corpus, corpor-is*. i-Stämme haben im Gen. Pl. *-ium* (*urbium*).", "m": "", "base": true, "tabs": [{"head": ["", "mercātor Sg.", "Pl.", "corpus (n.) Sg.", "Pl."], "rows": [["Nom.", "mercātor", "mercātōr|ēs", "corpus", "corpor|a"], ["Gen.", "mercātōr|is", "mercātōr|um", "corpor|is", "corpor|um"], ["Dat.", "mercātōr|ī", "mercātōr|ibus", "corpor|ī", "corpor|ibus"], ["Akk.", "mercātōr|em", "mercātōr|ēs", "corpus", "corpor|a"], ["Abl.", "mercātōr|e", "mercātōr|ibus", "corpor|e", "corpor|ibus"]]}]}, {"id": "dekl_ue", "g": "Deklinationen", "t": "u- und e-Deklination", "d": "*cornibus* (Phaedrus) ist Abl. Pl. von *cornū*.", "m": "", "base": false, "tabs": [{"head": ["", "cursus Sg.", "Pl.", "cornū (n.) Sg.", "Pl.", "rēs Sg.", "Pl."], "rows": [["Nom.", "curs|us", "curs|ūs", "corn|ū", "corn|ua", "r|ēs", "r|ēs"], ["Gen.", "curs|ūs", "curs|uum", "corn|ūs", "corn|uum", "r|eī", "r|ērum"], ["Dat.", "curs|uī", "curs|ibus", "corn|ū", "corn|ibus", "r|eī", "r|ēbus"], ["Akk.", "curs|um", "curs|ūs", "corn|ū", "corn|ua", "r|em", "r|ēs"], ["Abl.", "curs|ū", "curs|ibus", "corn|ū", "corn|ibus", "r|ē", "r|ēbus"]]}]}, {"id": "adj_ao", "g": "Deklinationen", "t": "Adjektive und PPP: a/o-Deklination", "d": "Das PPP wird dekliniert wie *bonus, -a, -um*: Maskulinum und Neutrum nach der o-Deklination, Femininum nach der a-De async function printNotes(name,btn){const pp=new Set(T.pp.flatMap(([si,ws])=>ws.map(i=>si+':'+i)));
 const text=T.s.map((s,si)=>words(si).map((w,i)=>pp.has(si+':'+i)?'**'+w+'**':w).join(' ')).join(' ');

 const blocks=[{t:'h1',s:T.title},{t:'sub',s:(T.sub?T.sub+' · ':'')+(name?name+' · ':'')+new Date().toLocaleDateString('de-DE')},
  {t:'h2',s:'Text'},{t:'p',s:text,sz:11.5},{t:'p',s:'Fett: '+HU().legend,sz:8.5,col:'#5c6b80'},
  {t:'h2',s:'Was geschah nacheinander?'},{t:'list',num:true,items:T.ev.slice()},
  {t:'h2',s:'Übersetzung'},...T.s.map((x,si)=>{const m=ST.sent[si]||{};return {t:'table',w:[.24,.76],rows:[['**Satz '+(si+1)+'**',x.t],['Meine Übersetzung',m.tx?.trim()||'—'],...(fin()&&DE&&DE[si]?[['Musterübersetzung',DE[si]]]:[])]}}),
  vocab.length?{t:'h2',s:'Meine Wörter zum Lernen'}:null,vocab.length?{t:'table',w:[.35,.65],firstBold:true,rows:vocab.map(v=>[v[0],v[1]])}:null].filter(Boolean);
 const t=btn?btn.textContent:'';if(btn)btn.textContent='PDF wird erstellt …';
 try{const blob=cmPdf.build(blocks,{title:T.title,foot:T.title+(name?' · '+name:'')});const how=await cmPdf.save(blob,String(T.title).replace(/[\\/:*?"<>|]/g,'')+(name?' - '+name.replace(/[\\/:*?"<>|]/g,''):'')+'.pdf');if(btn)btn.textContent=how==='download'?'✓ PDF geladen':how==='share'?'✓ Geteilt':t}
 catch(e){alert('Die PDF konnte nicht erstellt werden: '+(e&&e.message||e));if(btn)btn.textContent=t}finally{if(btn)setTimeout(()=>{if(btn.isConnected)btn.textContent=t},2500)}}
(()=>{const st=document.createElement('style');st.textContent='#printNotes{display:none}@media print{@page{margin:14mm}body{background:#fff;padding:0}.wrap,.pop{display:none!important}#printNotes{display:block;font:11pt/1.45 -apple-system,Inter,"Segoe UI",sans-serif;color:#000}#printNotes h1{font-size:17pt;margin:0}#printNotes h2{font-size:12.5pt;margin:16px 0 6px;color:#2f5f9b;border-bottom:1px solid #c9d3e3;padding-bottom:2px}.pn-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.pn-n{text-align:right;font-size:10pt}.pn-t{font-family:Georgia,"Palatino",serif;font-size:12pt;line-height:1.7;margin:0}.pn-t u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}.pn-k{font-size:9pt;color:#555;margin:4px 0 0}.pn-s{break-inside:avoid;margin:0 0 9px;padding:0 0 7px;border-bottom:1px dotted #c9d3e3}.pn-la{font-family:Georgia,serif;font-size:11.5pt}.pn-la b{display:inline-block;min-width:20px;color:#2f5f9b;font-family:inherit}.pn-row{display:grid;grid-template-columns:140px 1fr;gap:8px;font-size:10pt;margin-top:2px}.pn-row span{color:#555}.pn-m div{color:#1f6b3d}#printNotes table{border-collapse:collapse}#printNotes td{padding:2px 14px 2px 0;border:0;font-size:10.5pt}}';document.head.append(st)})();
