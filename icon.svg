<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FC6FF"/>
      <stop offset="0.55" stop-color="#1A9BF0"/>
      <stop offset="1" stop-color="#0B6FD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E9F0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF0F7"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A9BFF"/>
      <stop offset="1" stop-color="#0A63D1"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06306B" flood-opacity="0.35"/>
    </filter>
    <filter id="dropSoft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06306B" flood-opacity="0.25"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="sheetClip"><rect x="236" y="250" width="440" height="440" rx="72"/></clipPath>
  </defs>
  <!-- macOS-Squircle mit Rand -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>
  </g>
  <!-- Tabelle -->
  <g filter="url(#dropSoft)">
    <rect x="236" y="250" width="440" height="440" rx="72" fill="url(#sheet)"/>
  </g>
  <g clip-path="url(#sheetClip)" stroke="#8D9AAB" stroke-width="9" stroke-linecap="round">
    <path d="M346 250V690M456 250V690M566 250V690"/>
    <path d="M236 360H676M236 470H676M236 580H676"/>
  </g>
  <rect x="236" y="250" width="440" height="440" rx="72" fill="none" stroke="#C6D0DC" stroke-width="5"/>
  <!-- Karte mit Haken -->
  <g filter="url(#drop)">
    <rect x="420" y="420" width="400" height="400" rx="78" fill="url(#card)"/>
  </g>
  <rect x="421.5" y="421.5" width="397" height="397" rx="76.5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M514 628L590 704L728 548" fill="none" stroke="url(#check)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
