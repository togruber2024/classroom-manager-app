<!doctype html>
<html lang="de"><head><meta charset="utf-8"><script>/* 11.22: Vorschau am Mac (?vorschau=1): Speicher nur im Arbeitsspeicher – nichts wird gespeichert, keine Abgabe */if(/[?&]vorschau=1/.test(location.search)){try{const m=new Map(),s={getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>{m.set(k,String(v))},removeItem:k=>{m.delete(k)},clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size}};Object.defineProperty(window,"localStorage",{configurable:true,get:()=>s})}catch(e){}document.documentElement.classList.add("cm-vorschau")}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><meta name="robots" content="noindex">
<title>Üben</title>
<!-- 11.23: Üben (Vokabeln, Wiederholung, Grammatik) – ohne Note, ohne Abgabe. Diese Seite enthält KEINE Buchinhalte:
     Wörter und Aufgaben kommen aus dem Link (#…) der Lehrkraft. Läuft nach dem Laden ohne Internet; nichts wird an einen Server geschickt. -->
<style>
:root{--blue:#2f5f9b;--ink:#243247;--mut:#66758a;--line:#dce3ef;--bg:#f6f8fc;--ok:#1f8a4c;--okbg:#e5f5ea;--bad:#c2410c;--badbg:#fdeee6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif}
body{padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.wrap{max-width:900px;margin:0 auto}button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:1.5rem;margin:4px 0 0}.muted{color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.row .sp{flex:1}
.pri{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:650}
.sec{min-height:48px;padding:0 16px;border:1px solid #b9c6da;border-radius:12px;background:#fff;color:var(--blue);font-weight:600}
.okb{min-height:52px;padding:0 20px;border:0;border-radius:12px;background:var(--okbg);color:var(--ok);font-weight:700;flex:1}
.nob{min-height:52px;padding:0 20px;border:0;border-radius:12px;background:var(--badbg);color:var(--bad);font-weight:700;flex:1}
.lnk{border:0;background:none;color:var(--mut);text-decoration:underline;min-height:44px}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:600}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}.fb.info{background:#eef3fa;color:#2f4f7a}
.bar{height:8px;border-radius:4px;background:#e6ebf3;overflow:hidden;flex:1;min-width:120px}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash .lat{font-family:"Iowan Old Style","Palatino",Georgia,serif;font-size:2rem;font-weight:700}.flash .inf{color:var(--mut);margin-top:4px}
.flash .de{font-size:1.4rem;color:var(--ok);font-weight:650;margin-top:14px}.flash .tap{color:#9aa6b6;font-size:.9rem;margin-top:14px}
.ask .lat{font-family:"Iowan Old Style","Palatino",Georgia,serif;font-size:1.8rem;font-weight:700}
input.in{width:100%;min-height:48px;padding:0 12px;border:1px solid #cfd8e6;border-radius:12px;font:inherit;font-size:1.1rem;background:#fff}
input.in.ok{border-color:#7cc69a;background:var(--okbg)}input.in.no{border-color:#f0a982;background:var(--badbg)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#e7edf6}.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--mut);font-weight:600;font-size:.9rem;min-height:36px}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 5px #233d6014}
.sol{margin-top:8px;color:var(--ok);font-weight:600}
.gh{font-weight:650;margin-bottom:10px}.gh b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#eef2f8;margin-right:6px;font-size:.85rem}
.gtw{overflow-x:auto}table.gt{border-collapse:collapse}table.gt th,table.gt td{border:1px solid var(--line);padding:4px 6px;text-align:left}table.gt th{background:#f4f7fc;font-weight:600;font-size:.9rem}
table.gt input.in{min-height:40px;min-width:110px;font-size:1rem}table.gt .gv{font-weight:600;color:var(--mut)}table.gt .na{color:#b3bdcc}
table.gt td small{display:block;color:var(--ok);font-weight:600}
.gf{font-family:"Iowan Old Style","Palatino",Georgia,serif;font-size:1.5rem;font-weight:700;margin-bottom:8px}
.gd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.gd>span:first-child{min-width:90px}
.gch{display:flex;gap:6px;flex-wrap:wrap}.gch button{min-height:42px;padding:0 12px;border:1px solid #cfd8e6;border-radius:10px;background:#fff;font-weight:600}
.gch button.on{background:var(--blue);border-color:var(--blue);color:#fff}.gch button.ok{background:var(--okbg);border-color:#7cc69a;color:var(--ok)}.gch button.no{background:var(--badbg);border-color:#f0a982;color:var(--bad)}
.gl{display:flex;gap:10px;align-items:center;margin:6px 0}.gl>span{min-width:120px}
.done{text-align:center}.done .big{font-size:3rem}
.err{border-color:#f0a982}
</style></head><body><div class="wrap" id="app"></div>
<script>
(async()=>{
 const app=document.getElementById('app');
 const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const fail=msg=>{app.innerHTML='<div class="card err"><h1>Üben</h1><p class="muted">'+esc(msg)+'</p></div>'};
 const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
 addEventListener('hashchange',()=>location.reload());
 let P;
 try{const h=decodeURIComponent(location.hash.slice(1));if(!h)throw new Error('Kein Inhalt im Link. Bitte den QR-Code noch einmal scannen.');
  let bytes;if(h.startsWith('z1.')){if(typeof DecompressionStream!=='function')throw new Error('Bitte Safari aktualisieren.');bytes=new Uint8Array(await new Response(new Blob([b64(h.slice(3))]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
  else if(h.startsWith('j1.'))bytes=b64(h.slice(3));else throw new Error('Der Link ist unvollständig. Bitte den QR-Code noch einmal scannen.');
  P=JSON.parse(new TextDecoder().decode(bytes));if(!(P.k==='v'&&Array.isArray(P.w)&&P.w.length)&&!(P.k==='g'&&Array.isArray(P.q)&&P.q.length))throw new Error('Der Link ist beschädigt.')}
 catch(e){fail(e.message||String(e));return}
 document.title=(P.t||'Üben');
 let SOL=false;
 const KEY='cm-ueben-'+(P.t||'')+'-'+(P.k==='v'?P.w.length:P.q.length);
 const ls={get:()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}},set:v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch{}}};
 const plain=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/j/g,'i');
 const head=sub=>'<h1>'+esc(P.t||'Üben')+'</h1><div class="muted">'+esc(sub)+(P.c?' · '+esc(P.c):'')+' · ohne Note – so oft du willst</div>';
 /* ---------- Vokabeln ---------- */
 if(P.k==='v'){
  const W=P.w;let S=ls.get();if(!S||!Array.isArray(S.known)||S.known.length!==W.length)S={known:W.map(()=>0),first:W.map(()=>null),tab:'karten',dir:'ld'};
  const save=()=>ls.set(S);let queue=[],cur=-1,shown=false,checked=null;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const refill=()=>{queue=shuffle(W.map((_,i)=>i).filter(i=>!S.known[i]))};
  const nextCard=()=>{if(!queue.length)refill();cur=queue.shift()??-1;shown=SOL;checked=null};
  const known=()=>S.known.filter(Boolean).length;
  const parts=m=>String(m||'').replace(/\([^)]*\)/g,' ').split(/[,;\/]| bzw\. | oder /).map(x=>plain(x).replace(/\b(der|die|das|ein|eine|einen|sich|etw\.?|jdn\.?|jdm\.?|jmd\.?)\b/g,' ').replace(/[^a-zäöüß\s-]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  const lev=(a,b)=>{if(Math.abs(a.length-b.length)>1)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
  const near=(x,y)=>x===y||(y.length>=6&&lev(x,y)<=1);
  const okDe=(inp,m)=>{const v=parts(inp)[0]||'';if(!v)return false;return parts(m).some(p=>near(v,p)||p.split(' ').some(w=>w.length>=4&&near(v,w)))};
  const okLat=(inp,l)=>{const v=plain(inp).replace(/[^a-z\s]/g,' ').trim().split(/\s+/)[0]||'';const t=plain(l).replace(/[^a-z\s,]/g,' ').split(/[,\s]+/).filter(Boolean)[0]||'';return !!v&&v===t};
  function render(){if(cur<0||(S.known[cur]&&checked==null))nextCard();const n=known(),all=W.length,w=W[cur]||[];
   let h=head('Vokabeln · '+all+' Wörter')+'<div class="tabs"><button data-t="karten" class="'+(S.tab==='karten'?'on':'')+'">Karteikarten</button><button data-t="abfrage" class="'+(S.tab==='abfrage'?'on':'')+'">Abfrage</button><button data-t="liste" class="'+(S.tab==='liste'?'on':'')+'">Liste</button></div>'
    +'<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 18px"><div class="bar"><i style="width:'+(100*n/all)+'%"></i></div><span class="muted">'+n+' von '+all+' sicher</span></div>';
   if(S.tab==='liste')h+='<div class="card"><table class="gt" style="width:100%">'+W.map((x,i)=>'<tr><td><b>'+esc(x[0])+'</b> <span class="muted">'+esc(x[1])+'</span></td><td>'+esc(x[2])+'</td><td style="text-align:center">'+(S.known[i]?'✓':'')+'</td></tr>').join('')+'</table></div>';
   else if(n===all)h+='<div class="card done"><div class="big">🎉</div><h2>Alle '+all+' Wörter sicher!</h2><p class="muted">Beim ersten Versuch gewusst: '+S.first.filter(x=>x===true).length+' von '+all+'.</p><div class="row" style="justify-content:center"><button class="pri" data-reset>Noch einmal von vorn</button></div></div>';
   else if(S.tab==='karten')h+='<div class="card flash" data-flip><div class="lat">'+esc(S.dir==='dl'?w[2]:w[0])+'</div>'+(S.dir==='dl'?'':'<div class="inf">'+esc(w[1])+'</div>')+(shown?'<div class="de">'+esc(S.dir==='dl'?w[0]+' '+w[1]:w[2])+'</div>':'<div class="tap">Antippen zum Umdrehen</div>')+'</div>'
    +(shown?'<div class="row"><button class="nob" data-k="0">✗ Noch nicht</button><button class="okb" data-k="1">✓ Gewusst</button></div>':'')
    +'<div class="row"><div class="seg"><button data-dir="ld" class="'+(S.dir!=='dl'?'on':'')+'">Latein → Deutsch</button><button data-dir="dl" class="'+(S.dir==='dl'?'on':'')+'">Deutsch → Latein</button></div><span class="sp"></span><button class="lnk" data-reset>Von vorn</button></div>';
   else{const ld=S.dir!=='dl';h+='<div class="card ask"><div class="muted" style="font-size:.9rem">'+(ld?'Was bedeutet …':'Wie heißt auf Lateinisch …')+'</div><div class="lat">'+esc(ld?w[0]:w[2])+'</div>'+(ld?'<div class="muted">'+esc(w[1])+'</div>':'')
     +'<div class="row"><input class="in'+(checked===true?' ok':checked===false?' no':'')+'" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="'+(ld?'Bedeutung':'Grundform')+'"></div>'
     +(checked===false||SOL?'<div class="sol">Lösung: '+esc(ld?w[2]:w[0]+' '+w[1])+'</div>':'')+(checked===true?'<div class="fb ok">✓ Richtig!</div>':checked===false?'<div class="fb no">Nicht ganz – das Wort kommt später noch einmal.</div>':'')
     +'<div class="row"><span class="sp"></span>'+(checked==null?'<button class="sec" data-skip>Weiß ich nicht</button><button class="pri" data-chk>Prüfen</button>':'<button class="pri" data-next>Weiter</button>')+'</div></div>'
     +'<div class="row"><div class="seg"><button data-dir="ld" class="'+(ld?'on':'')+'">Latein → Deutsch</button><button data-dir="dl" class="'+(!ld?'on':'')+'">Deutsch → Latein</button></div><span class="sp"></span><button class="lnk" data-reset>Von vorn</button></div>'}
   app.innerHTML=h;const a=document.getElementById('ans');if(a&&checked==null)a.focus()}
  const mark=ok=>{if(S.first[cur]==null)S.first[cur]=ok;if(ok)S.known[cur]=1;else queue.splice(Math.min(queue.length,3),0,cur);save()};
  app.addEventListener('click',e=>{const t=e.target.closest('button,[data-flip]');if(!t)return;
   if(t.dataset.t){S.tab=t.dataset.t;checked=null;shown=SOL;save();render();return}
   if(t.dataset.dir){S.dir=t.dataset.dir;checked=null;shown=SOL;save();render();return}
   if(t.hasAttribute('data-reset')){if(known()&&!confirm('Wirklich von vorn beginnen?'))return;S={...S,known:W.map(()=>0),first:W.map(()=>null)};save();cur=-1;queue=[];render();return}
   if(t.hasAttribute('data-flip')){shown=!shown;render();return}
   if(t.dataset.k!=null){mark(t.dataset.k==='1');nextCard();render();return}
   if(t.hasAttribute('data-chk')||t.hasAttribute('data-skip')){const v=document.getElementById('ans').value,w=W[cur];checked=t.hasAttribute('data-skip')?false:(S.dir==='dl'?okLat(v,w[0]):okDe(v,w[2]));mark(checked);const keep=v;render();const a=document.getElementById('ans');if(a)a.value=keep;return}
   if(t.hasAttribute('data-next')){nextCard();render()}});
  app.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.id!=='ans')return;e.preventDefault();(app.querySelector('[data-chk]')||app.querySelector('[data-next]'))?.click()});
  window.cmPreviewSolutions=on=>{SOL=!!on;shown=SOL;render()};
  render();return}
 /* ---------- Grammatik ---------- */
 const norm=s=>plain(s).replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
 const Q=P.q;let S=ls.get();const blank=it=>it.k==='tab'?{c:it.rw.map(()=>it.cl.map(()=>''))}:it.k==='det'?{d:it.d.map(()=>'')}:{v:it.sub.map(()=>'')};
 if(!S||!Array.isArray(S.a)||S.a.length!==Q.length)S={a:Q.map(blank),r:Q.map(()=>null)};const save=()=>ls.set(S);
 const off='autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
 const okTab=(it,ri,ci,v)=>{const f=it.sol[ri][ci];return !!norm(v)&&String(f).split('/').some(x=>norm(x)===norm(v))};
 function grade(it,a){if(it.k==='tab'){let ok=true;it.sol.forEach((row,ri)=>row.forEach((f,ci)=>{if(f&&!it.gv[ri][ci]&&!okTab(it,ri,ci,a.c[ri][ci]))ok=false}));return ok}
  if(it.k==='det')return it.sol.some(s=>s.every((v,i)=>a.d[i]===v));return it.sol.every((acc,i)=>norm(a.v[i])&&acc.some(x=>norm(x)===norm(a.v[i])))}
 const solDet=it=>it.sol.map(s=>s.join(' ')).join(' · oder · ');
 function body(it,i){const a=S.a[i],r=S.r[i],show=r===false||SOL;
  if(it.k==='tab')return '<div class="gtw"><table class="gt"><tr><th></th>'+it.cl.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+it.rw.map((rw,ri)=>'<tr><th>'+esc(rw)+'</th>'+it.sol[ri].map((f,ci)=>'<td>'+(f==null?'<span class="na">–</span>':it.gv[ri][ci]?'<span class="gv">'+esc(f)+'</span>':'<input class="in'+(r!=null?(okTab(it,ri,ci,a.c[ri][ci])?' ok':' no'):'')+'" data-c="'+ri+','+ci+'" '+off+' value="'+esc(a.c[ri][ci]||'')+'">'+(show&&!(r!=null&&okTab(it,ri,ci,a.c[ri][ci]))?'<small>'+esc(f)+'</small>':''))+'</td>').join('')+'</tr>').join('')+'</table></div>';
  if(it.k==='det')return '<div class="gf">'+esc(it.f)+'</div>'+it.d.map(([l,opts],di)=>'<div class="gd"><span class="muted">'+esc(l)+'</span><span class="gch">'+opts.map(o=>'<button type="button" data-d="'+di+'" data-v="'+esc(o)+'" class="'+(a.d[di]===o?(r!=null?(it.sol.some(s=>s[di]===o)?'ok':'no'):'on'):'')+'">'+esc(o)+'</button>').join('')+'</span></div>').join('')+(show?'<div class="sol">Lösung: '+esc(solDet(it))+'</div>':'');
  return '<div class="gf">'+esc(it.p)+'</div>'+it.sub.map((l,si)=>{const v=a.v[si]||'',good=r!=null&&norm(v)&&it.sol[si].some(x=>norm(x)===norm(v));return '<label class="gl"><span class="muted">'+esc(l)+'</span><input class="in'+(r!=null?(good?' ok':' no'):'')+'" data-v="'+si+'" '+off+' value="'+esc(v)+'"></label>'+(show&&!good?'<div class="sol" style="margin-left:130px">'+esc(it.sol[si][0])+'</div>':'')}).join('')}
 function card(it,i){const r=S.r[i];return '<div class="card gcard" data-i="'+i+'"><div class="gh"><b>'+(i+1)+'</b>'+esc(it.ti||'')+'</div>'+body(it,i)
  +(r===true?'<div class="fb ok">✓ Alles richtig!</div>':r===false?'<div class="fb no">Noch nicht ganz – die Lösung steht in Grün. Versuch es noch einmal.</div>':'')
  +'<div class="row"><span class="sp"></span>'+(r==null?'<button class="pri" data-chk>Prüfen</button>':'<button class="sec" data-again>Nochmal</button>')+'</div></div>'}
 function render(){const ok=S.r.filter(x=>x===true).length;
  app.innerHTML=head('Grammatik · '+Q.length+' Aufgaben')+'<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 18px"><div class="bar"><i style="width:'+(100*ok/Q.length)+'%"></i></div><span class="muted">'+ok+' von '+Q.length+' richtig</span><button class="lnk" data-reset>Von vorn</button></div>'
   +Q.map(card).join('')+(ok===Q.length?'<div class="card done"><div class="big">🎉</div><h2>Alle Aufgaben richtig!</h2></div>':'')}
 const redraw=i=>{const old=app.querySelector('.gcard[data-i="'+i+'"]');const t=document.createElement('div');t.innerHTML=card(Q[i],i);old.replaceWith(t.firstChild);const ok=S.r.filter(x=>x===true).length;app.querySelector('.bar i').style.width=(100*ok/Q.length)+'%';app.querySelector('.bar+.muted').textContent=ok+' von '+Q.length+' richtig'};
 app.addEventListener('input',e=>{const t=e.target,c=t.closest('.gcard');if(!c)return;const i=+c.dataset.i,a=S.a[i];if(t.dataset.c){const [r,cc]=t.dataset.c.split(',').map(Number);a.c[r][cc]=t.value}else if(t.dataset.v!=null)a.v[+t.dataset.v]=t.value;if(S.r[i]!=null){S.r[i]=null;t.classList.remove('ok','no')}save()});
 app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-reset')){if(!confirm('Alle Eingaben löschen und von vorn beginnen?'))return;S={a:Q.map(blank),r:Q.map(()=>null)};save();render();return}
  const c=b.closest('.gcard');if(!c)return;const i=+c.dataset.i,a=S.a[i];
  if(b.dataset.d!=null){if(S.r[i]!=null)S.r[i]=null;const di=+b.dataset.d;a.d[di]=a.d[di]===b.dataset.v?'':b.dataset.v;save();redraw(i);return}
  if(b.hasAttribute('data-chk')){S.r[i]=grade(Q[i],a);save();redraw(i);return}
  if(b.hasAttribute('data-again')){S.a[i]=blank(Q[i]);S.r[i]=null;save();redraw(i)}});
 window.cmPreviewSolutions=on=>{SOL=!!on;render()};
 render();
})();
</script></body></html>
