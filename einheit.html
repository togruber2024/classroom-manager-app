  const sol=()=>{if(BOOK){const [x,y]=q[2][0];pin(x*100,y*100,true)}else if(q[3]==='ring')pin(300/6,(220-182)/4.4,true);else{const [x,y]=q[2][0];pin(x/6,y/4.4,true)}};
  if(a.e&&(!a.ok||SOLV))sol();
  tgt.addEventListener('click',ev=>{const c=F[i]??={n:0};if(c.e)return;const r=tgt.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;let ok;
   if(BOOK){const R=BOOK.maps[e].r||1;ok=q[2].some(([u,v])=>Math.hypot(x-u,(y-v)*R)<(q[2].length>1?.07:.06))}
   else if(q[3]==='ring'){const d=Math.hypot((x*600-300)/150,(y*440-220)/182);ok=Math.abs(d-1)<.1}else ok=q[2].some(([u,v])=>Math.hypot(x*600-u,y*440-v)<30);
   c.n++;if(ok){c.ok=1;c.e=1}else if(c.n>=2)c.e=1;
   if(F.filter(z=>z&&z.e).length===N)fin('bf',QS.filter((_,j)=>F[j].ok&&F[j].n===1).length,N,QS.map((_,j)=>F[j].ok&&F[j].n===1?-1:j).filter(j=>j>=0));else save();draw()});
  const nq=app.querySelector('[data-nq]');if(nq)nq.onclick=()=>{i++;draw()};const pq=app.querySelector('[data-pq]');if(pq)pq.onclick=()=>{i--;draw()}});draw()}

function wFeat(k,o){const FT=o.feat,S=ST.feS??={},R=ST.feR??={},PT=ST.feP??={},XX=ST.feX??={};let e=SOLV?0:Math.max(0,[0,1,2,3].find(k=>(R[k]||0)<2)??0),leg=false;
 const tot=()=>FT.reduce((a,f)=>a+f.filter(x=>x[1]).length,0);
 const draw=()=>keep('bfe',()=>{const F=FT[e],sel=S[e]??=[],r=R[e]||0,N=F.filter(x=>x[1]).length,fx=k=>r>0&&F[k][1]&&sel.includes(k),solk=k=>r===2&&F[k][1]&&!sel.includes(k);
  frame('','<div class="tabs">'+[0,1,2,3].map(k=>'<button class="'+(k===e?'on':'')+((R[k]||0)>=1?' done':'')+'" data-tab="'+k+'">'+esc(ERAS[k][0])+'</button>').join('')+'</div>'
   +'<div class="two"><div class="card"><b>'+esc(mapT(e))+'</b>'+(BOOK?bmap([e],'bd')+'<div class="bmbar"><button class="sec" data-zoom="bd">🔍 Vergrößern</button>'+(BOOK.maps[e].leg?'<button class="sec" data-leg>Legende</button>':'')+'</div>'+(leg&&BOOK.maps[e].leg?'<img class="leg" src="'+BOOK.maps[e].leg+'" alt="Legende" style="width:100%;margin-top:8px">':''):'<div id="dm" style="margin-top:8px">'+mapSvg({})+'</div>')+'</div>'
   +'<div class="card"><h2>Was ist auf dieser Karte zu sehen?</h2><p style="margin:0">Tippe alles an, was du auf der Karte findest. <b>Falsch angetippte Merkmale kosten einen Punkt.</b></p><div class="pool" style="margin-top:10px">'
   +F.map(([t,v],k)=>'<button class="chip'+(solk(k)?' sol':r===2?(sel.includes(k)?(v?' ok':' no'):''):fx(k)?' ok':sel.includes(k)?' on':'')+'" data-f="'+k+'" '+(fx(k)||r===2?'disabled':'')+'>'+esc(t)+'</button>').join('')+'</div>'
   +(r<2?'<div class="row"><div class="sp"></div><button class="pri" data-chk '+(sel.length?'':'disabled')+'>'+(r?'Zweiter Versuch: prüfen':'Prüfen')+'</button></div>':'')
   +(r===1?fb(0,'⚠︎ '+PT[e]+' von '+N+' Punkten – diese zählen. Richtige sind fest, falsche gelöscht: <b>ein</b> zweiter Versuch (ohne Punkte).'):r===2?fb(PT[e]===N,PT[e]+' von '+N+' Punkten beim ersten Versuch.'+(F.some((x,k)=>solk(k))?' Gelb: Das hast du übersehen.':'')):'')
   +(r===2&&e<3?'<div class="row"><div class="sp"></div><button class="pri" data-nm>Nächste Karte ›</button></div>':'')
   +(ST.bfe?fb(ST.bfe.p===ST.bfe.t,'⭐ Alle vier Karten: '+ST.bfe.p+' von '+ST.bfe.t+' Punkten.'):'')+'</div></div>');
  const dm=$('#dm');if(dm)setEra(dm,e);if(BOOK){bshow($('#bd'),e);wireZoom();const lg=app.querySelector('[data-leg]');if(lg)lg.onclick=()=>{leg=!leg;draw()}}
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{e=+b.dataset.tab;leg=false;draw()});
  const nm=app.querySelector('[data-nm]');if(nm)nm.onclick=()=>{e++;leg=false;draw()};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=+b.dataset.f,j=sel.indexOf(k);if(j>=0)sel.splice(j,1);else sel.push(k);save();draw()});
  const chk=app.querySelector('[data-chk]');if(chk)chk.onclick=()=>{const good=sel.filter(k=>F[k][1]).length,bad=sel.filter(k=>!F[k][1]).length;
   if(r===0){PT[e]=Math.max(0,good-bad);XX[e]=F.map((x,k)=>!!x[1]!==sel.includes(k)?e*7+k:-1).filter(k=>k>=0);S[e]=sel.filter(k=>F[k][1]);R[e]=PT[e]===N&&!bad?2:1}else R[e]=2;
   if([0,1,2,3].every(k=>(R[k]||0)>=1))fin('bfe',[0,1,2,3].reduce((a,k)=>a+PT[k],0),tot(),[0,1,2,3].flatMap(k=>XX[k]));save();draw()}});draw()}



/* 11.54: Material zuerst – alle Schulbuch-Materialien der Doppelseite auf einer Seite */
function bookReader(){if(!BOOK)return;const o=document.createElement('div');o.className='rdr';let h='<div class="in"><div class="row" style="margin:0 0 6px"><b style="font-size:1.2rem">📘 Material aus dem Schulbuch</b><div class="sp"></div><button class="pri" data-x>Zu den Stationen</button></div><div class="muted" style="font-size:.85rem">'+esc(BOOK.source||'')+'</div>';
 const T=[];for(const [k,v] of Object.entries(BOOK))if(v&&typeof v==='object'&&v.t&&Array.isArray(v.p))T.push(v);
 const ord=(BOOK.order||[]);const imgs=Object.entries(BOOK.img||{});
 for(const x of T)h+='<div class="card"><h3>'+esc(x.t)+'</h3>'+x.p.map(p=>typeof p==='string'?'<p>'+md(p)+'</p>':p.q?'<p class="tq">'+esc(p.q)+'</p>':'<p>'+md(p.a)+'</p>').join('')+(x.src?'<div class="cap">'+esc(x.src)+'</div>':'')+'</div>';
 for(const [k,v] of imgs)h+='<div class="card"><h3>'+esc(v.m)+' '+esc(v.t)+'</h3>'+(v.html?'<div class="btxt">'+v.html+'</div>':'<img src="'+v.src+'" alt="">')+'</div>';
 o.innerHTML=h+'<div class="row"><div class="sp"></div><button class="pri" data-x>Zu den Stationen</button></div></div>';o.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>o.remove());document.body.append(o);o.scrollTop=0}

const TOTMIN=Math.round(STEPS.reduce((a,s)=>a+s[3],0));
function home(){CURK=null;const st=k=>ST[k]?'<span class="st done">'+(ST[k].p!=null?ST[k].p+'/'+ST[k].t:'✓')+'</span>':'<span class="st">offen</span>';
 const startK=(STEPS.find(s=>!ST[s[0]])||[])[0];
 app.innerHTML='<div class="card hero"><div><div class="muted">'+esc(META.kicker||META.sub||'')+'</div><h1>'+esc(META.title||'')+'</h1><p>'+esc(META.hero||'')+'</p><span class="badge">⭐ '+STEPS.filter(x=>ST[x[0]]).length+' von '+STEPS.length+' Stationen</span><span class="time">⏱ ca. '+TOTMIN+' Minuten</span></div><div>'+HEROSVG()+'</div></div>'
  +(BOOK?'<div class="card mat1"><div><b>📘 Zuerst: das Material aus dem Schulbuch</b><div class="muted" style="font-size:.9rem">Lies die Texte und sieh dir Karten und Diagramme an – alle Aufgaben löst du damit.</div></div><button class="pri" data-read>Material ansehen</button></div>':'')+'<div class="steps">'+STEPS.map(([k,t,d,m],i)=>'<button class="step'+(k===startK?' start':'')+'" data-s="'+k+'"><span class="n">'+(i+1)+'</span><span><b>'+t+'</b>'+(k===startK?'<span class="go">'+(i?'Weiter hier':'Starte hier')+'</span>':'')+'<small>'+cmMat(d)+'<span class="min">· '+String(m).replace('.',',')+' min</span></small></span>'+st(k)+'</button>').join('')+'</div>'
  +(BOOK?'<div class="bksrc">📘 Schulbuch-Material geladen: '+esc(BOOK.source)+' · <button class="lnk" data-drop>Vom Gerät entfernen</button></div>':'<div class="bkload"><span>📘 Mit den Materialien aus dem Schulbuch arbeiten ('+esc(META.mats||'')+')? Lade die Datei von deiner Lehrkraft (z. B. per AirDrop).</span><button class="sec" data-load>Schulbuch-Datei laden …</button></div>');
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>goStep(b.dataset.s));const L=app.querySelector('[data-load]');if(L)L.onclick=bookPick;const D=app.querySelector('[data-drop]');if(D)D.onclick=bookDrop;const RD=app.querySelector('[data-read]');if(RD)RD.onclick=bookReader;scrollTo(0,0)}


/* ---------- Abgabe-QR (wie „Städte im Wandel“) ---------- */
ST.dv??=Math.random().toString(36).slice(2,10);
(()=>{const h=location.hash;if(!/^#k1\./.test(h))return;try{let x=h.slice(4).replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';const b=atob(x),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const j=JSON.parse(new TextDecoder().decode(u));
 if(Array.isArray(j.n)&&j.n.length){if(ST.cls!==j.c||!j.n.includes(ST.me))ST.me=null;ST.cls=String(j.c||'');ST.roster=j.n.map(String)}}catch{}try{history.replaceState(null,'',location.pathname+location.search)}catch{}})();
const doneCount=()=>STEPS.filter(x=>ST[x[0]]).length;
/* 11.33: nur Punkte je Station und die Nummern der Fehler – passt immer in einen QR-Code */
function payload(){const sv={},x={};for(const [k] of STEPS){const v=ST[k];if(v){sv[k]=v.p!=null?[v.p,v.t]:1;if(v.x&&v.x.length)x[k]=v.x.join('.')}}
 return 'CMLE1:'+JSON.stringify({u:UID,v:2,c:ST.cls||'',n:ST.me,dv:ST.dv,ts:Date.now(),b:BOOK?1:0,s:sv,x})}
const qrSvg=(t,o)=>{try{return classroomQrSvg(t,Object.assign({ecc:'L',boost:false,dark:'#243247',border:2},o||{}))}catch{return ''}};
let whoT=0;function updWho(){clearTimeout(whoT);whoT=setTimeout(()=>{const w=$('#who');if(!w)return;document.body.classList.add('has-who');w.hidden=false;
 if(!ST.me){w.className='noname';w.innerHTML='<span><b>Abgabe-QR</b><small>Name wählen</small></span>';return}
 w.className='';w.innerHTML='<span><b>'+esc(ST.me)+'</b><small>'+doneCount()+' von '+STEPS.length+' ✓</small></span><svg viewBox="0 0 24 24" fill="#243247" aria-hidden="true"><path d="M3 3h8v8H3zM5 5v4h4V5zM13 3h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zM13 13h3v3h-3zM18 13h3v3h-3zM13 18h3v3h-3zM18 18h3v3h-3zM16 16h2v2h-2z"/></svg>'},30)}
async function packQr(){return [payload()]}
async function showQr(){if(!ST.me){runWho();return}const codes=await packQr();let k=0;const o=document.createElement('div');o.className='qrfull';
 const draw=()=>{o.innerHTML='<div class="muted">Abgabe · '+esc(META.short||'')+(ST.cls?' · '+esc(ST.cls):'')+'</div><div class="nm">'+esc(ST.me)+'</div>'+(codes.length>1?'<div class="qn">Code '+(k+1)+' von '+codes.length+'</div>':'')+qrSvg(codes[k],{border:3})
  +(codes.length>1?'<div class="qprog">'+codes.map((_,i)=>'<i class="'+(i<=k?'on':'')+'"></i>').join('')+'</div>':'')+'<div class="muted" style="font-size:.9rem">Stand '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' · '+doneCount()+' von '+STEPS.length+' Stationen'+(codes.length>1?' · nach dem Scannen „Nächster Code“':'')+'</div>'
  +'<div class="row" style="justify-content:center;margin-top:4px">'+(codes.length>1?'<button class="sec" data-pv '+(k?'':'disabled')+'>‹ Zurück</button>'+(k<codes.length-1?'<button class="pri" data-nx>Nächster Code ›</button>':'<button class="pri" data-c>Fertig</button>'):'<button class="pri" data-c>Schließen</button>')+'</div>'+(codes.length>1&&k<codes.length-1?'<button class="lnk" data-c style="font-size:.85rem">Schließen</button>':'')+'<button class="lnk" data-ch style="font-size:.85rem">Nicht dein Name? Ändern</button>';
  o.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>o.remove());const nx=o.querySelector('[data-nx]'),pv=o.querySelector('[data-pv]');if(nx)nx.onclick=()=>{k++;draw()};if(pv)pv.onclick=()=>{if(k){k--;draw()}};
  o.querySelector('[data-ch]').onclick=()=>{if(confirm('Deinen Namen wirklich ändern? Deine Lehrkraft sieht den neuen Namen.')){o.remove();runWho(true)}}};
 draw();document.body.append(o)}
function runWho(force){const R=ST.roster||[];let pick=ST.me&&!force?ST.me:null;
 const draw=()=>{frame('Dein Name',R.length?'<div class="card"><h2>'+esc(META.short||'')+(ST.cls?' · '+esc(ST.cls):'')+'</h2><p style="margin:4px 0 0">Tippe auf deinen Namen. Er steht später groß über deinem Abgabe-QR.</p><div class="names">'+R.map(n=>'<button class="'+(n===pick?'on':'')+'" data-n="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div><div class="row"><div class="sp"></div><button class="pri" data-ok '+(pick?'':'disabled')+'>'+(pick?'Das bin ich: '+esc(pick):'Namen antippen')+'</button></div></div>'
  :'<div class="card"><h2>Dein Name</h2><p style="margin:4px 0 10px">Scanne den Start-QR deiner Lehrkraft – dann kannst du deinen Namen aus der Liste wählen. Oder trage ihn hier ein (Vor- und Nachname):</p><input id="nmIn" value="'+esc(pick||'')+'" placeholder="Vorname Nachname" style="width:100%;min-height:50px;padding:0 12px;border:1px solid #cfd8e6;border-radius:12px;font:inherit"><div class="row"><div class="sp"></div><button class="pri" data-ok>Speichern</button></div></div>');
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{pick=b.dataset.n;draw()});const inp=$('#nmIn');if(inp)inp.oninput=()=>{pick=inp.value.trim()};
  app.querySelector('[data-ok]').onclick=()=>{if(!pick||pick.length<2)return;ST.me=pick;if(!ST.name)ST.name=pick;save();home()}};draw()}
$('#who').onclick=showQr;
save();if(ST.roster&&!ST.me)runWho();else home();updWho();bookInit();
