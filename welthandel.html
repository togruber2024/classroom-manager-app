<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const beep=()=>{};/* keine Töne im Klassenraum */
const KEY='cm-welthandel-v1';let ST={};try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch{}try{updWho()}catch{}};
function frame(title,inner){app.innerHTML='<div class="top"><button class="back" data-home>‹ Übersicht</button><div class="sp"></div><b>'+esc(title)+'</b></div>'+inner;app.querySelector('[data-home]').onclick=home;scrollTo(0,0)}
const fb=(ok,txt)=>'<div class="fb '+(ok?'ok':'no')+'">'+txt+'</div>';
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');

/* ---------- Fachbegriffe ---------- */
const GLOSS={Welthandel:'Austausch von Waren und Dienstleistungen zwischen den Staaten der Erde.',Export:'Ausfuhr: Waren oder Dienstleistungen werden ins Ausland verkauft.',Import:'Einfuhr: Waren oder Dienstleistungen werden aus dem Ausland gekauft.',Globalisierung:'Die weltweite Verflechtung von Wirtschaft, Politik, Kultur und Umwelt nimmt zu.',Lieferkette:'Alle Schritte vom Rohstoff bis zum fertigen Produkt beim Kunden – oft über viele Länder verteilt.',Index:'Eine Messzahl: Ein Startjahr wird gleich 100 gesetzt, spätere Werte zeigen die Veränderung (200 = doppelt so viel).',preisbereinigt:'Die Werte sind um Preissteigerungen (Inflation) bereinigt – man vergleicht also echte Mengen, nicht nur Preise.',Bruttoinlandsprodukt:'Wert aller Waren und Dienstleistungen, die in einem Jahr in einem Land (oder weltweit) hergestellt werden.',Binnenhandel:'Handel innerhalb eines Wirtschaftsraumes (z. B. zwischen Staaten Europas).',Wirtschaftsbündnis:'Zusammenschluss von Staaten, die ihre Wirtschaft enger verbinden und den Handel untereinander erleichtern.',Freihandelszone:'Gebiet, in dem die Mitgliedsstaaten untereinander auf Handelshemmnisse wie Zölle verzichten.',Zoll:'Abgabe, die beim Einführen von Waren an den Staat gezahlt werden muss – macht ausländische Waren teurer.',WTO:'Welthandelsorganisation (World Trade Organization): koordiniert seit 1995 die Regeln des Welthandels; 164 Mitglieder.',Subvention:'Geld vom Staat für bestimmte Unternehmen oder Branchen, damit sie günstiger produzieren können.',Triade:'Die drei großen Wirtschaftsräume der Erde: Nordamerika, Europa und Ost-/Südostasien.'};
const terms=(ks,cur)=>'<div style="margin-top:6px">'+ks.map(k=>'<button class="term'+(cur===k?' on':'')+'" data-k="'+k+'">'+k+'</button>').join('')+'</div>'+(cur?'<div class="def"><b>'+esc(cur)+':</b> '+esc(GLOSS[cur])+'</div>':'');

/* ---------- Daten (WTO, Weltbank; vereinfacht) ---------- */
const M1=[[1950,100,100],[1960,212,155],[1970,481,266],[1980,804,393],[1990,1171,561],[2000,2183,752],[2008,3265,null],[2009,2920,null],[2010,3323,1013],[2019,4260,1310],[2020,4041,1278],[2022,4481,1396]];
const EXP=[['China',3594,'A'],['USA',2065,'N'],['Deutschland',1655,'E'],['Niederlande',966,'E'],['Japan',747,'A'],['Südkorea',684,'A'],['Italien',657,'E'],['Belgien',633,'E'],['Frankreich',618,'E'],['Hongkong',610,'A']];
const REG={N:'Nordamerika',E:'Europa',A:'Asien'};
const VOL=[['Europa und Zentralasien',7317,69.5],['Ostasien und Ozeanien',6009,50.9],['Nordamerika',2090,30.1],['Lateinamerika',998,14.3],['Naher Osten und Nordafrika',924,12.8],['Südasien',348,7.4],['Subsahara-Afrika',241,26.1]];

/* ---------- Schulbuch-Material: private Datei (.cmeinheit), nur lokal im Gerät ---------- */
let BOOK=null;const UID='welthandel';
const IDB=(mode,fn)=>new Promise((res,rej)=>{try{const r=indexedDB.open('cm-lerneinheiten',1);r.onupgradeneeded=()=>r.result.createObjectStore('u');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('u',mode),q=fn(tx.objectStore('u'));tx.oncomplete=()=>{res(q&&q.result);db.close()};tx.onerror=()=>rej(tx.error)}}catch(e){rej(e)}});
const bookOk=u=>!!(u&&u.type==='classroom-lerneinheit'&&u.id===UID);
async function bookInit(){try{const u=await IDB('readonly',st=>st.get(UID));if(bookOk(u)){BOOK=u;if(!app.querySelector('.top'))home()}}catch{}}
function bookPick(){const i=document.createElement('input');i.type='file';i.style.display='none';document.body.append(i);

 let g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Diagramm Welthandel und Weltwirtschaftsleistung">';
 for(let v=0;v<=5000;v+=1000)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yv(v)+'" y2="'+yv(v)+'" stroke="#e3e8f0"/><text x="'+(L-8)+'" y="'+(yv(v)+4)+'" text-anchor="end" class="ax">'+fmt(v)+'</text>';
 for(let y=1950;y<=2020;y+=10)g+='<text x="'+x(y)+'" y="'+(H-B+20)+'" text-anchor="middle" class="ax">'+y+'</text>';
 const path=k=>M1.filter(r=>r[k]!=null).map((r,i)=>(i?'L':'M')+x(r[0]).toFixed(1)+' '+yv(r[k]).toFixed(1)).join(' ');
 g+='<path d="'+path(1)+'" stroke="#2f5f9b" stroke-width="3.5" fill="none"/><path d="'+path(2)+'" stroke="#d9622b" stroke-width="3.5" fill="none"/>';
 g+='<text x="'+x(1992)+'" y="'+yv(2300)+'" class="lb" fill="#2f5f9b">Welthandel (Exporte)</text><text x="'+x(1996)+'" y="'+yv(400)+'" class="lb" fill="#d9622b">Weltwirtschaftsleistung (BIP)</text>';
 M1.forEach((r,i)=>{for(const k of [1,2])if(r[k]!=null)g+='<circle cx="'+x(r[0])+'" cy="'+yv(r[k])+'" r="'+(sel===i?7:4.5)+'" fill="#fff" stroke="'+(k===1?'#2f5f9b':'#d9622b')+'" stroke-width="2.5"/>';g+='<rect x="'+(x(r[0])-9)+'" y="'+T+'" width="18" height="'+(H-T-B)+'" fill="transparent" data-pt="'+i+'" style="cursor:pointer"/>'});

  :'<div class="card"><h2>Dein Name</h2><p style="margin:4px 0 10px">Scanne den Start-QR deiner Lehrkraft – dann kannst du deinen Namen aus der Liste wählen. Oder trage ihn hier ein (Vor- und Nachname):</p><input id="nmIn" value="'+esc(pick||'')+'" placeholder="Vorname Nachname" style="width:100%;min-height:50px;padding:0 12px;border:1px solid #cfd8e6;border-radius:12px;font:inherit"><div class="row"><div class="sp"></div><button class="pri" data-ok>Speichern</button></div></div>');
