(async()=>{
 const app=document.getElementById('app');

 const toB64=u=>{let x='';for(let i=0;i<u.length;i+=0x8000)x+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
 async function packCodes(body){const raw=new TextEncoder().encode(JSON.stringify(body));let data;
  try{data='z'+toB64(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()))}catch{data='j'+toB64(raw)}
  const CH=650,n=Math.max(1,Math.ceil(data.length/CH)),id=Math.random().toString(36).slice(2,6);
  return Array.from({length:n},(_,k)=>'CMA1/'+id+'/'+(k+1)+'/'+n+'/'+data.slice(k*CH,(k+1)*CH))}
 async function qrDone(body,send){const done=document.getElementById('done'),card=done.querySelector('.card');let codes=[],k=0,big=false;
  try{codes=await packCodes(body)}catch{}
  const draw=()=>{let svg='';try{if(codes.length&&window.classroomQrSvg)svg=classroomQrSvg(codes[k],{ecc:'M',boost:false,dark:'#1d2b3d',border:3})}catch{svg=''}
   card.innerHTML='<span class="dok">✓ Abgegeben</span><h2 style="margin-top:12px">'+esc(body.name)+'</h2><div class="muted">'+esc(body.t||'')+' · Gruppe '+esc(body.g)+'</div>'
    +(svg?(codes.length>1?'<div class="qn">Code '+(k+1)+' von '+codes.length+'</div>':'')+'<div class="qrbox'+(big?' big':'')+'">'+svg+'</div><p class="muted">Zeig diesen Code deiner Lehrkraft.'+(codes.length>1?' Nach dem Scannen auf „Nächster Code“ tippen.':' Lass die Seite offen, bis er gescannt ist.')+'</p>'
     :'<p class="muted">Der QR-Code kann auf diesem iPad nicht angezeigt werden. Bitte die Datei per AirDrop senden.</p>')
    +'<div class="acts">'+(svg&&codes.length>1?'<button class="btn" id="qnext">'+(k+1<codes.length?'Nächster Code':'Wieder Code 1')+'</button>':'')+(svg?'<button class="btn sec" id="qbig">'+(big?'Code kleiner':'Code größer anzeigen')+'</button>':'')
    +'<button class="btn '+(svg?'sec':'')+'" id="again">Abgabe als Datei sichern</button><button class="btn sec" id="edit">Meine Antworten ansehen</button></div><p class="muted" id="dmsg" style="margin-top:10px"></p>'
    +'<div class="mres"><button class="btn" id="mres"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></svg>Mein Ergebnis ansehen</button><p class="muted">Scanne den Code am Smartboard, sobald deine Lehrkraft die Ergebnisse freigibt.</p></div>';
   card.querySelector('#mres').onclick=resScan;
   card.querySelector('#qnext')?.addEventListener('click',()=>{k=(k+1)%codes.length;draw()});
   card.querySelector('#qbig')?.addEventListener('click',()=>{big=!big;draw()});
   card.querySelector('#again').onclick=async()=>{if(await send())card.querySelector('#again').textContent='Datei noch einmal sichern'};
   card.querySelector('#edit').onclick=()=>done.classList.remove('on')};
  draw();done.classList.add('on');lockPage()}
 /* 12.30: nach dem Abgeben ist der Test gesperrt – Antworten nur noch ansehen, nicht ändern */
 function lockPage(){if(window.VT_LOCK)return;window.VT_LOCK=true;const a=document.getElementById('app');a.classList.add('vtlock');
  a.querySelectorAll('input,textarea').forEach(i=>{i.readOnly=true;i.setAttribute('tabindex','-1')});a.querySelectorAll('.gen button,.gch button').forEach(b=>b.disabled=true);
  const go=document.getElementById('go');if(go){const nb=go.cloneNode(false);nb.id='reshow';nb.textContent='Abgegeben ✓ · QR-Code zeigen';go.replaceWith(nb);nb.onclick=()=>document.getElementById('done').classList.add('on')}
  const bn=document.createElement('div');bn.className='lockbar';bn.textContent='🔒 Abgegeben – deine Antworten können nicht mehr geändert werden.';a.prepend(bn)}
 ['input','beforeinput','paste'].forEach(ev=>document.addEventListener(ev,e=>{if(window.VT_LOCK&&e.target.closest?.('#app')){e.preventDefault();e.stopImmediatePropagation()}},true));
 document.addEventListener('click',e=>{if(window.VT_LOCK&&e.target.closest?.('#app .gen button,#app .gch button')){e.preventDefault();e.stopImmediatePropagation()}},true);
 /* 12.28: „Mein Ergebnis ansehen“ – den Ergebnis-Code der Lehrkraft (#r1…) direkt hier scannen, ohne Kamera-App */
 let rStream=null,rTimer=0;
 const rStop=()=>{clearTimeout(rTimer);try{rStream?.getTracks().forEach(t=>t.stop())}catch{}rStream=null;document.querySelector('.rov')?.remove()};
 const loadJsQr=()=>window.jsQR?Promise.resolve(window.jsQR):new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/jsqr.js';s.onload=()=>window.jsQR?res(window.jsQR):rej(new Error('QR-Leser fehlt.'));s.onerror=()=>rej(new Error('Der QR-Leser konnte nicht geladen werden. Bitte einmal mit Internet öffnen.'));document.head.append(s)});
 async function resScan(){rStop();const o=document.createElement('div');o.className='rov';o.innerHTML='<div class="rh">Ergebnis-Code scannen</div><div class="cam"><video playsinline muted autoplay></video><div class="fr"></div></div><div class="rm">Halte das iPad auf den QR-Code am Smartboard.</div><button type="button" class="btn sec" data-x>Abbrechen</button>';document.body.append(o);
  o.querySelector('[data-x]').onclick=rStop;const v=o.querySelector('video'),m=o.querySelector('.rm'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  try{const q=await loadJsQr();rStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=rStream;await v.play().catch(()=>{});
   const tick=()=>{if(!rStream)return;try{if(v.readyState>=2&&v.videoWidth){const sc=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);cx.drawImage(v,0,0,cv.width,cv.height);const c=q(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
     if(c&&c.data){const h=(String(c.data).match(/#r1[zj]\.[A-Za-z0-9_\-]+/)||[])[0];
      if(h){m.innerHTML='<b style="color:#1f7a45">✓ Erkannt</b> – dein Ergebnis wird geöffnet …';setTimeout(()=>{rStop();location.hash=h;location.reload()},400);return}
      m.textContent='Das ist nicht der Ergebnis-Code. Warte, bis deine Lehrkraft die Ergebnisse freigibt.';rTimer=setTimeout(()=>{m.textContent='Halte das iPad auf den QR-Code am Smartboard.';tick()},2500);return}}}catch{}rTimer=setTimeout(tick,150)};tick()}
  catch(e){m.textContent=e&&e.name==='NotAllowedError'?'Die Kamera ist nicht erlaubt. Erlaube sie in den Einstellungen.':(e&&e.message||'Die Kamera konnte nicht gestartet werden.')}}
 const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
 /* 10.57: Offline-Speicher (Test ohne Internet). QR-Code 1 „iPads vorbereiten“ öffnet #vorbereiten. */
 const swOk='serviceWorker' in navigator&&'caches' in window;
 if(swOk){try{navigator.serviceWorker.register('vt-sw.js',{scope:'./vokabeltest.html'}).catch(()=>{})}catch{}}
 const pageUrl=location.href.split('#')[0].split('?')[0];
 addEventListener('hashchange',()=>location.reload());/* neuer QR-Code im selben Tab */
 async function offlineReady(){if(!swOk)return false;try{return !!(await caches.match(pageUrl))&&!!(await caches.match(new URL('qr-code.js',pageUrl).href))}catch{return false}}
 if(/^#vorbereiten/.test(location.hash)){
  document.title='iPad vorbereiten · Vokabeltest';try{localStorage.setItem('vt-prep-at',String(Date.now()))}catch{}
  app.innerHTML='<div class="card prep"><h1>iPad vorbereiten</h1><p class="st" id="st"><span class="spin"></span> Der Vokabeltest wird auf diesem iPad gespeichert …</p>'
   +'<ol class="steps" id="steps" hidden><li><b>Internet trennen.</b> Kontrollzentrum öffnen (oben rechts nach unten wischen) und auf das WLAN-Symbol tippen, sodass es nicht mehr blau ist. Bluetooth bleibt an. Hat dein iPad Mobilfunk: auch „Mobile Daten“ aus.<div class="net" id="net"></div></li>'
   +'<li><b>QR-Code deiner Gruppe scannen</b> (A oder B), sobald deine Lehrkraft ihn zeigt. Der Test öffnet sich ohne Internet.</li>'
   +'<li><b>Nach dem Abgeben:</b> den QR-Code deiner Lehrkraft zeigen – sie scannt ihn. Das geht ohne Internet.</li></ol></div>';
  const net=()=>{const n=document.getElementById('net');if(!n)return;const on=navigator.onLine;n.className='net '+(on?'on':'off');n.textContent=on?'Internet ist noch an – bitte WLAN im Kontrollzentrum antippen.':'✓ Kein Internet – jetzt den QR-Code deiner Gruppe scannen.'};
  addEventListener('online',net);addEventListener('offline',net);
  let tries=0;const check=async()=>{const ok=await offlineReady();const st=document.getElementById('st');
   if(ok){st.className='st ok';st.textContent='✓ Offline bereit';document.getElementById('steps').hidden=false;net();return}
   if(++tries>40||!swOk){st.className='st bad';st.textContent=swOk?'Noch nicht bereit. Bitte mit Internet diesen QR-Code noch einmal scannen.':'Dieses Gerät kann den Test nicht offline speichern. Der Test geht nur mit Internet.';return}
   setTimeout(check,500)};check();return}
 /* 12.26: Ergebnis-QR der Lehrkraft (#r1.…) – dieses iPad bewertet seine eigene Abgabe mit denselben Regeln wie der Classroom-Manager */
 if(/^#r1[zj]\./.test(location.hash)){
 const normLat=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/j/g,'i');

 const GENUS_WORDS={m:'m',mask:'m',maskulin:'m',masculinum:'m',f:'f',fem:'f',feminin:'f',femininum:'f',n:'n',neutr:'n',neutrum:'n'};
 const fold=s=>s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');

  t=t.replace(/^(der|die|das|den|dem|des|ein|eine|einen|einem|einer|eines)\s+/,'');return t.trim()}

 function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
 
 /* 10.22: 1 Punkt je verlangtem Wort, je Genus und für die Bedeutung; Latein: jeder Fehler = falsch; 10.62: Deutsch 1 Buchstabe falsch = ½ */
 const lemmaMax=item=>item.kind==='x'?0:item.kind==='n'?2:item.kind==='v'?Math.max(1,(item.need||[]).length):1;
 const maxOf=item=>item&&item.k?window.classroomGrammar.pts(item):lemmaMax(item)+1;
 function gradeLemma(item,ans){
  const max=lemmaMax(item);if(!max)return {p:0,max:0};
  const toks=latTokens(ans.l);let ge=ans.ge||'';const rest=[];for(const t of toks){if(GENUS_WORDS[t]&&!(item.need||[]).map(normLat).includes(t)){if(!ge)ge=GENUS_WORDS[t];continue}if(t==='pl'||t==='plural')continue;rest.push(t)}
  const need=(item.need||[]).map(normLat);
  const want=item.kind==='v'?need:need.slice(0,1);
  /* 10.71: ohne Trennzeichen zusammengeschrieben (z. B. „audireaudio“) – trotzdem erkennen */for(let k=rest.length-1;k>=0;k--){const tk=rest[k];if(want.includes(tk))continue;for(let a=0;a<want.length;a++)for(let b=0;b<want.length;b++)if(a!==b&&tk===want[a]+want[b]){rest.splice(k,1,want[a],want[b]);a=b=want.length}}
  const found=want.filter(t=>rest.includes(t));let p=found.length;const miss=want.filter(t=>!rest.includes(t));

 const makeBody=()=>({type:'classroom-vokabeltest-abgabe',v:1,i:test.i,g:test.g,t:test.t,name:draft.name.trim(),ts:new Date().toISOString(),a:draft.a.map(a=>({l:a.l.trim(),ge:a.ge,m:a.m.trim()}))});let sentBody=null;
 async function send(){
  const body=sentBody||makeBody();
  const file=new File([JSON.stringify(body)],fileName(),{type:'application/octet-stream'});
  try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:fileName()});return true}}catch(e){if(e?.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  document.getElementById('dmsg').textContent='Die Datei „'+file.name+'“ wurde gespeichert. Schicke sie an deine Lehrkraft (z. B. per AirDrop aus der Dateien-App).';return true}
 document.getElementById('go').onclick=async()=>{
  if(!NM.need(draft))return;
  const empty=test.r.filter(([f,k],i)=>!filled(draft.a[i])).length;
  if(!confirm((empty?empty+' Vokabel'+(empty>1?'n sind':' ist')+' noch leer. ':'')+'Test jetzt abgeben?'))return;
  draft.sent=true;sentBody=makeBody();draft.body=sentBody;save();qrDone(sentBody,send)};/* Teilen braucht einen frischen Tipp – daher eigener Knopf */
 document.getElementById('again').onclick=async()=>{if(await send()){document.querySelector('#done h2').textContent='Abgegeben ✓';document.getElementById('again').textContent='Noch einmal senden'}};
 document.getElementById('edit').onclick=()=>document.getElementById('done').classList.remove('on');if(draft.sent){sentBody=draft.body||makeBody();qrDone(sentBody,send)};
})();
</script></body></html>
