<style>

.prep{padding:22px 24px;max-width:640px;margin:0 auto}.prep h1{margin-bottom:10px}.st{font-weight:650;font-size:1.05rem;display:flex;align-items:center;gap:10px}.st.ok{color:#1f7a45;font-size:1.35rem}.st.bad{color:#b42318}.spin{width:18px;height:18px;border:3px solid #cfd9e6;border-top-color:#2f5f9b;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.steps{margin:16px 0 0;padding-left:22px}.steps li{margin:0 0 14px}.net{margin-top:8px;padding:8px 12px;border-radius:10px;font-weight:650;font-size:.95rem}.net.on{background:#fff4e5;color:#8a4b0a}.net.off{background:#e7f6ec;color:#1f7a45}.netwarn{position:sticky;top:0;z-index:5;margin:0 0 12px;padding:10px 14px;border-radius:12px;background:#fff4e5;color:#8a4b0a;font-weight:650;text-align:center}.netwarn[hidden]{display:none}</style></head><body>

<script>
(async()=>{
 const app=document.getElementById('app');
 const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const fail=msg=>{app.innerHTML='<div class="card err"><h1>Vokabeltest</h1><p class="muted">'+esc(msg)+'</p></div>'};
 const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
 /* 10.57: Offline-Speicher (Test ohne Internet). QR-Code 1 „iPads vorbereiten“ öffnet #vorbereiten. */
 const swOk='serviceWorker' in navigator&&'caches' in window;
 if(swOk){try{navigator.serviceWorker.register('vt-sw.js',{scope:'./vokabeltest.html'}).catch(()=>{})}catch{}}
 const pageUrl=location.href.split('#')[0].split('?')[0];

 async function offlineReady(){if(!swOk)return false;try{return !!(await caches.match(pageUrl))}catch{return false}}
 if(/^#vorbereiten/.test(location.hash)){
  document.title='iPad vorbereiten · Vokabeltest';try{localStorage.setItem('vt-prep-at',String(Date.now()))}catch{}

   +'<ol class="steps" id="steps" hidden><li><b>Internet trennen.</b> Kontrollzentrum öffnen (oben rechts nach unten wischen) und auf das WLAN-Symbol tippen, sodass es nicht mehr blau ist. Bluetooth bleibt an. Hat dein iPad Mobilfunk: auch „Mobile Daten“ aus.<div class="net" id="net"></div></li>'
   +'<li><b>QR-Code deiner Gruppe scannen</b> (A oder B), sobald deine Lehrkraft ihn zeigt. Der Test öffnet sich ohne Internet.</li>'
   +'<li><b>Nach dem Abgeben:</b> die Datei per AirDrop an deine Lehrkraft senden – das geht ohne Internet.</li></ol></div>';
  const net=()=>{const n=document.getElementById('net');if(!n)return;const on=navigator.onLine;n.className='net '+(on?'on':'off');n.textContent=on?'Internet ist noch an – bitte WLAN im Kontrollzentrum antippen.':'✓ Kein Internet – jetzt den QR-Code deiner Gruppe scannen.'};
  addEventListener('online',net);addEventListener('offline',net);
  let tries=0;const check=async()=>{const ok=await offlineReady();const st=document.getElementById('st');
   if(ok){st.className='st ok';st.textContent='✓ Offline bereit';document.getElementById('steps').hidden=false;net();return}
   if(++tries>40||!swOk){st.className='st bad';st.textContent=swOk?'Noch nicht bereit. Bitte mit Internet diesen QR-Code noch einmal scannen.':'Dieses Gerät kann den Test nicht offline speichern. Der Test geht nur mit Internet.';return}
   setTimeout(check,500)};check();return}
 let test;
 try{const h=decodeURIComponent(location.hash.slice(1));if(!h)throw new Error('Kein Test im Link. Bitte den QR-Code noch einmal scannen.');
  let bytes;if(h.startsWith('z1.')){if(typeof DecompressionStream!=='function')throw new Error('Bitte Safari aktualisieren.');bytes=new Uint8Array(await new Response(new Blob([b64(h.slice(3))]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}

 catch(e){fail(e.message||String(e));return}
 document.title=(test.t||'Vokabeltest')+' · Gruppe '+test.g;
 if(test.k==='gr'){grammarPage();return}
 const KEY='vt-draft-'+test.i+'-'+test.g;let draft={name:'',a:test.r.map(()=>({l:'',ge:'',m:''})),sent:false};
 try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.a)&&d.a.length===test.r.length)draft=d}catch{}
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(draft))}catch{}};
 const hint='Grundform: bei Substantiven Nom. Sg. und Genus · bei Verben Infinitiv und 1. Pers. Sg. Präs. · bei Adjektiven und Pronomen Nom. Sg. m. — Längenzeichen sind nicht nötig.';
 /* 10.71: So wird bewertet – wie im Classroom-Manager */
 const rules=()=>{const lat=test.r.some(([,k])=>k&&k!=='x'),ex=(c,t)=>'<div class="vr-ex"><span class="vr-'+c+'">'+({ok:'✓',hf:'½',no:'✗'})[c]+'</span>'+t+'</div>';
  return '<div class="card vr"><b class="vr-t">So wird bewertet</b><div class="vr-two">'+(lat?'<div><div class="vr-h">Latein – genau</div>'+ex('ok','<i>amicus</i> · m')+ex('no','<i>amikus</i> → 0 P')+'<div class="vr-n">j = i · Längenzeichen (ā) nicht nötig · Formen mit Komma oder Leerzeichen trennen</div></div>':'')+'<div><div class="vr-h">Deutsch – 1 Fehler erlaubt</div>'+ex('ok','Freund')+ex('hf','Freunt → ½ P Abzug')+ex('no','Frunt → 0 P')+'<div class="vr-n">Eine richtige Bedeutung reicht · Groß-/Kleinschreibung egal</div></div></div></div>'};

 /* 10.72: Grammatiktest – Tabellen, Formen bestimmen (antippen), Formen bilden */
 function grammarPage(){

  let draft={name:'',a:test.q.map(blank),sent:false};try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.a)&&d.a.length===test.q.length)draft=d}catch{}

  const off='autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';

  const body=(it,i)=>{const a=draft.a[i];

   if(it.k==='det')return '<div class="gf">'+esc(it.f)+'</div>'+it.d.map(([l,opts],di)=>'<div class="gd"><span class="muted">'+esc(l)+'</span><span class="gch">'+opts.map(o=>'<button type="button" data-d="'+di+'" data-v="'+esc(o)+'"'+(a.d[di]===o?' class="on"':'')+'>'+esc(o)+'</button>').join('')+'</span></div>').join('');
   return '<div class="gi"><span class="gf">'+esc(it.p)+'</span>'+it.sub.map((l,si)=>'<label class="gl"><span class="muted">'+esc(l)+'</span><input class="in" data-v="'+si+'" '+off+' value="'+esc(a.v[si]||'')+'"></label>').join('')+'</div>'};
  app.innerHTML='<div class="card hd"><div><h1>'+esc(test.t||'Grammatiktest')+' · Gruppe '+esc(test.g)+'</h1><div class="muted" style="font-size:.9rem">'+esc([test.c,test.d?new Date(test.d+'T12:00').toLocaleDateString('de-DE'):''].filter(Boolean).join(' · '))+'</div></div><label class="name"><span class="muted">Name</span><input id="nm" '+off.replace('autocapitalize="off"','autocapitalize="words"')+' placeholder="Vorname Nachname" value="'+esc(draft.name)+'"></label></div>'
   +rulesG+test.q.map((it,i)=>'<div class="card gcard" data-i="'+i+'"><div class="gh"><b>'+(i+1)+'</b> '+esc(it.ti||'')+'</div>'+body(it,i)+'</div>').join('')
   +'<div class="card foot"><div style="display:flex;align-items:center;gap:12px"><div class="bar"><i id="bar"></i></div><span class="muted" id="cnt"></span></div><button class="btn" id="go">Abgeben</button></div>'
   +'<div class="done" id="done"><div class="card"><h2>Fast fertig!</h2><p class="muted" id="dmsg">Tippe auf „Per AirDrop senden“ und wähle das Gerät deiner Lehrkraft. Das geht ohne Internet.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="again">Per AirDrop senden</button><button class="btn sec" id="edit">Zurück zum Test</button></div></div></div>';
  const full=(it,a)=>it.k==='tab'?it.gv.every((row,ri)=>row.every((g,ci)=>g!==''||(a.c[ri][ci]||'').trim())):it.k==='det'?a.d.every(Boolean):a.v.every(x=>(x||'').trim());
  const any=(it,a)=>it.k==='tab'?a.c.some(r=>r.some(x=>(x||'').trim())):it.k==='det'?a.d.some(Boolean):a.v.some(x=>(x||'').trim());
  const count=()=>{const n=test.q.filter((it,i)=>full(it,draft.a[i])).length;document.getElementById('cnt').textContent=n+' von '+test.q.length+' Aufgaben fertig';document.getElementById('bar').style.width=(100*n/test.q.length)+'%'};
  app.addEventListener('input',e=>{const t=e.target;if(t.id==='nm'){draft.name=t.value;save();return}const card=t.closest('.gcard');if(!card)return;const a=draft.a[+card.dataset.i];if(t.dataset.c){const [r,c]=t.dataset.c.split(',').map(Number);a.c[r][c]=t.value}else if(t.dataset.v!=null)a.v[+t.dataset.v]=t.value;save();count()});

 const off='autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';

  '<div class="hint">'+esc(hint)+'</div>'+rules()+'<div class="card rows"><div class="row head"><span>Nr</span><span>Form</span><span>Grundform</span><span>Genus</span><span>Bedeutung(en)</span></div>'+
  test.r.map(([form,kind],i)=>{const a=draft.a[i];return '<div class="row" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="form">'+esc(form)+'</span>'+
   (kind==='x'?'<input class="in" disabled placeholder="— (unveränderlich)">':'<input class="in" data-k="l" '+off+' placeholder="'+({n:'Nom. Sg.',v:'Inf. Präs., 1. Ps. Sg. Präs.',a:'Nom. Sg. m.'}[kind]||'Grundform')+'" value="'+esc(a.l)+'">')+
   '<span class="gen">'+['m','f','n'].map(g=>'<button type="button" data-g="'+g+'"'+(kind==='n'?'':' disabled')+(a.ge===g?' class="on"':'')+' aria-label="Genus '+g+'">'+g+'</button>').join('')+'</span>'+
   '<input class="in" data-k="m" '+off+' placeholder="Bedeutung" value="'+esc(a.m)+'"></div>'}).join('')+
  '<div class="foot"><div style="display:flex;align-items:center;gap:12px"><div class="bar"><i id="bar"></i></div><span class="muted" id="cnt"></span></div><button class="btn" id="go">Abgeben</button></div></div>'+
  '<div class="done" id="done"><div class="card"><h2>Fast fertig!</h2><p class="muted" id="dmsg">Tippe auf „Per AirDrop senden“ und wähle das Gerät deiner Lehrkraft. Das geht ohne Internet.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="again">Per AirDrop senden</button><button class="btn sec" id="edit">Zurück zum Test</button></div></div></div>';
 {const bn=document.createElement('div');bn.className='netwarn';bn.hidden=true;bn.textContent='Bitte Internet trennen (WLAN im Kontrollzentrum antippen) – der Test läuft ohne Internet.';app.prepend(bn);/* nur nach „iPads vorbereiten“ (letzte 6 Stunden) – mit Jamf bleiben die iPads online */const prepared=()=>{try{return Date.now()-Number(localStorage.getItem('vt-prep-at')||0)<6*3600e3}catch{return false}};const upd=async()=>{bn.hidden=!(navigator.onLine&&prepared()&&await offlineReady())};addEventListener('online',upd);addEventListener('offline',upd);upd()}
 const filled=a=>(a.l.trim()||a.m.trim())?1:0;
 const count=()=>{const n=test.r.filter(([f,k],i)=>{const a=draft.a[i];return k==='x'?a.m.trim():(a.l.trim()&&a.m.trim()&&(k!=='n'||a.ge))}).length;document.getElementById('cnt').textContent=n+' von '+test.r.length+' ausgefüllt';document.getElementById('bar').style.width=(100*n/test.r.length)+'%'};
 app.addEventListener('input',e=>{const t=e.target;if(t.id==='nm'){draft.name=t.value;save();return}const row=t.closest('.row');if(!row||!t.dataset.k)return;draft.a[+row.dataset.i][t.dataset.k]=t.value;save();count()});
 app.addEventListener('click',e=>{const b=e.target.closest('.gen button');if(!b||b.disabled)return;const row=b.closest('.row'),a=draft.a[+row.dataset.i];a.ge=a.ge===b.dataset.g?'':b.dataset.g;row.querySelectorAll('.gen button').forEach(x=>x.classList.toggle('on',x.dataset.g===a.ge));save();count()});
 count();
 /* Dateiname nur aus einfachen Zeichen – AirDrop, Dateien-App und Browser kommen damit überall zurecht */
 const ascii=x=>String(x||'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
 const fileName=()=>'Vokabeltest_'+ascii((test.t||'').replace(/^Vokabeltest\s*/i,''))+'_'+test.g+'_'+(ascii(draft.name)||'ohne_Name')+'.json';
 async function send(){
  const body={type:'classroom-vokabeltest-abgabe',v:1,i:test.i,g:test.g,t:test.t,name:draft.name.trim(),ts:new Date().toISOString(),a:draft.a.map(a=>({l:a.l.trim(),ge:a.ge,m:a.m.trim()}))};
  const file=new File([JSON.stringify(body)],fileName(),{type:'application/json'});
  try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:fileName()});return true}}catch(e){if(e?.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  document.getElementById('dmsg').textContent='Die Datei „'+file.name+'“ wurde gespeichert. Schicke sie an deine Lehrkraft (z. B. per AirDrop aus der Dateien-App).';return true}
 document.getElementById('go').onclick=async()=>{
  if(!draft.name.trim()){alert('Bitte zuerst deinen Namen eintragen.');document.getElementById('nm').focus();return}
  const empty=test.r.filter(([f,k],i)=>!filled(draft.a[i])).length;
  if(!confirm((empty?empty+' Vokabel'+(empty>1?'n sind':' ist')+' noch leer. ':'')+'Test jetzt abgeben?'))return;
  draft.sent=true;save();document.getElementById('done').classList.add('on')};/* Teilen braucht einen frischen Tipp – daher eigener Knopf */
 document.getElementById('again').onclick=async()=>{if(await send()){document.querySelector('#done h2').textContent='Abgegeben ✓';document.getElementById('again').textContent='Noch einmal senden'}};
 document.getElementById('edit').onclick=()=>document.getElementById('done').classList.remove('on');
