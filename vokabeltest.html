<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><meta name="robots" content="noindex">
<title>Vokabeltest</title>
<!-- 10.21: Schülerseite für den iPad-Vokabeltest des Classroom-Managers. Der Test steht im Link (#…), die Lösungen NICHT.
     „Abgeben“ erzeugt eine kleine Datei, die per AirDrop an die Lehrkraft geht. Es wird nichts an einen Server geschickt. -->
<style>
*{box-sizing:border-box}html,body{margin:0}body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#243247;background:#f6f8fc;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));-webkit-text-size-adjust:100%}
.card{background:#fff;border:1px solid #dce3ef;border-radius:18px;box-shadow:0 1px 3px #233d600d}
h1{font-size:1.45rem;margin:0;letter-spacing:-.02em}.muted{color:#66758a}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 20px}
.name{display:flex;align-items:center;gap:10px}.name input{height:46px;width:min(320px,70vw);border:1px solid #d6dde8;border-radius:10px;padding:0 12px;font:inherit}
.hint{font-size:.88rem;color:#66758a;margin:12px 4px}
.rows{overflow:hidden}.row{display:grid;grid-template-columns:34px minmax(140px,190px) minmax(150px,1fr) 136px minmax(170px,1.25fr);gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid #eef2f7}
.row.head{background:#f6f8fc;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#66758a;font-weight:700;padding-top:11px;padding-bottom:11px}
.n{color:#8a97a9;font-weight:700}.form{font-size:1.25rem;font-weight:700;color:#2f5f9b;overflow-wrap:anywhere}
input.in{width:100%;height:46px;border:1px solid #d6dde8;border-radius:10px;padding:0 12px;font:inherit;background:#fff;color:#243247}
input.in:focus{outline:none;border-color:#8fb0dc;box-shadow:0 0 0 3px #8fb0dc44}input.in:disabled{background:#f6f8fc;color:#aab4c3}
.gen{display:flex;gap:4px}.gen button{width:42px;height:46px;border:1px solid #d6dde8;border-radius:10px;background:#fff;font:inherit;font-weight:700;color:#66758a;cursor:pointer;touch-action:manipulation}
.gen button.on{background:#2f5f9b;border-color:#2f5f9b;color:#fff}.gen button:disabled{opacity:.35;cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.bar{width:220px;height:8px;border-radius:9px;background:#e7edf6;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#2f5f9b;transition:width .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 24px;border:1px solid #2f5f9b;border-radius:10px;background:#2f5f9b;color:#fff;font:inherit;font-weight:650;cursor:pointer}
.btn.sec{background:#fff;color:#2f5f9b;border-color:#d5deea}
.done{position:fixed;inset:0;background:#f6f8fcf2;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.done.on{display:flex}.done .card{max-width:520px;padding:28px;text-align:center}.done h2{margin:0 0 8px}
.err{padding:30px;max-width:640px;margin:40px auto;text-align:center}
@media (max-width:760px){.row{grid-template-columns:28px 1fr;gap:8px}.row.head{display:none}.row>.n{grid-row:span 4}.gen{justify-content:flex-start}}
</style></head><body>
<div id="app"></div>
<script>
(async()=>{
 const app=document.getElementById('app');
 const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const fail=msg=>{app.innerHTML='<div class="card err"><h1>Vokabeltest</h1><p class="muted">'+esc(msg)+'</p></div>'};
 const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
 let test;
 try{const h=decodeURIComponent(location.hash.slice(1));if(!h)throw new Error('Kein Test im Link. Bitte den QR-Code noch einmal scannen.');
  let bytes;if(h.startsWith('z1.')){if(typeof DecompressionStream!=='function')throw new Error('Bitte Safari aktualisieren.');bytes=new Uint8Array(await new Response(new Blob([b64(h.slice(3))]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
  else if(h.startsWith('j1.'))bytes=b64(h.slice(3));else throw new Error('Der Link ist unvollständig. Bitte den QR-Code noch einmal scannen.');
  test=JSON.parse(new TextDecoder().decode(bytes));if(!Array.isArray(test.r))throw new Error('Der Link ist beschädigt.')}
 catch(e){fail(e.message||String(e));return}
 document.title=(test.t||'Vokabeltest')+' · Gruppe '+test.g;
 const KEY='vt-draft-'+test.i+'-'+test.g;let draft={name:'',a:test.r.map(()=>({l:'',ge:'',m:''})),sent:false};
 try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.a)&&d.a.length===test.r.length)draft=d}catch{}
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(draft))}catch{}};
 const hint='Grundform: bei Substantiven Nom. Sg. und Genus · bei Verben Infinitiv und 1. Pers. Sg. Präs. · bei Adjektiven und Pronomen Nom. Sg. m. — Längenzeichen sind nicht nötig.';
 const off='autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
 app.innerHTML='<div class="card hd"><div><h1>'+esc(test.t||'Vokabeltest')+' · Gruppe '+esc(test.g)+'</h1><div class="muted" style="font-size:.9rem">'+esc([test.c,test.d?new Date(test.d+'T12:00').toLocaleDateString('de-DE'):''].filter(Boolean).join(' · '))+'</div></div><label class="name"><span class="muted">Name</span><input id="nm" '+off.replace('autocapitalize="off"','autocapitalize="words"')+' placeholder="Vorname Nachname" value="'+esc(draft.name)+'"></label></div>'+
  '<div class="hint">'+esc(hint)+'</div><div class="card rows"><div class="row head"><span>Nr</span><span>Form</span><span>Grundform</span><span>Genus</span><span>Bedeutung(en)</span></div>'+
  test.r.map(([form,kind],i)=>{const a=draft.a[i];return '<div class="row" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="form">'+esc(form)+'</span>'+
   (kind==='x'?'<input class="in" disabled placeholder="— (unveränderlich)">':'<input class="in" data-k="l" '+off+' placeholder="Grundform" value="'+esc(a.l)+'">')+
   '<span class="gen">'+['m','f','n'].map(g=>'<button type="button" data-g="'+g+'"'+(kind==='n'?'':' disabled')+(a.ge===g?' class="on"':'')+' aria-label="Genus '+g+'">'+g+'</button>').join('')+'</span>'+
   '<input class="in" data-k="m" '+off+' placeholder="Bedeutung" value="'+esc(a.m)+'"></div>'}).join('')+
  '<div class="foot"><div style="display:flex;align-items:center;gap:12px"><div class="bar"><i id="bar"></i></div><span class="muted" id="cnt"></span></div><button class="btn" id="go">Abgeben</button></div></div>'+
  '<div class="done" id="done"><div class="card"><h2>Fast fertig!</h2><p class="muted" id="dmsg">Tippe auf „Per AirDrop senden“ und wähle das Gerät deiner Lehrkraft.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="again">Per AirDrop senden</button><button class="btn sec" id="edit">Zurück zum Test</button></div></div></div>';
 const filled=a=>(a.l.trim()||a.m.trim())?1:0;
 const count=()=>{const n=test.r.filter(([f,k],i)=>{const a=draft.a[i];return k==='x'?a.m.trim():(a.l.trim()&&a.m.trim()&&(k!=='n'||a.ge))}).length;document.getElementById('cnt').textContent=n+' von '+test.r.length+' ausgefüllt';document.getElementById('bar').style.width=(100*n/test.r.length)+'%'};
 app.addEventListener('input',e=>{const t=e.target;if(t.id==='nm'){draft.name=t.value;save();return}const row=t.closest('.row');if(!row||!t.dataset.k)return;draft.a[+row.dataset.i][t.dataset.k]=t.value;save();count()});
 app.addEventListener('click',e=>{const b=e.target.closest('.gen button');if(!b||b.disabled)return;const row=b.closest('.row'),a=draft.a[+row.dataset.i];a.ge=a.ge===b.dataset.g?'':b.dataset.g;row.querySelectorAll('.gen button').forEach(x=>x.classList.toggle('on',x.dataset.g===a.ge));save();count()});
 count();
 /* Dateiname nur aus einfachen Zeichen – AirDrop, Dateien-App und Browser kommen damit überall zurecht */
 const ascii=x=>String(x||'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
 const fileName=()=>'Vokabeltest_'+ascii((test.t||'').replace(/^Vokabeltest\s*/i,''))+'_'+test.g+'_'+(ascii(draft.name)||'ohne_Name')+'.json';
 async function send(){
  const body={type:'classroom-vokabeltest-abgabe',v:1,i:test.i,g:test.g,t:test.t,name:draft.name.trim(),ts:new Date().toISOString(),a:draft.a.map(a=>({l:a.l.trim(),ge:a.ge,m:a.m.trim()}))};
  const file=new File([JSON.stringify(body)],fileName(),{type:'application/json'});
  try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:fileName()});return true}}catch(e){if(e?.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  document.getElementById('dmsg').textContent='Die Datei „'+file.name+'“ wurde gespeichert. Schicke sie an deine Lehrkraft (z. B. per AirDrop aus der Dateien-App).';return true}
 document.getElementById('go').onclick=async()=>{
  if(!draft.name.trim()){alert('Bitte zuerst deinen Namen eintragen.');document.getElementById('nm').focus();return}
  const empty=test.r.filter(([f,k],i)=>!filled(draft.a[i])).length;
  if(!confirm((empty?empty+' Vokabel'+(empty>1?'n sind':' ist')+' noch leer. ':'')+'Test jetzt abgeben?'))return;
  draft.sent=true;save();document.getElementById('done').classList.add('on')};/* Teilen braucht einen frischen Tipp – daher eigener Knopf */
 document.getElementById('again').onclick=async()=>{if(await send()){document.querySelector('#done h2').textContent='Abgegeben ✓';document.getElementById('again').textContent='Noch einmal senden'}};
 document.getElementById('edit').onclick=()=>document.getElementById('done').classList.remove('on');
})();
</script></body></html>
