<!doctype html>

<!-- 11.12: Lerneinheit des Classroom-Managers (Erdkunde). Alle Karten sind eigene, vereinfachte Zeichnungen; alle Texte eigene Formulierungen.

<style>
:root{--blue:#2f5f9b;--ink:#243247;--mut:#66758a;--line:#dce3ef;--bg:#f6f8fc;--ok:#1f8a4c;--okbg:#e5f5ea;--bad:#c2410c;--badbg:#fdeee6;--m:#2f5f9b;--f:#7c3aed;--i:#b45309;--h:#1f8a4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif}
body{padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1080px;margin:0 auto}button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:1.55rem;margin:4px 0 0}h2{font-size:1.2rem;margin:0 0 6px}.muted{color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.top .sp{flex:1}
.back{min-height:44px;padding:0 14px;border:1px solid #b9c6da;border-radius:10px;background:#fff;color:var(--blue)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:6px}
.step{display:flex;gap:12px;align-items:center;min-height:78px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left}
.step:hover{background:#f4f8fe}.step .n{flex:none;width:40px;height:40px;border-radius:12px;background:#eaf0fa;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}.step b{display:block}.step small{color:var(--mut)}.step .st{margin-left:auto;flex:none;font-size:.85rem;color:var(--mut)}.step .st.done{color:var(--ok);font-weight:700}
.map{width:100%;height:auto;display:block;border-radius:14px;background:#f3ecd8;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.map text{font:600 11px -apple-system,Inter,sans-serif;fill:#3d4a5c;pointer-events:none}.map .big{font-size:13px;font-weight:800}
.era{opacity:0;transition:opacity .45s}.era.on{opacity:1}
.hot{cursor:pointer}.hot circle.hc{fill:#fff;stroke:var(--blue);stroke-width:2.5}.hot text.ht{fill:var(--blue);font-size:12px;font-weight:800;text-anchor:middle}
.hot.seen circle.hc{fill:var(--blue)}.hot.seen text.ht{fill:#fff}
.slider{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.slider button{min-height:54px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;color:var(--mut)}.slider button small{display:block;font-weight:500;font-size:.75rem}.slider button.on{background:var(--blue);border-color:var(--blue);color:#fff}
input[type=range]{width:100%;margin:14px 0 2px;accent-color:var(--blue);height:30px}
.info{min-height:120px;padding:14px 16px;border-radius:14px;background:#eef3fa;border:1px solid #d3e0f2}.info b{color:var(--blue)}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.col{min-height:210px;padding:10px;border:2px dashed #cfd8e6;border-radius:14px;background:#fbfcfe;display:flex;flex-direction:column;gap:6px}.col.tgt{border-color:var(--blue);background:#f1f6fd}.col h3{margin:0 0 4px;font-size:.85rem;color:var(--c);text-transform:uppercase;letter-spacing:.4px}
.pool{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:46px;padding:6px 14px;border:1px solid #cfd8e6;border-radius:12px;background:#fff;font-weight:600;font-size:.95rem;text-align:left}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}.chip.ok{background:var(--okbg);border-color:#7cc69a;color:var(--ok)}.chip.no{background:var(--badbg);border-color:#f0a982;color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.row .sp{flex:1}
.pri{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:650}.pri:disabled{opacity:.4}
.sec{min-height:48px;padding:0 16px;border:1px solid #b9c6da;border-radius:12px;background:#fff;color:var(--blue)}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:600}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}.fb.info{background:#eef3fa;color:#2f4f7a}
.opt{display:block;width:100%;min-height:52px;margin:0 0 8px;padding:10px 14px;border:1px solid #cfd8e6;border-radius:12px;background:#fff;text-align:left;font-size:1rem}.opt.ok{background:var(--okbg);border-color:#7cc69a;color:var(--ok);font-weight:700}.opt.no{background:var(--badbg);border-color:#f0a982;color:var(--bad)}
.ev{display:flex;align-items:center;gap:10px;min-height:54px;margin:0 0 8px;padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}.ev .tx{flex:1}.ev .yr{flex:none;font-weight:800;color:var(--ok);min-width:70px;text-align:right}.ev button{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--blue)}.ev.ok{background:var(--okbg);border-color:#7cc69a}.ev.no{background:var(--badbg);border-color:#f0a982}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--mut);font-size:.9rem}.bar{flex:1;height:8px;border-radius:4px;background:#e6ebf3;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.find{position:relative}.find .ping{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--bad);pointer-events:none}.find .ping.ok{border-color:var(--ok);background:#1f8a4c33}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#fff4e0;color:#8a5a00;font-weight:700}
textarea{width:100%;min-height:90px;padding:12px;border:1px solid #cfd8e6;border-radius:12px;font:inherit}
#printBox{display:none}
.slot{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #fff;background:var(--blue);color:#fff;font-weight:800;padding:0;box-shadow:0 1px 4px #0005}.slot.full{background:#7c8ea8}.slot.ok{background:var(--ok)}.slot.no{background:var(--bad)}
select.gap{min-height:40px;padding:0 8px;margin:0 2px;border:1px solid #b9c6da;border-radius:10px;background:#fff;font:inherit;color:var(--blue);font-weight:650}select.gap.ok{border-color:#7cc69a;background:var(--okbg);color:var(--ok)}select.gap.no{border-color:#f0a982;background:var(--badbg);color:var(--bad)}

#who{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:50;display:flex;align-items:center;gap:8px;min-height:52px;padding:5px 6px 5px 12px;border:1px solid #b9c6da;border-radius:14px;background:#fff;box-shadow:0 2px 10px #1c2b461a;text-align:left}#who[hidden]{display:none}#who b{display:block;font-size:.95rem;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#who small{display:block;font-size:.72rem;color:var(--ok);font-weight:700}#who svg{width:42px;height:42px;display:block}#who.noname small{color:var(--blue)}
body.has-who .wrap{padding-top:58px}
.qrfull{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}.qrfull .nm{font-size:2.2rem;font-weight:800;line-height:1.1}.qrfull svg{width:min(78vw,62vh,520px);height:auto;display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}.names button{min-height:50px;border:1px solid #cfd8e6;border-radius:12px;background:#fff;font-weight:650;font-size:1rem}.names button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
@media print{#who,.qrfull{display:none!important}}

.step.start{border:2px solid var(--blue);background:#f1f6fd}.step.start .n{background:var(--blue);color:#fff}.go{display:block;width:max-content;margin:2px 0 3px;padding:1px 8px;border-radius:999px;background:var(--blue);color:#fff;font-size:.72rem;font-weight:700;vertical-align:middle}
.ph{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}.ph ul{margin:6px 0 10px;padding-left:20px}.ph li{margin-bottom:6px}
.why{padding:10px 14px;border-radius:12px;background:#fff8e6;border:1px solid #f0dca8;margin:8px 0}.why b{color:#8a5a00}
.term{min-height:40px;padding:4px 12px;margin:0 6px 6px 0;border:1px solid #b9c6da;border-radius:999px;background:#fff;color:var(--blue);font-weight:650;font-size:.92rem}.term.on{background:var(--blue);color:#fff}
.def{padding:10px 14px;border-radius:12px;background:#eef3fa;margin:4px 0 8px;font-size:.95rem}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:#d3dbe8}.dots i.on{background:var(--blue)}.dots i.ok{background:var(--ok)}
.yrs{display:inline-block;padding:2px 10px;border-radius:999px;background:#eaf0fa;color:var(--blue);font-weight:700;font-size:.85rem}
.verm{padding:10px 14px;border-radius:12px;background:#f4f6fa;border-left:4px solid var(--blue);margin:6px 0 10px}
@media (max-width:820px){.ph{grid-template-columns:1fr}}

.bk{margin-top:18px}.bk h2{display:flex;align-items:center;gap:8px}.bksrc{font-size:.8rem;color:var(--mut);margin-top:6px}
.bkload{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;padding:12px 14px;border:1px dashed #b9c6da;border-radius:14px;color:var(--mut);font-size:.92rem}
.lnk{border:0;background:none;color:var(--blue);text-decoration:underline;min-height:44px;padding:0 6px}
.bm{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;touch-action:pan-x pan-y pinch-zoom}.bm.zoom{overflow:auto;max-height:78vh}
.bmin{display:grid;width:100%}.bm.zoom .bmin{width:220%}
.bml{grid-area:1/1;position:relative;opacity:0;transition:opacity .5s;pointer-events:none}.bml.on{opacity:1;pointer-events:auto}.bml img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bh{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:.92;border-radius:50%;border:3px solid #fff;background:var(--blue);color:#fff;font-weight:800;font-size:15px;line-height:1;box-shadow:0 1px 4px #0005;padding:0}.bh.seen{background:var(--ok)}
.bmbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.leg{margin-top:10px;max-width:100%;border-radius:10px;border:1px solid var(--line)}
.photo{width:100%;border-radius:12px;display:block}.cap{font-size:.85rem;color:var(--mut);margin-top:4px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.thumb{position:relative;padding:6px;border:2px solid var(--line);border-radius:14px;background:#fff;text-align:center;font-size:.85rem;font-weight:700}.thumb img{width:100%;display:block;border-radius:8px}.thumb.tgt{border-color:var(--blue)}.thumb.ok{border-color:#7cc69a;background:var(--okbg)}.thumb.no{border-color:#f0a982;background:var(--badbg)}
.thumb .let{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.m4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.m4 .chip{text-align:center;font-size:1.1rem}.m4txt{margin-top:10px;padding:12px 14px;border-radius:12px;background:#f6f1e6;font-size:.95rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:650;color:var(--mut)}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.tabs button.done::after{content:' ✓'}
.snip{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto;overflow:hidden;border-radius:16px;border:1px solid var(--line)}.snip img{position:absolute;width:250%;max-width:none}
.eras4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:820px){.thumbs,.m4,.eras4{grid-template-columns:repeat(2,1fr)}}
#printBox .bkimgs{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:520px}#printBox .bkimgs img{width:100%}

@media (max-width:820px){.hero,.two{grid-template-columns:1fr}.cols{grid-template-columns:repeat(2,1fr)}}
@media print{@page{margin:14mm}body{background:#fff;padding:0}.wrap{display:none}#printBox{display:block;font:11pt/1.45 -apple-system,Inter,sans-serif;color:#000}#printBox h1{font-size:18pt;margin:0 0 4px}#printBox h2{font-size:12.5pt;color:#2f5f9b;border-bottom:1px solid #c9d3e3;margin:14px 0 6px}#printBox .map{max-width:520px}#printBox table{border-collapse:collapse;width:100%}#printBox td,#printBox th{border:1px solid #c9d3e3;padding:4px 6px;font-size:10pt;vertical-align:top}.urk{border:2px solid #2f5f9b;border-radius:10px;padding:10px 14px;margin-top:12px}}

<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const beep=()=>{};/* keine Töne: im Klassenraum mit 30 iPads störend */
const KEY='cm-stadt-bs-v1';let ST={};try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch{}try{updWho()}catch{}};
const ERAS=[['1400','Mittelalter','m'],['1775','Frühe Neuzeit','f'],['1875','Industrialisierung','i'],['heute','Nach 1945 · heute','h']];
/* ---------- Eigene schematische Karte (vereinfacht, nicht maßstäblich) ---------- */
const STAR=(()=>{const pts=[];for(let i=0;i<24;i++){const a=i/24*Math.PI*2-Math.PI/2,r=i%2?150:182;pts.push([300+Math.cos(a)*r*0.92,220+Math.sin(a)*r*1.08])}return pts.map(p=>p.map(Math.round).join(',')).join(' ')})();
function mapSvg(o={}){const L=o.labels!==false;const t=(x,y,s,c)=>L?'<text x="'+x+'" y="'+y+'" class="'+(c||'')+'">'+s+'</text>':'';
 const houses=(x0,y0,w,h,step,col)=>{let r='';for(let x=x0;x<x0+w;x+=step)for(let y=y0;y<y0+h;y+=step)r+='<rect x="'+x+'" y="'+y+'" width="'+(step-4)+'" height="'+(step-4)+'" rx="1.5" fill="'+col+'"/>';return r};
 return '<svg class="map" viewBox="0 0 600 440" role="img" aria-label="Vereinfachte Karte einer Stadt am Fluss">'
 +'<rect width="600" height="440" fill="#f3ecd8"/>'
 /* heute: Umland mit Siedlungen, Autobahn, Fachmarkt */
 +'<g class="era" data-from="3">'+houses(20,20,110,90,14,'#e8c3bb')+houses(470,330,110,90,14,'#e8c3bb')+houses(20,330,90,60,14,'#e8c3bb')+'<rect x="30" y="395" width="70" height="34" rx="4" fill="#b99a6a"/>'+t(36,416,'Fachmarkt')+'<path d="M8 0 L8 440" stroke="#9aa6b6" stroke-width="9"/><path d="M8 0 L8 440" stroke="#fff" stroke-width="1.5" stroke-dasharray="8 8"/>'+'<text x="22" y="312" transform="rotate(-90 22 312)">Autobahn</text>'+'</g>'
 /* 1875: Gründerzeit-Viertel (Raster), Industrie im Osten, Villen im Westen, Bahn */
 +'<g class="era" data-from="2">'+houses(470,40,110,140,16,'#e9a79c')+t(478,34,'Mietskasernen')+'<rect x="470" y="200" width="115" height="110" fill="#c9b6e4"/>'+houses(478,208,100,96,24,'#a58bd0')+t(480,326,'Industrie')
 +houses(40,140,90,120,22,'#f0c9c1')+'<g fill="#bfdcae">'+[0,1,2,3,4].map(i=>'<circle cx="'+(52+i*18)+'" cy="'+(270)+'" r="6"/>').join('')+'</g>'+t(40,132,'Villenviertel')
 +'<path d="M600 300 L440 380 L330 440" stroke="#5b6573" stroke-width="5" fill="none"/><path d="M600 300 L440 380 L330 440" stroke="#fff" stroke-width="2" stroke-dasharray="6 6" fill="none"/><rect x="420" y="368" width="44" height="18" rx="3" fill="#5b6573"/>'+t(470,398,'Bahnhof')+'</g>'
 /* Fluss mit zwei Armen um die Altstadt */
 +'<path d="M300 0 L300 34 C190 62 140 160 160 250 C178 334 236 392 300 412 L300 440" stroke="#8ec5e8" stroke-width="12" fill="none"/><path d="M300 34 C414 70 462 160 442 250 C426 334 362 392 300 412" stroke="#8ec5e8" stroke-width="12" fill="none"/>'+t(306,18,'Fluss')
 /* 1775: Festung mit Bastionen und Graben – verschwindet ab 1875 */
 +'<g class="era" data-from="1" data-until="1"><polygon points="'+STAR+'" fill="#cfe7f5" stroke="#8ec5e8" stroke-width="14"/><polygon points="'+STAR+'" fill="none" stroke="#6b5b3e" stroke-width="5"/>'+t(470,120,'Festungsanlage')+'</g>'
 /* ab 1875: Promenade/Grünring auf der alten Festung, heute mit Ringstraße */
 +'<g class="era" data-from="2"><ellipse cx="300" cy="220" rx="150" ry="182" fill="none" stroke="#a9d39a" stroke-width="18"/>'+t(410,64,'Grünring')+'</g>'
 +'<g class="era" data-from="3"><ellipse cx="300" cy="220" rx="150" ry="182" fill="none" stroke="#9aa6b6" stroke-width="6"/>'+t(410,78,'Ringstraße')+'</g>'
 /* Altstadt: Wohnbebauung */
 +'<ellipse cx="300" cy="220" rx="118" ry="150" fill="#f2b8b0"/>'+houses(205,95,190,250,12,'#eaa59b')
 /* Mittelalter: Stadtmauer mit Toren – verschwindet ab 1875 */
 +'<g class="era" data-from="0" data-until="1"><ellipse cx="300" cy="220" rx="118" ry="150" fill="none" stroke="#3d3a36" stroke-width="4"/>'+[[300,70],[402,150],[402,290],[300,370],[198,220]].map(([x,y])=>'<rect x="'+(x-7)+'" y="'+(y-7)+'" width="14" height="14" fill="#3d3a36"/>').join('')+t(180,70,'Stadtmauer mit Toren')+'</g>'
 /* Straßen vom Markt zu den Toren */
 +'<g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"><path d="M268 205 L300 70"/><path d="M268 205 L402 150"/><path d="M268 205 L402 290"/><path d="M268 205 L300 370"/><path d="M268 205 L198 220"/></g>'
 /* Kern: Markt mit Rathaus und Kirche, Burg, Dom */
 +'<rect x="252" y="192" width="32" height="26" rx="3" fill="#fff8e6" stroke="#c49a3a" stroke-width="2"/><rect x="258" y="198" width="10" height="10" fill="#d1453b"/><path d="M276 196 l4 -7 l4 7 z" fill="#7a5aa6"/>'+t(232,186,'Markt','big')
 +'<rect x="320" y="200" width="26" height="22" fill="#d1453b"/>'+t(318,194,'Burg','big')+'<path d="M330 232 h22 v18 h-22 z M341 222 l6 10 h-12 z" fill="#7a5aa6"/>'+t(320,266,'Dom')
 /* Frühe Neuzeit: Residenzschloss mit Park */
 +'<g class="era" data-from="1" data-until="2"><rect x="360" y="262" width="36" height="20" fill="#d1453b"/><rect x="352" y="286" width="50" height="26" rx="6" fill="#a9d39a"/>'+t(352,326,'Residenzschloss')+'</g>'
 +'<g class="era" data-from="3"><rect x="360" y="262" width="36" height="20" fill="#b99a6a"/>'+t(340,300,'Einkaufszentrum')+'</g>'
 /* heute: Fußgängerzone und Parkhäuser */
 +'<g class="era" data-from="3"><path d="M268 205 L300 120 M268 205 L360 175 M268 205 L300 300" stroke="#4aa3df" stroke-width="5" stroke-dasharray="2 6" stroke-linecap="round" fill="none"/>'+[[238,128],[384,206],[236,310]].map(([x,y])=>'<rect x="'+(x-9)+'" y="'+(y-9)+'" width="18" height="18" rx="4" fill="#2f5f9b"/><text x="'+x+'" y="'+(y+4)+'" style="fill:#fff;font-size:12px;font-weight:800;text-anchor:middle">P</text>').join('')+t(188,140,'Parkhaus')+t(222,124,'')+'</g>'

let whoT=0;function updWho(){clearTimeout(whoT);whoT=setTimeout(()=>{const w=$('#who');if(!w)return;document.body.classList.add('has-who');w.hidden=false;
 if(!ST.me){w.className='noname';w.innerHTML='<span><b>Abgabe-QR</b><small>Name wählen</small></span>';return}
 w.className='';w.innerHTML='<span><b>'+esc(ST.me)+'</b><small>'+doneCount()+' von '+(STEPS.length+(BOOK?5:0))+' ✓</small></span><svg viewBox="0 0 24 24" fill="#243247" aria-hidden="true"><path d="M3 3h8v8H3zM5 5v4h4V5zM13 3h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zM13 13h3v3h-3zM18 13h3v3h-3zM13 18h3v3h-3zM18 18h3v3h-3zM16 16h2v2h-2z"/></svg>'},30)}
function showQr(){if(!ST.me){runWho();return}const o=document.createElement('div');o.className='qrfull';
 o.innerHTML='<div class="muted">Abgabe · Städte im Wandel'+(ST.cls?' · '+esc(ST.cls):'')+'</div><div class="nm">'+esc(ST.me)+'</div>'+qrSvg(payload(),{border:3})+'<div class="muted" style="font-size:.9rem">Stand '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' · '+doneCount()+' von '+(STEPS.length+(BOOK?5:0))+' Stationen</div><div class="row" style="justify-content:center;margin-top:4px"><button class="pri" data-c>Schließen</button></div><button class="lnk" data-ch style="font-size:.85rem">Nicht dein Name? Ändern</button>';
 document.body.append(o);o.querySelector('[data-c]').onclick=()=>o.remove();o.querySelector('[data-ch]').onclick=()=>{if(confirm('Deinen Namen wirklich ändern? Deine Lehrkraft sieht den neuen Namen.')){o.remove();runWho(true)}}}
function runWho(force){const R=ST.roster||[];let pick=ST.me&&!force?ST.me:null;
 const draw=()=>{frame('Dein Name',R.length?'<div class="card"><h2>Städte im Wandel'+(ST.cls?' · '+esc(ST.cls):'')+'</h2><p style="margin:4px 0 0">Tippe auf deinen Namen. Er steht später groß über deinem Abgabe-QR.</p><div class="names">'+R.map(n=>'<button class="'+(n===pick?'on':'')+'" data-n="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div><div class="row"><div class="sp"></div><button class="pri" data-ok '+(pick?'':'disabled')+'>'+(pick?'Das bin ich: '+esc(pick):'Namen antippen')+'</button></div></div>'
  :'<div class="card"><h2>Dein Name</h2><p style="margin:4px 0 10px">Scanne den Start-QR deiner Lehrkraft – dann kannst du deinen Namen aus der Liste wählen. Oder trage ihn hier ein (Vor- und Nachname):</p><input id="nmIn" value="'+esc(pick||'')+'" placeholder="Vorname Nachname" style="width:100%;min-height:50px;padding:0 12px;border:1px solid #cfd8e6;border-radius:12px;font:inherit"><div class="row"><div class="sp"></div><button class="pri" data-ok>Speichern</button></div></div>');
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{pick=b.dataset.n;draw()});
  const inp=$('#nmIn');if(inp)inp.oninput=()=>{pick=inp.value.trim()};
  app.querySelector('[data-ok]').onclick=()=>{if(!pick||pick.length<2)return;ST.me=pick;if(!ST.name)ST.name=pick;save();home()}};draw()}
$('#who').onclick=showQr;
if(ST.roster&&!ST.me)runWho();else home();updWho();bookInit();
</script></body></html>
