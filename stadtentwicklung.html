.chip.sol{background:#fff8e1;border:2px solid #e8a23a;color:#7a4b00}.chip.retry{border-color:#e8a23a}.gapb.sol{background:#fff8e1;border:2px solid #e8a23a;color:#7a4b00}.seqc.sol{background:#fff8e1;border-color:#e8a23a}.pb.sol{background:#fff8e1;border-color:#e8a23a;color:#7a4b00}
.txt2{grid-template-columns:1.25fr 1fr}.txtc .tx{font-size:1.04rem;line-height:1.75;margin-top:6px}.txtc .tq{font-weight:750;margin:12px 0 2px}.txtc .tp{margin:0}
.sn{cursor:pointer;border-radius:5px;padding:1px 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}.sn.mc{background:#c8edd3}.sn.mr{background:#fbd3c0}.sn.dim{background:none}.sn.mc.dim{box-shadow:inset 0 -3px 0 #8fd1a8}.sn.mr.dim{box-shadow:inset 0 -3px 0 #f0b597}
.sn.sol{outline:2.5px solid #e8a23a}.sn.wrong{text-decoration:line-through;text-decoration-color:#c2410c}.sn.lock{box-shadow:inset 0 -3px 0 #1f8a4c}.sn.bsel{outline:3px solid var(--bad);background:#fdeee6}.sn.bok{outline:3px solid var(--ok);background:#e5f5ea}.sn.bsol{outline:3px solid #e8a23a;background:#fff8e1}
.pens{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}.pen{min-height:46px;padding:0 18px;border-radius:999px;border:2px solid;font-weight:750;background:#fff}.pen.c{color:#17603a;border-color:#7cc69a;background:#dff3e5}.pen.r{color:#a33a0c;border-color:#f0a982;background:#fde5da}.pen.e{color:#66758a;border-color:#cfd8e6}.pen.on{box-shadow:0 0 0 3px #2f5f9b66}
.swb button.ok{background:var(--okbg);color:var(--ok);border-color:#7cc69a}.swb button.no{background:var(--badbg);color:var(--bad);border-color:#f0a982}.swb button:not(.l):not(.r){color:var(--blue);border-color:#b9c6da}
@media (max-width:820px){.txt2{grid-template-columns:1fr}}
.leg2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:#4d5d73;margin-top:2px}.leg2 i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.time{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:6px 12px;border-radius:999px;background:#eaf0fa;color:var(--blue);font-weight:700}
.urkunde{text-align:center;padding:22px;border:3px solid var(--blue);border-radius:20px;background:linear-gradient(#fff,#f1f6fd)}.urkunde .big{font-size:2.4rem;font-weight:800;color:var(--blue)}

/* 11.40: Stadtentwicklung nach den Vorgaben (AFB I) */
.tlet{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;font-size:.9rem;margin-right:4px}
.tmap{margin-top:12px}.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.seg4 button{min-height:54px;padding:6px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:.85rem;color:var(--ink)}.seg4 button small{display:block;font-weight:500;font-size:.72rem;color:var(--mut)}.seg4 button img{display:block;width:100%;height:46px;object-fit:cover;border-radius:6px;margin-bottom:4px}
.seg4 button.on{border-color:var(--blue);background:#e4eefb}.seg4 button.ok{border-color:#7cc69a;background:var(--okbg)}.seg4 button.no{border-color:#f0a982;background:var(--badbg)}.seg4 button.sol{border-color:#e8a23a;background:#fff8e1}
.rdq{position:sticky;top:6px;z-index:5;box-shadow:0 6px 18px rgba(30,50,80,.08)}
#hm .map{max-height:260px}
</style></head><body><button type="button" id="who" hidden aria-label="Abgabe-QR zeigen"></button><div class="wrap" id="app"></div><div id="printBox"></div>
<script src="qr-code.js"></script><script src="unit-pdf.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='cm-stadt-bs-v2';let ST={};try{ST=JSON.parse(localStorage.getItem(KEY)||'null')||null}catch{}
/* 11.40: neue Fassung nach den Vorgaben – Name, Klasse und Gerät aus der alten Fassung übernehmen */
if(!ST){ST={};try{const o=JSON.parse(localStorage.getItem('cm-stadt-bs-v1')||'{}')||{};for(const k of ['me','name','cls','roster','dv'])if(o[k]!=null)ST[k]=o[k]}catch{}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch{}try{updWho()}catch{}};
let CURK=null;function goStep(k){const x=STEPS.find(y=>y[0]===k);if(!x)return home();CURK=k;if(SOLV&&!ST[k])try{solveK(k)}catch(e){console.warn(e)}x[4]();scrollTo(0,0)}
function frame(title,inner){if(CURK){const x=STEPS.find(y=>y[0]===CURK);if(x)title=x[1]}const i=CURK?STEPS.findIndex(x=>x[0]===CURK):-1,nx=i>=0?STEPS[i+1]:null,done=CURK&&ST[CURK];
 app.innerHTML='<div class="top"><button class="back" data-home>‹ Übersicht</button><div class="sp"></div><b>'+(i>=0?(i+1)+' · ':'')+esc(title)+'</b></div>'+inner+(i>=0?'<div class="row nextrow"><button class="sec" data-home2>‹ Übersicht</button><div class="sp"></div>'+(nx?'<button class="'+(done?'pri':'sec')+'" data-nextst>Weiter: '+esc(nx[1])+' ›</button>':'')+'</div>':'');
 app.querySelector('[data-home]').onclick=home;const h2=app.querySelector('[data-home2]');if(h2)h2.onclick=home;const n=app.querySelector('[data-nextst]');if(n)n.onclick=()=>goStep(nx[0])}
const fb=(ok,txt)=>'<div class="fb '+(ok?'ok':'no')+'">'+txt+'</div>';
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
/* Punkte zählen beim ersten Versuch; danach darf man verbessern (zum Lernen) */
const fin=(k,p,t,x)=>{if(!ST[k]){ST[k]={p,t};if(x&&x.length)ST[k].x=x}save()};
const keep=(k,f)=>{const top=scrollY;f();if(CURK===k)scrollTo(0,top)};

/* ---------- Schulbuch-Material: private Datei (.cmeinheit), nur lokal im Gerät ---------- */
let BOOK=null;const UID='bs-stadt';
const IDB=(mode,fn)=>new Promise((res,rej)=>{try{const r=indexedDB.open('cm-lerneinheiten',1);r.onupgradeneeded=()=>r.result.createObjectStore('u');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('u',mode),q=fn(tx.objectStore('u'));tx.oncomplete=()=>{res(q&&q.result);db.close()};tx.onerror=()=>rej(tx.error)}}catch(e){rej(e)}});
const bookOk=u=>!!(u&&u.type==='classroom-lerneinheit'&&u.id===UID&&Array.isArray(u.maps)&&u.maps.length===4);
const IM={};function bookPrep(){if(!BOOK||!window.cmPdf)return Promise.resolve();const L=[...BOOK.maps.map((m,e)=>['map'+e,m.img]),...Object.entries(BOOK.photos||{}).map(([k,v])=>[k,v.img])].filter(x=>x[1]&&!IM[x[0]]);return Promise.all(L.map(([k,src])=>cmPdf.prep(src).then(r=>{IM[k]=r}).catch(()=>{})))}
async function bookInit(){try{const u=window.CM_EMBED_BOOK||await IDB('readonly',st=>st.get(UID));if(bookOk(u)){BOOK=u;bookPrep();if(!CURK&&!app.querySelector('.names'))home()}}catch{}}
function bookPick(){const i=document.createElement('input');i.type='file';i.style.display='none';document.body.append(i);
 i.onchange=async()=>{const f=i.files[0];i.remove();if(!f)return;try{const u=JSON.parse(await f.text());if(!bookOk(u))throw 0;BOOK=u;bookPrep();try{await IDB('readwrite',st=>st.put(u,UID))}catch{}home()}catch{alert('Diese Datei passt nicht zu dieser Lerneinheit.')}};i.click()}
async function bookDrop(){for(const k in IM)delete IM[k];if(!confirm('Schulbuch-Material von diesem Gerät entfernen? (Deine Ergebnisse bleiben.)'))return;BOOK=null;try{await IDB('readwrite',st=>st.delete(UID))}catch{}home()}
function wireZoom(){app.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{const m=$('#'+b.dataset.zoom),z=m.classList.toggle('zoom');b.textContent=z?'↙︎ Verkleinern':'🔍 Vergrößern'})}
function shuffleOnce(k,a){ST.ord??={};if(!ST.ord[k]||ST.ord[k].length!==a.length){ST.ord[k]=shuffle(a);save()}return ST.ord[k]}

/* ---------- Ziehen (Finger oder Maus) – Tippen geht immer auch ---------- */
function dragify(onDrop){app.querySelectorAll('[data-dg]').forEach(el=>el.addEventListener('pointerdown',e=>{if(e.button)return;const sx=e.clientX,sy=e.clientY;let g=null,ox=0,oy=0,hov=null;
 const mv=ev=>{if(!g){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;const r=el.getBoundingClientRect();g=el.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-dg');g.style.width=r.width+'px';ox=sx-r.left;oy=sy-r.top;document.body.append(g);el.style.opacity='.3'}
  ev.preventDefault();g.style.left=(ev.clientX-ox)+'px';g.style.top=(ev.clientY-oy)+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop]');if(t!==hov){hov?.classList.remove('hov');hov=t;hov?.classList.add('hov')}};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(!g)return;g.remove();el.style.opacity='';hov?.classList.remove('hov');el.dataset.moved='1';setTimeout(()=>delete el.dataset.moved,60);
  const t=ev.type==='pointerup'?document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop]'):null;if(t)onDrop(el.dataset.dg,t.dataset.drop)};
 addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up)}))}

/* 11.47: Lehrkraft-Vorschau – „Lösungen“ zeigt jede Station schon richtig gelöst (in der Seite), „Lösungsblatt“ alles auf einer Seite */
let SOLV=false,SNAP=null;
function solveW(type,k,o){const T=n=>{ST[k]={p:n,t:n}};
 if(type==='sorter'){const pl={};o.items.forEach((it,i)=>pl[i]=[].concat(it[1])[0]);ST[k+'P']=pl;ST[k+'R']=2;ST[k+'S']=[];T(o.items.length)}
 else if(type==='swiper'){const ord=shuffleOnce(k,o.cards.map((_,i)=>i));ST[k+'A']=ord.map(i=>!!o.cards[i][1]);T(o.cards.length)}
 else if(type==='quiz'){ST[k+'A']=o.qs.map(q=>q[2]);T(o.qs.length)}}
const solvePairs=()=>{ST.begP={ok:PAIRS.map((_,i)=>i),err:[],sol:[],n:{}};ST.beg={p:PAIRS.length,t:PAIRS.length}};
function solveK(k){if(k==='beg')solvePairs();else if(k==='txt'){const X=txSrc();ST.txtA={...X.PH};ST.txtR=2;ST.txtXA=[];ST.txtB=TQ.map((q,i)=>({w:[],r:X.ans[i],e:1}));ST.txt={p:4+TQ.length,t:4+TQ.length}}else if(k==='bf'){const Q=findQs();ST.bfA=Q.map(()=>({n:1,ok:1,e:1}));ST.bf={p:Q.length,t:Q.length}}else if(k==='bfe'){const F=featL();ST.feS={},ST.feR={},ST.feP={},ST.feX={};F.forEach((f,e)=>{ST.feS[e]=f.map((x,i)=>x[1]?i:-1).filter(i=>i>=0);ST.feR[e]=2;ST.feP[e]=ST.feS[e].length;ST.feX[e]=[]});const t=F.reduce((a,f)=>a+f.filter(x=>x[1]).length,0);ST.bfe={p:t,t}}else if(k==='line'){ST.lineS=LINE.map((_,i)=>i);ST.lineR=2;ST.lineX=[];ST.line={p:LINE.length,t:LINE.length}}}
/* ---------- Bausteine ---------- */
/* Zuordnen: Karten in Gruppen ziehen (oder Karte und dann Gruppe antippen).
   11.34: Nicht raten – nach „Prüfen“ sind richtige Karten fest; für falsche gibt es genau einen zweiten Versuch (ohne Punkte), danach steht die Lösung da. */
const tries=(r,N,wrong)=>r===0?'':r===1?fb(0,'⚠︎ '+(N-wrong)+' von '+N+' richtig – diese Punkte zählen. Die falschen Karten liegen wieder oben: <b>ein</b> zweiter Versuch (ohne Punkte).'):'';
function sorter(k,o){if(SOLV&&!ST[k])solveW('sorter',k,o);let pick=null;const pl=ST[k+'P']??={},N=o.items.length,R=()=>ST[k+'R']||0,sol=ST[k+'S']??=[];const ord=shuffleOnce(k,o.items.map((_,i)=>i));
 const fixed=i=>R()>0&&pl[i]===o.items[i][1];
 const draw=()=>keep(k,()=>{const n=Object.keys(pl).length,r=R();
  frame(o.title,(typeof o.before==='function'?o.before():o.before||'')+'<div class="card"><h2>'+o.h+'</h2><p style="margin:0">'+o.task+' <b>'+n+' von '+N+'</b></p><div class="pool" style="margin-top:12px">'+ord.map(i=>pl[i]==null?'<button class="chip'+(pick===i?' on':'')+(r===1?' retry':'')+'" data-c="'+i+'" data-dg="'+i+'">'+esc(o.items[i][0])+'</button>':'').join('')+(n===N&&r<2?'<span class="muted">Alle Karten liegen in einer Gruppe.</span>':'')+'</div>'
   +'<div class="cols c'+o.cats.length+'">'+o.cats.map((c,e)=>'<div class="col'+(pick!=null?' tgt':'')+'" data-col="'+e+'" data-drop="'+e+'"><h3>'+esc(c)+'</h3>'+ord.map(i=>pl[i]!==e?'':sol.includes(i)?'<span class="chip sol" title="richtige Lösung">'+esc(o.items[i][0])+'</span>':fixed(i)?'<span class="chip ok">'+esc(o.items[i][0])+'</span>':'<button class="chip" data-back="'+i+'" data-dg="'+i+'">'+esc(o.items[i][0])+'</button>').join('')+'</div>').join('')+'</div>'
   +(r<2?'<div class="row"><div class="sp"></div><button class="pri" data-chk '+(n<N?'disabled':'')+'>'+(r?'Zweiter Versuch: prüfen':'Prüfen')+'</button></div>':'')
   +(r===1?tries(1,N,N-ST[k].p):r===2?(ST[k].p===N?fb(1,'⭐ Alles auf Anhieb richtig! '+(o.done||'')):fb(0,ST[k].p+' von '+N+' beim ersten Versuch richtig. '+(sol.length?'Gelb umrandet: die richtige Lösung. ':'')+(o.done||''))):'')+'</div>'+(o.after||''));
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(b.dataset.moved)return;pick=pick===+b.dataset.c?null:+b.dataset.c;draw()});
  app.querySelectorAll('[data-col]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-back]')||pick==null)return;pl[pick]=+c.dataset.col;pick=null;save();draw()});
  app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(b.dataset.moved)return;delete pl[+b.dataset.back];save();draw()});
  dragify((i,e)=>{if(fixed(+i)||R()>=2)return;pl[+i]=+e;pick=null;save();draw()});
  const chk=app.querySelector('[data-chk]');if(chk)chk.onclick=()=>{const wrong=o.items.map((x,i)=>pl[i]===x[1]?-1:i).filter(i=>i>=0);
   if(R()===0){fin(k,N-wrong.length,N,wrong);if(wrong.length){wrong.forEach(i=>delete pl[i]);ST[k+'R']=1}else ST[k+'R']=2}
   else{wrong.forEach(i=>{pl[i]=o.items[i][1];sol.push(i)});ST[k+'R']=2}save();draw()};
  o.wire?.(draw)});draw()}
/* Wischen: rechts / links */
function swiper(k,o){if(SOLV&&!ST[k])solveW('swiper',k,o);const A=ST[k+'A']??=[];const ord=shuffleOnce(k,o.cards.map((_,i)=>i));let show=null;
 const draw=()=>keep(k,()=>{const n=A.length,N=o.cards.length,cur=n<N?ord[n]:null;
  let deck;if(show!=null){const c=o.cards[show],ok=A[A.length-1]===c[1];deck='<div class="deck"><div class="scard res '+(ok?'ok':'no')+'"><b>'+(ok?'✓ Richtig':'✗ Nicht ganz')+' – '+esc(c[1]?o.r:o.l)+'</b><div>„'+esc(c[0])+'“</div>'+(c[2]?'<div class="muted">'+esc(c[2])+'</div>':'')+'</div></div><div class="swb"><button class="pri" style="border:0" data-nx>'+(n<N?'Nächste Karte ›':'Fertig ›')+'</button></div>'}
  else if(cur!=null)deck='<div class="deck">'+(n+1<N?'<div class="scard under"></div>':'')+'<div class="scard" id="sc"><span class="tag l">'+esc(o.l)+'</span><span class="tag r">'+esc(o.r)+'</span>'+esc(o.cards[cur][0])+'</div></div><div class="swb"><button class="l" data-a="0">← '+esc(o.l)+'</button><button class="r" data-a="1">'+esc(o.r)+' →</button></div>';
  else deck=fb(ST[k].p===N,(ST[k].p===N?'⭐ ':'')+ST[k].p+' von '+N+' richtig.'+(o.done?' '+o.done:''))+'<ul class="sumli">'+ord.map((i,j)=>{const c=o.cards[i],ok=A[j]===c[1];return '<li class="'+(ok?'ok':'no')+'"><i>'+(ok?'✓':'✗')+'</i><span><b>'+esc(c[1]?o.r:o.l)+':</b> '+esc(c[0])+'</span></li>'}).join('')+'</ul>';
  const bf=typeof o.before==='function'?o.before():o.before||'',main='<div class="card"><h2>'+o.h+'</h2><div class="prog"><span>'+o.task+'</span><span class="sp" style="flex:1"></span><span>'+Math.min(n+(show==null&&n<N?1:0),N)+' von '+N+'</span></div>'+deck+'</div>';
  frame(o.title,(bf?'<div class="two sw2"><div>'+bf+'</div><div>'+main+'</div></div>':main)+(o.after||''));
  const ans=v=>{const c=o.cards[cur];A.push(!!v);show=cur;if(A.length===N)fin(k,ord.filter((i,j)=>A[j]===o.cards[i][1]).length,N,ord.filter((i,j)=>A[j]!==o.cards[i][1]));else save();draw()};
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>ans(b.dataset.a==='1'));
  const nx=app.querySelector('[data-nx]');if(nx)nx.onclick=()=>{show=null;draw()};
  const sc=$('#sc');if(sc){let x0=null,dx=0;const tl=sc.querySelector('.tag.l'),tr=sc.querySelector('.tag.r');
   sc.onpointerdown=e=>{x0=e.clientX;dx=0;sc.setPointerCapture(e.pointerId);sc.style.transition='none'};
   sc.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;sc.style.transform='translateX('+dx+'px) rotate('+dx/18+'deg)';tl.style.opacity=Math.max(0,-dx/90);tr.style.opacity=Math.max(0,dx/90)};
   sc.onpointerup=sc.onpointercancel=()=>{if(x0==null)return;x0=null;sc.style.transition='transform .25s';if(Math.abs(dx)>90){sc.style.transform='translateX('+(dx>0?600:-600)+'px) rotate('+(dx>0?25:-25)+'deg)';setTimeout(()=>ans(dx>0),180)}else{sc.style.transform='';tl.style.opacity=0;tr.style.opacity=0}}}
  o.wire?.(draw)});draw()}
/* Antippen: Fragen mit drei Antworten */
function quiz(k,o){if(SOLV&&!ST[k])solveW('quiz',k,o);const A=ST[k+'A']??=[];let qi=SOLV?0:Math.min(A.length,o.qs.length-1);
 const draw=()=>keep(k,()=>{const q=o.qs[qi],a=A[qi],N=o.qs.length;
  frame(o.title,(typeof o.before==='function'?o.before():o.before||'')+'<div class="card"><div class="prog"><span>Frage '+(qi+1)+' von '+N+'</span><div class="bar"><i style="width:'+(A.length/N*100)+'%"></i></div></div><p style="font-size:1.1rem;margin:0 0 10px"><b>'+esc(q[0])+'</b></p>'
   +q[1].map((x,j)=>'<button class="opt'+(a!=null?(j===q[2]?' ok':j===a?' no':''):'')+'" data-o="'+j+'">'+esc(x)+'</button>').join('')
   +(a!=null?fb(a===q[2],(a===q[2]?'✓ ':'')+esc(q[3]||''))+'<div class="row"><button class="sec" data-pq '+(qi?'':'disabled')+'>‹</button><div class="sp"></div>'+(qi<N-1?'<button class="pri" data-nq>Nächste Frage ›</button>':'')+'</div>':'')+'</div>'+(A.length===N&&o.end?o.end():'')+(o.after||''));

 wire:()=>{const nm=$('#nm');if(nm)nm.oninput=e=>{ST.name=e.target.value;save()};const p=app.querySelector('[data-pdf]');if(p)p.onclick=()=>savePdf(p);const q=app.querySelector('[data-qr]');if(q)q.onclick=showQr}});

/* ---------- Startseite ---------- */
/* Stationstitel nennen immer den konkreten Inhalt – Material und Aufgabenform stehen darunter */
const STEPS=[['gru','Furt, Burg, Kloster: Wo Städte entstanden','{B}M2 · Aussagen wischen',1.5,runGru],['beg','Stadtmauer, Residenz­stadt, Suburbani­sierung','Begriff und Erklärung verbinden',2,runBeg],['sort','Mauer, Festung, Bahnhof, Fußgänger­zone','Merkmale den vier Phasen zuordnen',2.5,runSort],['txt','Phasen der Stadt­entwicklung','{T}M4 · Karte zuordnen, Belege antippen',4,runTxt],['bf','Burgplatz und Residenz­schloss','{K}M1 {K}M5 · in vier Karten antippen',2.5,runFind],['bfe','Braunschweig 1400, 1775, 1875, heute','{K}M1 {K}M5 · Merkmale antippen',2.5,runFeat],['line','Von der Burg zum Einkaufs­zentrum','Braunschweigs Geschichte · Reihenfolge antippen',2,runLine],['quiz','Spuren im heutigen Stadtbild','Ringstraße, Schloss, Bäckerstraße · antippen',2,runQuiz],['end','Was ich jetzt weiß','5 Fragen · Urkunde · Unterlagen',1,runEnd]];
const TOTMIN=Math.round(STEPS.reduce((a,s)=>a+s[3],0));
function home(){CURK=null;const st=k=>ST[k]?'<span class="st done">'+(ST[k].p!=null?ST[k].p+'/'+ST[k].t:'✓')+'</span>':'<span class="st">offen</span>';
 const startK=(STEPS.find(s=>!ST[s[0]])||[])[0];
 app.innerHTML='<div class="card hero"><div><div class="muted">Erdkunde · Klasse 8 · Das Beispiel Braunschweig</div><h1>Historische Stadtentwicklung in Deutschland</h1><p>Vom Markt hinter der Stadtmauer bis zur Fußgängerzone: In neun kurzen Stationen lernst du die vier Phasen der Stadtentwicklung kennen – mit Wischen, Ziehen und Antippen.</p><span class="badge">⭐ '+STEPS.filter(x=>ST[x[0]]).length+' von '+STEPS.length+' Stationen</span><span class="time">⏱ ca. '+TOTMIN+' Minuten</span></div><div id="hm">'+mapSvg({labels:false})+'</div></div>'
  +'<div class="steps">'+STEPS.map(([k,t,d,m],i)=>'<button class="step'+(k===startK?' start':'')+'" data-s="'+k+'"><span class="n">'+(i+1)+'</span><span><b>'+t+'</b>'+(k===startK?'<span class="go">'+(i?'Weiter hier':'Starte hier')+'</span>':'')+'<small>'+cmMat(d)+'<span class="min">· '+String(m).replace('.',',')+' min</span></small></span>'+st(k)+'</button>').join('')+'</div>'
  +(BOOK?'<div class="bksrc">📘 Schulbuch-Material geladen: '+esc(BOOK.source)+' · <button class="lnk" data-drop>Vom Gerät entfernen</button></div>':'<div class="bkload"><span>📘 Mit den Karten und Texten aus dem Schulbuch arbeiten (M1–M5)? Lade die Datei von deiner Lehrkraft (z. B. per AirDrop). Ohne Datei arbeitest du mit einer vereinfachten Karte und eigenen Texten.</span><button class="sec" data-load>Schulbuch-Datei laden …</button></div>');
 setEra($('#hm'),3);app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>goStep(b.dataset.s));const L=app.querySelector('[data-load]');if(L)L.onclick=bookPick;const D=app.querySelector('[data-drop]');if(D)D.onclick=bookDrop;scrollTo(0,0)}


/* ---------- Abgabe-QR (wie „Städte im Wandel“) ---------- */
ST.dv??=Math.random().toString(36).slice(2,10);
(()=>{const h=location.hash;if(!/^#k1\./.test(h))return;try{let x=h.slice(4).replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';const b=atob(x),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const j=JSON.parse(new TextDecoder().decode(u));
 if(Array.isArray(j.n)&&j.n.length){if(ST.cls!==j.c||!j.n.includes(ST.me))ST.me=null;ST.cls=String(j.c||'');ST.roster=j.n.map(String)}}catch{}try{history.replaceState(null,'',location.pathname+location.search)}catch{}})();
const doneCount=()=>STEPS.filter(x=>ST[x[0]]).length;
/* 11.33: nur Punkte je Station und die Nummern der Fehler – passt immer in einen QR-Code */
function payload(){const sv={},x={};for(const [k] of STEPS){const v=ST[k];if(v){sv[k]=v.p!=null?[v.p,v.t]:1;if(v.x&&v.x.length)x[k]=v.x.join('.')}}
 return 'CMLE1:'+JSON.stringify({u:UID,v:2,c:ST.cls||'',n:ST.me,dv:ST.dv,ts:Date.now(),b:BOOK?1:0,s:sv,x})}
const qrSvg=(t,o)=>{try{return classroomQrSvg(t,Object.assign({ecc:'L',boost:false,dark:'#243247',border:2},o||{}))}catch{return ''}};
let whoT=0;function updWho(){clearTimeout(whoT);whoT=setTimeout(()=>{const w=$('#who');if(!w)return;document.body.classList.add('has-who');w.hidden=false;
 if(!ST.me){w.className='noname';w.innerHTML='<span><b>Abgabe-QR</b><small>Name wählen</small></span>';return}
 w.className='';w.innerHTML='<span><b>'+esc(ST.me)+'</b><small>'+doneCount()+' von '+STEPS.length+' ✓</small></span><svg viewBox="0 0 24 24" fill="#243247" aria-hidden="true"><path d="M3 3h8v8H3zM5 5v4h4V5zM13 3h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zM13 13h3v3h-3zM18 13h3v3h-3zM13 18h3v3h-3zM18 18h3v3h-3zM16 16h2v2h-2z"/></svg>'},30)}
async function packQr(){return [payload()]}
async function showQr(){if(!ST.me){runWho();return}const codes=await packQr();let k=0;const o=document.createElement('div');o.className='qrfull';
 const draw=()=>{o.innerHTML='<div class="muted">Abgabe · Stadtentwicklung'+(ST.cls?' · '+esc(ST.cls):'')+'</div><div class="nm">'+esc(ST.me)+'</div>'+(codes.length>1?'<div class="qn">Code '+(k+1)+' von '+codes.length+'</div>':'')+qrSvg(codes[k],{border:3})
  +(codes.length>1?'<div class="qprog">'+codes.map((_,i)=>'<i class="'+(i<=k?'on':'')+'"></i>').join('')+'</div>':'')+'<div class="muted" style="font-size:.9rem">Stand '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' · '+doneCount()+' von '+STEPS.length+' Stationen'+(codes.length>1?' · nach dem Scannen „Nächster Code“':'')+'</div>'
  +'<div class="row" style="justify-content:center;margin-top:4px">'+(codes.length>1?'<button class="sec" data-pv '+(k?'':'disabled')+'>‹ Zurück</button>'+(k<codes.length-1?'<button class="pri" data-nx>Nächster Code ›</button>':'<button class="pri" data-c>Fertig</button>'):'<button class="pri" data-c>Schließen</button>')+'</div>'+(codes.length>1&&k<codes.length-1?'<button class="lnk" data-c style="font-size:.85rem">Schließen</button>':'')+'<button class="lnk" data-ch style="font-size:.85rem">Nicht dein Name? Ändern</button>';
  o.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>o.remove());const nx=o.querySelector('[data-nx]'),pv=o.querySelector('[data-pv]');if(nx)nx.onclick=()=>{k++;draw()};if(pv)pv.onclick=()=>{if(k){k--;draw()}};
  o.querySelector('[data-ch]').onclick=()=>{if(confirm('Deinen Namen wirklich ändern? Deine Lehrkraft sieht den neuen Namen.')){o.remove();runWho(true)}}};
 draw();document.body.append(o)}
function runWho(force){const R=ST.roster||[];let pick=ST.me&&!force?ST.me:null;
 const draw=()=>{frame('Dein Name',R.length?'<div class="card"><h2>Stadtentwicklung'+(ST.cls?' · '+esc(ST.cls):'')+'</h2><p style="margin:4px 0 0">Tippe auf deinen Namen. Er steht später groß über deinem Abgabe-QR.</p><div class="names">'+R.map(n=>'<button class="'+(n===pick?'on':'')+'" data-n="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div><div class="row"><div class="sp"></div><button class="pri" data-ok '+(pick?'':'disabled')+'>'+(pick?'Das bin ich: '+esc(pick):'Namen antippen')+'</button></div></div>'
  :'<div class="card"><h2>Dein Name</h2><p style="margin:4px 0 10px">Scanne den Start-QR deiner Lehrkraft – dann kannst du deinen Namen aus der Liste wählen. Oder trage ihn hier ein (Vor- und Nachname):</p><input id="nmIn" value="'+esc(pick||'')+'" placeholder="Vorname Nachname" style="width:100%;min-height:50px;padding:0 12px;border:1px solid #cfd8e6;border-radius:12px;font:inherit"><div class="row"><div class="sp"></div><button class="pri" data-ok>Speichern</button></div></div>');
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{pick=b.dataset.n;draw()});const inp=$('#nmIn');if(inp)inp.oninput=()=>{pick=inp.value.trim()};
  app.querySelector('[data-ok]').onclick=()=>{if(!pick||pick.length<2)return;ST.me=pick;if(!ST.name)ST.name=pick;save();home()}};draw()}
$('#who').onclick=showQr;
save();if(ST.roster&&!ST.me)runWho();else home();updWho();bookInit();

/* 11.42: Lehrkraft-Vorschau – Knopf „Lösungen“ */
window.cmPreviewSolutions=on=>{if(on&&!SOLV){SNAP=JSON.stringify(ST);SOLV=true}else if(!on&&SOLV){SOLV=false;try{ST=JSON.parse(SNAP)}catch{}}if(CURK)goStep(CURK);else home()};
window.cmSolutionSheet=on=>cmPdf.solutions(on,pdfBlocks);
</script></body></html>
