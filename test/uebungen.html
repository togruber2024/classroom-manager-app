<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><meta name="robots" content="noindex">
<title>Latein-Übungen</title>
<!-- 11.03: Interaktive iPad-Übungen des Classroom-Managers – Relativpronomen sowie Perfekt und Plusquamperfekt Passiv.
     Alle Sätze sind eigene Übungssätze (keine Lehrbuchtexte). Läuft nach dem Laden ohne Internet; nichts wird an einen Server geschickt. -->
<style>
:root{--blue:#2f5f9b;--ink:#243247;--mut:#66758a;--line:#dce3ef;--bg:#f6f8fc;--ok:#1f8a4c;--okbg:#e5f5ea;--bad:#c2410c;--badbg:#fdeee6}

.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top .sp{flex:1}
.back{height:44px;padding:0 14px;border:1px solid #b9c6da;border-radius:10px;background:#fff;color:var(--blue)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:14px}
.topic{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.topic h2 small{display:block;font-size:.85rem;font-weight:500;color:var(--mut);margin-top:2px}
.ex{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;padding:12px 14px;min-height:64px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}
.ex:hover{background:#f4f8fe}.ex b{display:block}.ex small{color:var(--mut)}.ex .ic{flex:none;width:40px;height:40px;border-radius:12px;background:#eaf0fa;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}
.lv{flex:none;margin-left:auto;display:flex;gap:3px}.lv i{width:9px;height:9px;border-radius:50%;background:#d6deea}.lv i.on{background:var(--blue)}
.stars{flex:none;font-size:.85rem;color:var(--mut);min-width:44px;text-align:right}.stars.done{color:var(--ok);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--mut);font-size:.9rem}.bar{flex:1;height:8px;border-radius:4px;background:#e6ebf3;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.task{font-size:1.15rem;margin:0 0 14px}.big{font-size:2rem;font-weight:800;color:var(--blue);letter-spacing:.3px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col h3{margin:0 0 6px;font-size:.85rem;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.5px}
.opt{display:block;width:100%;min-height:48px;margin:0 0 8px;padding:8px 12px;border:1px solid #cfd8e6;border-radius:12px;background:#fff;font-size:1.05rem}
.opt.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650}
.opt.ok{background:var(--okbg);border-color:#7cc69a;color:var(--ok);font-weight:700}.opt.no{background:var(--badbg);border-color:#f0a982;color:var(--bad)}
.live{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 4px;min-height:64px;border:2px dashed #cfd8e6;border-radius:14px;font-size:1.6rem;font-weight:800;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}.row .sp{flex:1}
.pri{min-height:48px;padding:0 22px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:650}.pri:disabled{opacity:.4}
.sec{min-height:48px;padding:0 18px;border:1px solid #b9c6da;border-radius:12px;background:#fff;color:var(--blue)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}.fb[hidden]{display:none}
.sent{position:relative;font-size:1.45rem;line-height:2.4;padding:18px 10px 10px;user-select:none;-webkit-user-select:none;touch-action:none}
.w{position:relative;z-index:1;display:inline-block;padding:0 6px;margin:0 1px;border-radius:9px;transition:background .15s}
.w.tap{cursor:pointer;border-bottom:2px dotted #b9c6da}.w.tap:hover{background:#eef3fa}
.w.rel{background:#fde7c2;color:#8a4b00;font-weight:750;cursor:grab;border:0}
.w.ok{background:var(--okbg);color:var(--ok);font-weight:750}.w.no{background:var(--badbg);color:var(--bad)}
.w.mark{background:#eaf0fa}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.fun{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.fun .opt{display:flex;align-items:center;gap:10px}.fun .opt i{flex:none;width:14px;height:14px;border-radius:4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}.tile{min-width:64px;min-height:50px;padding:0 14px;border:1px solid #cfd8e6;border-radius:12px;background:#fff;font-size:1.15rem;font-weight:650}
.tile.on{background:var(--blue);border-color:var(--blue);color:#fff}.tile.ok{background:var(--okbg);border-color:#7cc69a;color:var(--ok)}.tile.no{background:var(--badbg);border-color:#f0a982;color:var(--bad)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:90px;height:56px;padding:0 12px;border-radius:12px;background:#f1f4f9;color:#9aa6b6;font-size:1.4rem;font-weight:800}
.slot.f{background:#eaf0fa;color:var(--blue)}
.grp{margin-top:14px}.grp h3{margin:0 0 6px;font-size:.85rem;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.5px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--blue)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.gap{display:inline-block;min-width:150px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue);font-weight:800}
.res{text-align:center;padding:30px 20px}.res .big{font-size:3rem}
.hint{font-size:.9rem;color:var(--mut);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 0;font-size:.9rem;color:var(--mut)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px}
@media (max-width:700px){.cols{grid-template-columns:1fr}.fun,.choices{grid-template-columns:1fr}.sent{font-size:1.2rem}}
</style></head><body><div class="wrap" id="app"></div>
<script>
'use strict';
/* ---------- Daten (eigene Übungssätze) ---------- */
const KAS=['Nom.','Gen.','Dat.','Akk.','Abl.'],NUM=['Sg.','Pl.'],GEN=['m','f','n'];
const RP={m:[['quī','cuius','cui','quem','quō'],['quī','quōrum','quibus','quōs','quibus']],f:[['quae','cuius','cui','quam','quā'],['quae','quārum','quibus','quās','quibus']],n:[['quod','cuius','cui','quod','quō'],['quae','quōrum','quibus','quae','quibus']]};
const rp=(k,n,g)=>RP[g][n][k];
const RP_FORMS=['quī','quae','quod','cuius','cui','quem','quam','quō','quā','quōrum','quārum','quibus','quōs','quās'];
/* Sätze: Wörter; rel = Index Relativpronomen (eine Präposition davor wird mit markiert); ref = Bezugswort; fn = Satzgliedfunktion; de = Übersetzung */
const SENT=[
 {w:['Puella,','quam','Marcus','amat,','in','forō','stat.'],rel:1,ref:0,fn:'obj',why:'quam: Akk. Sg. f. → Objekt zu „amat“',de:'Das Mädchen, das Marcus liebt, steht auf dem Forum.'},
 {w:['Servī,','quī','in','agrīs','labōrant,','fessī','sunt.'],rel:1,ref:0,fn:'sub',why:'quī: Nom. Pl. m. → Subjekt zu „labōrant“',de:'Die Sklaven, die auf den Feldern arbeiten, sind müde.'},
 {w:['Templum,','quod','in','colle','stat,','magnum','est.'],rel:1,ref:0,fn:'sub',why:'quod: Nom. Sg. n. → Subjekt zu „stat“',de:'Der Tempel, der auf dem Hügel steht, ist groß.'},
 {w:['Senātor,','cuius','fīlius','aeger','est,','domī','manet.'],rel:1,ref:0,fn:'att',why:'cuius: Gen. Sg. → Attribut zu „fīlius“',de:'Der Senator, dessen Sohn krank ist, bleibt zu Hause.'},
 {w:['Amīcae,','quibus','dōna','dedī,','valdē','gaudent.'],rel:1,ref:0,fn:'obj',why:'quibus: Dat. Pl. f. → Dativobjekt zu „dedī“',de:'Die Freundinnen, denen ich Geschenke gegeben habe, freuen sich sehr.'},
 {w:['Mīlitēs','hostēs,','quōs','vīderant,','statim','petīvērunt.'],rel:2,ref:1,fn:'obj',why:'quōs: Akk. Pl. m. → Objekt zu „vīderant“',de:'Die Soldaten griffen die Feinde, die sie gesehen hatten, sofort an.'},
 {w:['Urbs,','in','quā','habitāmus,','pulchra','est.'],rel:2,ref:0,fn:'adv',why:'in quā: Ort → adverbiale Bestimmung',de:'Die Stadt, in der wir wohnen, ist schön.'},
 {w:['Librī,','quōrum','auctor','clārus','est,','in','mēnsā','iacent.'],rel:1,ref:0,fn:'att',why:'quōrum: Gen. Pl. → Attribut zu „auctor“',de:'Die Bücher, deren Autor berühmt ist, liegen auf dem Tisch.'},
 {w:['Marcus','amīcum','videt,','cum','quō','saepe','lūdit.'],rel:4,ref:1,fn:'adv',why:'cum quō: mit wem → adverbiale Bestimmung',de:'Marcus sieht den Freund, mit dem er oft spielt.'},
 {w:['Fēmina,','cui','servus','epistulam','dat,','rīdet.'],rel:1,ref:0,fn:'obj',why:'cui: Dat. Sg. → Dativobjekt zu „dat“',de:'Die Frau, der der Sklave einen Brief gibt, lacht.'}
];
const FN={sub:['Subjekt','#2f5f9b'],obj:['Objekt (Akk./Dat.)','#1f8a4c'],adv:['adverbiale Bestimmung','#b45309'],att:['Attribut','#7c3aed']};
/* Verben: Infinitiv, PPP-Stamm (ohne Endung), Bedeutung */
const VERBS=[['vocāre','vocāt','rufen'],['laudāre','laudāt','loben'],['servāre','servāt','retten'],['līberāre','līberāt','befreien'],['monēre','monit','ermahnen'],['terrēre','territ','erschrecken'],['audīre','audīt','hören'],['pūnīre','pūnīt','bestrafen'],['capere','capt','fangen'],['mittere','miss','schicken'],['dūcere','duct','führen'],['dare','dat','geben'],['relinquere','relict','zurücklassen'],['dēfendere','dēfēns','verteidigen'],['scrībere','scrīpt','schreiben'],['facere','fact','machen'],['accipere','accept','annehmen'],['invenīre','invent','finden']];
const ESSE={pf:['sum','es','est','sumus','estis','sunt'],pq:['eram','erās','erat','erāmus','erātis','erant']};
const END={m:['us','ī'],f:['a','ae'],n:['um','a']};
const PERS=['1. Sg.','2. Sg.','3. Sg.','1. Pl.','2. Pl.','3. Pl.'];
const TN={pf:'Perfekt',pq:'Plusquamperfekt'},GN={m:'männlich',f:'weiblich',n:'sächlich'};
const form=(v,p,t,g)=>v[1]+END[g][p>=3?1:0]+' '+ESSE[t][p];
const KONGS=[
 {pre:'Servī ā dominō',post:'.',v:'vocāre',p:5,t:'pf',g:'m',de:'Die Sklaven sind vom Herrn gerufen worden.'},
 {pre:'Urbs ab hostibus',post:'.',v:'capere',p:2,t:'pf',g:'f',de:'Die Stadt ist von den Feinden eingenommen worden.'},
 {pre:'Templum ā Rōmānīs',post:'.',v:'facere',p:2,t:'pf',g:'n',de:'Der Tempel ist von den Römern gebaut worden.'},
 {pre:'Puellae ā mātre',post:'.',v:'laudāre',p:5,t:'pq',g:'f',de:'Die Mädchen waren von der Mutter gelobt worden.'},
 {pre:'Epistula ā Marcō',post:'.',v:'scrībere',p:2,t:'pf',g:'f',de:'Der Brief ist von Marcus geschrieben worden.'},
 {pre:'Mīlitēs ā duce',post:'.',v:'monēre',p:5,t:'pq',g:'m',de:'Die Soldaten waren vom Anführer ermahnt worden.'},
 {pre:'Dōna amīcīs',post:'.',v:'dare',p:5,t:'pf',g:'n',de:'Die Geschenke sind den Freunden gegeben worden.'},
 {pre:'Nōs ā magistrō',post:'.',v:'audīre',p:3,t:'pf',g:'m',de:'Wir sind vom Lehrer gehört worden.'},
 {pre:'Tū, Iūlia, ā patre',post:'?',v:'servāre',p:1,t:'pq',g:'f',de:'Warst du, Julia, vom Vater gerettet worden?'},
 {pre:'Oppidum ā cīvibus',post:'.',v:'dēfendere',p:2,t:'pq',g:'n',de:'Die Stadt war von den Bürgern verteidigt worden.'}
];
/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const clean=s=>s.replace(/[.,;:?!]/g,'');
let ac=null;const beep=ok=>{try{ac??=new (window.AudioContext||window.webkitAudioContext)();const g=ac.createGain(),o=ac.createOscillator();o.frequency.value=ok?880:240;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch{}};
const KEY='cm-uebungen-v1';const best=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}};
const saveBest=(id,pts,tot)=>{try{const b=best();if(!b[id]||pts/tot>b[id][0]/b[id][1])b[id]=[pts,tot];localStorage.setItem(KEY,JSON.stringify(b))}catch{}};
/* ---------- Startseite ---------- */
const EXS=[
 {id:'r1',topic:'r',lv:1,ic:'qu',t:'Formen-Regler',d:'Kasus, Numerus, Genus einstellen, bis die Form passt',run:()=>runR1()},
 {id:'r2',topic:'r',lv:2,ic:'↗',t:'Bezug ziehen',d:'Vom Relativpronomen eine Linie zum Bezugswort ziehen',run:()=>runR2()},
 {id:'r3',topic:'r',lv:3,ic:'▦',t:'Satzglied markieren',d:'Satzgliedfunktion des Relativpronomens bestimmen',run:()=>runR3()},
 {id:'p1',topic:'p',lv:1,ic:'?',t:'Formen bestimmen',d:'Person, Numerus, Tempus und Infinitiv erkennen',run:()=>runP1()},
 {id:'p2',topic:'p',lv:2,ic:'+',t:'Formen-Baukasten',d:'PPP-Stamm, Endung und esse zusammensetzen',run:()=>runP2()},
 {id:'p3',topic:'p',lv:2,ic:'⏱',t:'Formenschlange',d:'60 Sekunden: so viele Formen wie möglich',run:()=>runP3()},
 {id:'p4',topic:'p',lv:3,ic:'¶',t:'KöNiGs-Regel im Satz',d:'Die passende Passivform in den Satz setzen',run:()=>runP4()}];
function home(){const b=best();const ex=e=>{const r=b[e.id];return '<button class="ex" data-ex="'+e.id+'"><span class="ic">'+e.ic+'</span><span><b>'+esc(e.t)+'</b><small>'+esc(e.d)+'</small></span><span class="lv" title="Stufe '+e.lv+'">'+[1,2,3].map(i=>'<i class="'+(i<=e.lv?'on':'')+'"></i>').join('')+'</span><span class="stars'+(r&&r[0]/r[1]>=.8?' done':'')+'">'+(r?r[0]+'/'+r[1]:'')+'</span></button>'};
 app.innerHTML='<h1>Latein-Übungen</h1><div class="muted">Wähle ein Thema und eine Übung. Die Punkte zeigen die Stufe: ● Grundlagen · ●● Training · ●●● Anwenden.</div><div class="topics">'
  +'<div class="topic"><h2>Relativpronomen<small>quī, quae, quod – Bezugswort und Satzglied</small></h2>'+EXS.filter(e=>e.topic==='r').map(ex).join('')+'</div>'
  +'<div class="topic"><h2>Perfekt und Plusquamperfekt Passiv<small>PPP + Form von esse – KöNiGs-Regel</small></h2>'+EXS.filter(e=>e.topic==='p').map(ex).join('')+'</div></div>';
 app.querySelectorAll('[data-ex]').forEach(x=>x.onclick=()=>EXS.find(e=>e.id===x.dataset.ex).run());scrollTo(0,0)}
function frame(e,inner){app.innerHTML='<div class="top"><button class="back" data-home>‹ Übersicht</button><div class="sp"></div><b>'+esc(e.t)+'</b></div>'+inner;app.querySelector('[data-home]').onclick=home;scrollTo(0,0)}
function result(e,pts,tot,again){saveBest(e.id,pts,tot);const r=pts/tot;frame(e,'<div class="card res"><div class="big">'+pts+' / '+tot+'</div><p style="font-size:1.2rem">'+(r>=.9?'Hervorragend!':r>=.7?'Gut gemacht!':r>=.5?'Schon ordentlich – noch einmal üben?':'Noch einmal versuchen – es wird!')+'</p><div class="row" style="justify-content:center"><button class="sec" data-home2>Zur Übersicht</button><button class="pri" data-again>Noch einmal</button></div></div>');
 app.querySelector('[data-home2]').onclick=home;app.querySelector('[data-again]').onclick=again;beep(r>=.5)}
/* Ablauf: Aufgabenreihe mit Fortschritt; Fehler kommen am Ende noch einmal */
function series(e,items,render,opts={}){let i=0,pts=0;const tot=items.length,queue=[...items],wrong=[];
 const next=()=>{if(i>=queue.length){if(wrong.length&&!opts.noRepeat){queue.push(...wrong.splice(0));if(i<queue.length)return next()}return result(e,pts,tot,()=>e.run())}
  const it=queue[i],retry=i>=tot;frame(e,'<div class="prog"><span>'+(retry?'Wiederholung':'Aufgabe '+(i+1)+' von '+tot)+'</span><div class="bar"><i style="width:'+Math.min(100,i/tot*100)+'%"></i></div><span>'+pts+' P</span></div><div class="card" id="c"></div>');
  render(it,$('#c'),ok=>{if(ok&&!retry)pts++;if(!ok&&!retry)wrong.push(it);i++;next()})};next()}
function feedback(card,ok,text,go){const fb=card.querySelector('.fb')||card.appendChild(Object.assign(document.createElement('div'),{className:'fb'}));fb.className='fb '+(ok?'ok':'no');fb.innerHTML=(ok?'✓ Richtig. ':'✗ Leider nicht. ')+text;fb.hidden=false;beep(ok);
 let row=card.querySelector('.row.nx');if(!row){row=document.createElement('div');row.className='row nx';row.innerHTML='<div class="sp"></div><button class="pri" data-go>Weiter</button>';card.append(row)}row.querySelector('[data-go]').onclick=()=>go(ok);row.querySelector('[data-go]').focus()}
/* ---------- R1 Formen-Regler ---------- */
function runR1(){const e=EXS[0];const items=shuffle(RP_FORMS).slice(0,10);
 series(e,items,(f,c,done)=>{let k=0,n=0,g=0,checked=false;
  c.innerHTML='<p class="task">Stelle die Regler so ein, dass die Form <span class="big">'+esc(f)+'</span> entsteht.</p><div class="hint">Manche Formen passen zu mehreren Einstellungen – jede passende zählt.</div><div class="cols" style="margin-top:12px">'
   +'<div class="col"><h3>Kasus</h3>'+KAS.map((x,i)=>'<button class="opt" data-k="'+i+'">'+x+'</button>').join('')+'</div>'
   +'<div class="col"><h3>Numerus</h3>'+NUM.map((x,i)=>'<button class="opt" data-n="'+i+'">'+x+'</button>').join('')+'</div>'
   +'<div class="col"><h3>Genus</h3>'+GEN.map((x,i)=>'<button class="opt" data-g="'+i+'">'+x+'</button>').join('')+'</div></div>'
   +'<div class="live" id="lv"></div><div class="row"><div class="sp"></div><button class="pri" data-chk>Prüfen</button></div>';
  const upd=()=>{c.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',+b.dataset.k===k));c.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));c.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',+b.dataset.g===g));$('#lv').innerHTML='<span class="muted" style="font-size:1rem;font-weight:500">ergibt</span> '+esc(rp(k,n,GEN[g]))};
  c.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(!checked){k=+b.dataset.k;upd()}});c.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(!checked){n=+b.dataset.n;upd()}});c.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{if(!checked){g=+b.dataset.g;upd()}});upd();
  c.querySelector('[data-chk]').onclick=ev=>{if(checked)return;checked=true;ev.target.remove();const ok=rp(k,n,GEN[g])===f;const all=[];for(const gg of GEN)for(let nn=0;nn<2;nn++)for(let kk=0;kk<5;kk++)if(rp(kk,nn,gg)===f)all.push(KAS[kk]+' '+NUM[nn]+' '+gg);
   feedback(c,ok,esc(f)+' kann sein: '+esc(all.join(' · ')),done)}})}
/* ---------- R2 Bezug ziehen ---------- */
function sentenceHtml(s,mode){return '<div class="sent" id="st"><svg class="lines" id="ln"></svg>'+s.w.map((w,i)=>{const rel=i===s.rel||(i===s.rel-1&&/^(in|cum|ā|ab|ē|ex|dē)$/.test(s.w[i]));return '<span class="w'+(mode==='r2'&&!rel?' tap':'')+(rel?' rel':'')+'" data-i="'+i+'">'+esc(w)+'</span>'}).join(' ')+'</div>'}
function relIdx(s){return s.rel}
function drawLine(from,to,color,dash,add){const st=$('#st'),ln=$('#ln');if(!st||!from||!to)return;const r=st.getBoundingClientRect(),a=from.getBoundingClientRect?from.getBoundingClientRect():null;
 const ax=a?a.left+a.width/2-r.left:from.x-r.left,ay=a?a.top-r.top+4:from.y-r.top,b=to.getBoundingClientRect?to.getBoundingClientRect():null,bx=b?b.left+b.width/2-r.left:to.x-r.left,by=b?b.top-r.top+4:to.y-r.top;
 const lift=Math.max(26,Math.abs(bx-ax)*.25);ln.innerHTML=(add?ln.innerHTML:'')+'<path d="M'+ax+' '+ay+' C'+ax+' '+(ay-lift)+' '+bx+' '+(by-lift)+' '+bx+' '+by+'" fill="none" stroke="'+color+'" stroke-width="3.5" stroke-linecap="round"'+(dash?' stroke-dasharray="7 7"':'')+'/><circle cx="'+bx+'" cy="'+by+'" r="5" fill="'+color+'"/>'}
function runR2(){const e=EXS[1];series(e,shuffle(SENT).slice(0,8),(s,c,done)=>{let fin=false;const ri=relIdx(s);
 c.innerHTML='<p class="task">Ziehe vom <b style="color:#8a4b00">Relativpronomen</b> eine Linie zu seinem Bezugswort – oder tippe das Bezugswort an.</p>'+sentenceHtml(s,'r2')+'<div class="hint">Das Relativpronomen stimmt in Numerus und Genus mit dem Bezugswort überein.</div>';
 const relEl=c.querySelector('.w.rel[data-i="'+ri+'"]')||c.querySelector('.w.rel');
 const choose=wEl=>{if(fin||!wEl||wEl.classList.contains('rel'))return;fin=true;const i=+wEl.dataset.i,ok=i===s.ref;wEl.classList.add(ok?'ok':'no');if(!ok)c.querySelector('.w[data-i="'+s.ref+'"]').classList.add('ok');
  if(!ok)drawLine(relEl,wEl,'#c2410c',true);drawLine(relEl,c.querySelector('.w[data-i="'+s.ref+'"]'),'#1f8a4c',false,!ok);feedback(c,ok,'Bezugswort: <b>'+esc(clean(s.w[s.ref]))+'</b> – '+esc(s.why.split('→')[0])+'<br><span class="muted" style="font-weight:500">'+esc(s.de)+'</span>',done)};
 c.querySelectorAll('.w.tap').forEach(w=>w.onclick=()=>choose(w));
 let drag=false;relEl.addEventListener('pointerdown',ev=>{if(fin)return;drag=true;relEl.setPointerCapture(ev.pointerId);ev.preventDefault()});
 relEl.addEventListener('pointermove',ev=>{if(!drag)return;drawLine(relEl,{x:ev.clientX,y:ev.clientY},'#2f5f9b',true);const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.w.tap');c.querySelectorAll('.w.mark').forEach(x=>x.classList.remove('mark'));el?.classList.add('mark')});
 relEl.addEventListener('pointerup',ev=>{if(!drag)return;drag=false;c.querySelectorAll('.w.mark').forEach(x=>x.classList.remove('mark'));const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.w.tap');if(el)choose(el);else $('#ln').innerHTML=''})})}
/* ---------- R3 Satzglied markieren ---------- */
function runR3(){const e=EXS[2];series(e,shuffle(SENT).slice(0,8),(s,c,done)=>{let fin=false;
 c.innerHTML='<p class="task">Welche Aufgabe hat das <b style="color:#8a4b00">Relativpronomen</b> in seinem Relativsatz?</p>'+sentenceHtml(s,'r3')+'<div class="fun">'+Object.entries(FN).map(([k,[l,col]])=>'<button class="opt" data-f="'+k+'"><i style="background:'+col+'"></i>'+esc(l)+'</button>').join('')+'</div>';
 c.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{if(fin)return;fin=true;const ok=b.dataset.f===s.fn;b.classList.add(ok?'ok':'no');c.querySelector('[data-f="'+s.fn+'"]').classList.add('ok');
  c.querySelectorAll('.w.rel').forEach(w=>{w.style.background=FN[s.fn][1]+'22';w.style.color=FN[s.fn][1]});feedback(c,ok,esc(s.why)+'<br><span class="muted" style="font-weight:500">'+esc(s.de)+'</span>',done)})})}
/* ---------- P1 Formen bestimmen ---------- */
function randForm(){const v=pick(VERBS),p=Math.random()*6|0,t=pick(['pf','pq']),g=pick(p===2||p===5?['m','f','n']:['m','f']);/* „wir/ihr/ich/du“ nie sächlich */return {v,p,t,g,f:form(v,p,t,g)}}
function runP1(){const e=EXS[3];const items=Array.from({length:8},randForm);
 series(e,items,(q,c,done)=>{const sel={p:null,t:null,v:null};let fin=false;const inf=shuffle([q.v,...shuffle(VERBS.filter(x=>x!==q.v)).slice(0,2)]);
  c.innerHTML='<p class="task">Bestimme die Form <span class="big">'+esc(q.f)+'</span></p>'
   +'<div class="grp"><h3>Person und Numerus</h3><div class="tiles">'+PERS.map((x,i)=>'<button class="tile" data-p="'+i+'">'+x+'</button>').join('')+'</div></div>'
   +'<div class="grp"><h3>Tempus</h3><div class="tiles">'+Object.entries(TN).map(([k,l])=>'<button class="tile" data-t="'+k+'">'+l+' Passiv</button>').join('')+'</div></div>'
   +'<div class="grp"><h3>Infinitiv Präsens Aktiv</h3><div class="tiles">'+inf.map(v=>'<button class="tile" data-v="'+v[0]+'">'+esc(v[0])+'</button>').join('')+'</div></div>'
   +'<div class="row"><div class="sp"></div><button class="pri" data-chk disabled>Prüfen</button></div>';
  const upd=()=>{for(const k of ['p','t','v'])c.querySelectorAll('[data-'+k+']').forEach(b=>b.classList.toggle('on',b.dataset[k]===String(sel[k])));c.querySelector('[data-chk]').disabled=Object.values(sel).some(x=>x==null)};
  for(const k of ['p','t','v'])c.querySelectorAll('[data-'+k+']').forEach(b=>b.onclick=()=>{if(!fin){sel[k]=b.dataset[k];upd()}});
  c.querySelector('[data-chk]').onclick=ev=>{fin=true;ev.target.remove();const okP=+sel.p===q.p,okT=sel.t===q.t,okV=sel.v===q.v[0];
   c.querySelector('[data-p="'+sel.p+'"]').className='tile '+(okP?'ok':'no');c.querySelector('[data-t="'+sel.t+'"]').className='tile '+(okT?'ok':'no');c.querySelector('[data-v="'+sel.v+'"]').className='tile '+(okV?'ok':'no');
   if(!okP)c.querySelector('[data-p="'+q.p+'"]').className='tile ok';if(!okT)c.querySelector('[data-t="'+q.t+'"]').className='tile ok';if(!okV)c.querySelector('[data-v="'+q.v[0]+'"]').className='tile ok';
   feedback(c,okP&&okT&&okV,esc(q.f)+' = '+PERS[q.p]+' '+TN[q.t]+' Passiv von <b>'+esc(q.v[0])+'</b> ('+esc(q.v[2])+')',done)}})}
/* ---------- P2 Formen-Baukasten ---------- */
function runP2(){const e=EXS[4];const items=Array.from({length:8},randForm);
 series(e,items,(q,c,done)=>{const sel={s:null,e:null,x:null};let fin=false;const others=shuffle(VERBS.filter(v=>v!==q.v)).slice(0,2);
  const stems=shuffle([q.v[1],...others.map(v=>v[1])]),ends=['us','a','um','ī','ae'],ess=shuffle([...new Set([ESSE[q.t][q.p],ESSE[q.t==='pf'?'pq':'pf'][q.p],ESSE[q.t][(q.p+3)%6],ESSE[q.t][(q.p+1)%6]])]);
  c.innerHTML='<p class="task">Baue: <b>'+esc(q.v[0])+'</b> · '+PERS[q.p]+' · '+TN[q.t]+' Passiv · Subjekt '+GN[q.g]+'</p>'
   +'<div class="live"><span class="slot" id="s1">Stamm</span><span class="slot" id="s2">-…</span><span class="slot" id="s3">esse</span></div>'
   +'<div class="grp"><h3>PPP-Stamm</h3><div class="tiles">'+stems.map(x=>'<button class="tile" data-s="'+x+'">'+esc(x)+'-</button>').join('')+'</div></div>'
   +'<div class="grp"><h3>Endung (KNG wie das Subjekt)</h3><div class="tiles">'+ends.map(x=>'<button class="tile" data-e="'+x+'">-'+esc(x)+'</button>').join('')+'</div></div>'
   +'<div class="grp"><h3>Form von esse</h3><div class="tiles">'+ess.map(x=>'<button class="tile" data-x="'+x+'">'+esc(x)+'</button>').join('')+'</div></div>'
   +'<div class="row"><div class="sp"></div><button class="pri" data-chk disabled>Prüfen</button></div>';
  const upd=()=>{for(const k of ['s','e','x'])c.querySelectorAll('[data-'+k+']').forEach(b=>b.classList.toggle('on',b.dataset[k]===sel[k]));
   const s1=$('#s1'),s2=$('#s2'),s3=$('#s3');s1.textContent=sel.s?sel.s:'Stamm';s1.classList.toggle('f',!!sel.s);s2.textContent=sel.e?'-'+sel.e:'-…';s2.classList.toggle('f',!!sel.e);s3.textContent=sel.x||'esse';s3.classList.toggle('f',!!sel.x);c.querySelector('[data-chk]').disabled=Object.values(sel).some(x=>x==null)};
  for(const k of ['s','e','x'])c.querySelectorAll('[data-'+k+']').forEach(b=>b.onclick=()=>{if(!fin){sel[k]=b.dataset[k];upd()}});
  c.querySelector('[data-chk]').onclick=ev=>{fin=true;ev.target.remove();const want={s:q.v[1],e:END[q.g][q.p>=3?1:0],x:ESSE[q.t][q.p]};const bad=[];
   for(const k of ['s','e','x']){const ok=sel[k]===want[k];c.querySelector('[data-'+k+'="'+sel[k]+'"]').className='tile '+(ok?'ok':'no');if(!ok){c.querySelector('[data-'+k+'="'+want[k]+'"]').className='tile ok';bad.push({s:'Stamm',e:'Endung',x:'esse-Form'}[k])}}
   feedback(c,!bad.length,'Richtig ist <b>'+esc(q.f)+'</b>'+(bad.length?' – prüfe: '+bad.join(', '):'')+'.',done)}})}
/* ---------- P3 Formenschlange (60 s) ---------- */
function runP3(){const e=EXS[5];let left=60,pts=0,tries=0,timer=0,streak=0;
 frame(e,'<div class="card"><div class="row" style="margin-top:0"><b>Zeit: <span class="timer" id="tm">60</span> s</b><div class="sp"></div><b>Richtig: <span id="pt">0</span></b><span class="muted" id="sk"></span></div><div id="q" style="margin-top:14px"></div></div>');
 const ask=()=>{const q=randForm();const wrongs=new Set();const alt=[form(q.v,q.p,q.t==='pf'?'pq':'pf',q.g),form(q.v,(q.p+3)%6,q.t,q.g),form(q.v,q.p,q.t,q.g==='m'?'f':q.g==='f'?'n':'m'),form(q.v,(q.p+1)%6,q.t,q.g)];for(const a of alt)if(a!==q.f)wrongs.add(a);
  const opts=shuffle([q.f,...shuffle([...wrongs]).slice(0,3)]);
  $('#q').innerHTML='<p class="task"><b>'+esc(q.v[0])+'</b> · '+PERS[q.p]+' · '+TN[q.t]+' Passiv · '+GN[q.g]+'</p><div class="choices">'+opts.map(o=>'<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
  $('#q').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(left<=0)return;tries++;const ok=b.dataset.o===q.f;b.classList.add(ok?'ok':'no');if(ok){pts++;streak++}else{streak=0;$('#q').querySelector('[data-o="'+CSS.escape(q.f)+'"]')?.classList.add('ok')}beep(ok);$('#pt').textContent=pts;$('#sk').textContent=streak>=3?'· '+streak+' in Folge!':'';setTimeout(()=>{if(left>0)ask()},ok?350:1100)})};
 ask();timer=setInterval(()=>{left--;const t=$('#tm');if(!t){clearInterval(timer);return}t.textContent=left;if(left<=0){clearInterval(timer);result(e,pts,Math.max(pts,tries)||1,()=>runP3())}},1000)}
/* ---------- P4 KöNiGs-Regel im Satz ---------- */
function runP4(){const e=EXS[6];series(e,shuffle(KONGS).slice(0,8),(k,c,done)=>{const v=VERBS.find(x=>x[0]===k.v),right=form(v,k.p,k.t,k.g);let fin=false;
 const alt=new Set([form(v,k.p,k.t==='pf'?'pq':'pf',k.g),form(v,k.p>=3?k.p-3:k.p+3,k.t,k.g),form(v,k.p,k.t,k.g==='m'?'f':k.g==='f'?'n':'m'),form(v,k.p,k.t,k.g==='n'?'m':'n')]);alt.delete(right);
 const opts=shuffle([right,...shuffle([...alt]).slice(0,3)]);
 c.innerHTML='<p class="task">Setze die passende Form ein <span class="muted">('+esc(k.v)+', '+TN[k.t]+' Passiv)</span>.</p><div class="sent" style="line-height:1.8">'+esc(k.pre)+' <span class="gap" id="gp">?</span>'+esc(k.post)+'</div><div class="choices">'+opts.map(o=>'<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div><div class="hint">KöNiGs-Regel: Das PPP richtet sich in Kasus, Numerus und Genus nach dem Subjekt.</div>';
 c.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(fin)return;fin=true;const ok=b.dataset.o===right;b.classList.add(ok?'ok':'no');c.querySelector('[data-o="'+CSS.escape(right)+'"]').classList.add('ok');$('#gp').textContent=right;
  feedback(c,ok,esc(k.de),done)})})}
addEventListener('resize',()=>{const l=$('#ln');if(l&&l.innerHTML)l.innerHTML=''});
home();
</script></body></html>
